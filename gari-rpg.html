<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ガリゴンクエスト2</title>
<style>
  :root { --bg:#1f1f23; --card:#2b2b31; --card2:#36363d; --ink:#ece6e0; --soft:#a9a39e; --line:#46464e; --orange:#ffb27a; --on:#3d2e24; --mint:#8fd9b0; --red:#f87171; --sky:#cfe3f5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; font-size: 15px; line-height: 1.6; color: var(--ink); background: var(--bg); user-select: none; -webkit-tap-highlight-color: transparent;
         padding: calc(10px + env(safe-area-inset-top, 0px)) 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
  #app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 15px; color: #ffbf93; line-height: 1.3; }
  h1 small { display: block; font-size: 10px; color: var(--soft); font-weight: 400; }
  header div { display: flex; gap: 6px; }
  header button, header a { font: inherit; font-size: 12px; color: var(--ink); background: var(--card2); border: 2px solid var(--line); border-radius: 99px; padding: 2px 12px; text-decoration: none; cursor: pointer; }
  .box { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px; }
  #party { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; min-height: 84px; }
  .hero { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 6px 8px; font-size: 11px; text-align: center; }
  .hero.cur { border-color: var(--orange); }
  .hero.down { opacity: .45; }
  .hero b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 3px 0; }
  .bar i { display: block; height: 100%; background: var(--mint); }
  .bar.mp i { background: #7aa8ff; }
  #stage { height: 130px; display: flex; align-items: center; justify-content: center; background: #17171a; border-radius: 16px; border: 2px solid var(--line); text-align: center; padding: 6px; }
  .big { font-size: 56px; line-height: 1.1; }
  .ttl { font-size: 14px; color: var(--orange); font-weight: 700; }
  .foe .bar { width: 150px; margin: 4px auto 0; }
  .foe .bar i { background: var(--red); }
  #log { min-height: 13.5em; white-space: pre-wrap; font-size: 14px; }
  #cmd { display: flex; flex-direction: column; gap: 8px; min-height: 52px; }
  #cmd p { font-size: 13px; color: var(--sky); }
  #cmd button { font: inherit; font-weight: 700; min-height: 48px; padding: 8px 12px; border-radius: 14px; border: 2px solid #c4824f; background: var(--orange); color: var(--on); cursor: pointer; touch-action: manipulation; }
  #cmd button.sub { background: transparent; color: var(--ink); border-color: var(--line); min-height: 38px; font-weight: 500; font-size: 13px; }
  #cmd button:disabled { opacity: .4; cursor: not-allowed; }
  #cmd button:active:not(:disabled) { transform: translateY(2px); }
  #cmd .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  #cmd .row button { font-size: 13px; padding: 6px 4px; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .note { font-size: 11px; color: var(--soft); text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="h1"></h1>
    <div><button id="restart" type="button">🔄 最初から</button><a href="./index.html">🏠</a></div>
  </header>
  <div id="party"></div>
  <div id="stage"></div>
  <div id="log" class="box" role="log" aria-live="polite"></div>
  <div id="cmd"></div>
  <p class="note">スマホ：ボタンをタップ／PC：Enter・Spaceで進む、1〜4で選ぶ</p>
</div>

<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var rnd = function (n) { return Math.floor(Math.random() * n); };
  var pick = function (a) { return a[rnd(a.length)]; };

  // ===== データ（数値・文章は、ここで調整するよ。数値は仮調整だよ）=====
  var TITLE = 'ガリゴンクエスト2', SUB = '〜絵文字と勢いで世界を救え〜';
  var BASE = {   // 仲間の初期ステータス（勝つたびに、HP+4・攻撃+1・MP+1）
    gari:    { n: 'ガリ',         e: '🐻', hp: 55, mp: 8,  atk: 8 },
    kani:    { n: '質問の蟹',     e: '🦀', hp: 42, mp: 8,  atk: 9 },
    yohei:   { n: '傭兵',         e: '🪖', hp: 62, mp: 6,  atk: 10 },
    sandora: { n: 'サンドゥーラ', e: '😈', hp: 45, mp: 14, atk: 6 },
    takashi: { n: 'たかし',       e: '🐄', hp: 85, mp: 6,  atk: 5 }
  };
  var SK = { gari: ['ガリ火', 3], kani: ['ていねいなハサミ', 3], yohei: ['お金の力', 3], sandora: ['しぶしぶ回復', 3], takashi: ['かばう', 2] };
  var E = {      // 敵。sp＝3ターンごとの全体攻撃
    sock:    { n: '片方だけの靴下', e: '🧦', hp: 28, atk: 6, line: 'ぬくもりを求めてさまよっている！' },
    rat:     { n: 'ドブネズミ', e: '🐀', hp: 36, atk: 7, line: 'チューチュー言って見つめている！' },
    sandora: { n: '魔王サンドゥーラ', e: '😈', hp: 170, atk: 13, sp: { n: '暗黒の大魔法', d: 11 }, line: '「よくぞ来たわね。まとめて消し飛ばしてあげる」' },
    gator:   { n: '沼のヌシ', e: '🐊', hp: 75, atk: 11, line: 'ぬまぬまと近づいてくる！' },
    cactus:  { n: '暴れサボテン', e: '🌵', hp: 85, atk: 12, line: 'トゲトゲしい態度だ！' },
    ghost:   { n: '廃村の幽霊', e: '👻', hp: 90, atk: 13, line: '「うらめしや〜」と、あまり怖くない声で言っている！' },
    eagle:   { n: '山道の鷲', e: '🦅', hp: 100, atk: 14, line: '上空から狙っている！' },
    skel:    { n: '古戦場の亡霊', e: '💀', hp: 115, atk: 15, line: '昔の戦いを、まだ続けている！' },
    kanigod: { n: '破壊神・質問の蟹', e: '🦀', hp: 330, atk: 19, sp: { n: '質問攻め', d: 14 }, line: '「ご質問を、よろしいでしょうか？」' }
  };
  // 物語の進行表。lines＝セリフ／party＝仲間の入れ替え／b＝戦闘／rest＝全回復／learn＝ガリプンテ習得
  var STEPS = [
    { ch: '第一章：姫の命令', ico: '👸', party: ['gari'], lines: [
      '平和な国、なの王国。', 'ある日、姫「なの」は、勇者候補のクマ、ガリを呼び出した。',
      '姫「魔王サンドゥーラが復活したなの。倒してくるなの」', 'ガリ「いや、急すぎない？」',
      '姫「命令を受けなければ、体内に結石が発生する魔法をかけます」', 'こうして、ガリの冒険が始まった。'] },
    { b: 'sock' },
    { ch: '第二章：質問の蟹と傭兵', ico: '🦀', party: ['gari', 'kani', 'yohei'], lines: [
      '旅の途中、ガリは質問の蟹と出会う。', '蟹「仲間に入れてくださいませ！」', '人懐っこく、礼儀正しい蟹。ガリは仲間として迎え入れた。',
      'さらに、なの姫の資金援助によって、傭兵も加入。', 'ガリ、質問の蟹、傭兵の三人で、魔王城を目指す。',
      'しかし、蟹には、誰にも言えない目的があった。', 'それは、なの姫に近づくことだった。'] },
    { b: 'rat' },
    { ch: '第三章：魔王サンドゥーラ討伐', ico: '🏰', lines: [
      '長い道のりの末、ガリたちは魔王城に到着。', '魔王サンドゥーラとの決戦が始まる！'] },
    { b: 'sandora' },
    { lines: ['激闘の末、ついに魔王を撃破！', '世界に平和が戻った……はずだった。'] },
    { ch: '第四章：裏切りの蟹', ico: '💥', lines: [
      '魔王を倒した直後、質問の蟹が本性を現す。', '蟹「英雄は一人で十分なのでございます」',
      '蟹の目的は、魔王を自ら復活させ、それを倒した英雄として姫に認めてもらうことだった。', 'そのために、ガリを利用していたのだ。',
      '蟹はガリを襲撃。', 'ガリは死亡。', 'そして蟹は強大な力を手に入れ、破壊神へと変貌する。'], party: ['gari'], down: true },
    { ch: '第五章：給湯ポットの奇跡', ico: '🫖', lines: [
      '絶望の中、なの姫が現れる。', '姫「ガリ、復活するなの！」', '姫が手に取ったのは、伝説の聖水でも蘇生薬でもない。',
      'コンビニに置いてある、カップ麺用の給湯ポットだった。', 'ガリに熱湯をぶっかける。', 'ガリ「熱っっ！！ 生き返ったぞ！！」',
      'こうしてガリは、あまりにも雑な方法で復活した。'], revive: true },
    { ch: '第六章：元魔王、仲間になる', ico: '😈', party: ['gari', 'sandora', 'takashi'], lines: [
      'なの姫は、復活した魔王サンドゥーラをシバき倒す。', '姫「あなたも責任を取って、仲間になるなの」', 'サンドゥーラ「なんで私が回復係なのよ……」',
      'こうして、元魔王サンドゥーラが仲間に加入。', 'さらに、手下のたかしも同行することになる。', 'たかし「盾役なら任せてください……！」',
      '新しいパーティーが結成された。', '🐻 ガリ：勇者・攻撃魔法も使える', '😈 サンドゥーラ：魔法・回復担当', '🐄 たかし：盾役・敵の攻撃を引き受ける'] },
    { ch: '第七章：破壊神への道', ico: '🗺️', lines: [
      '三人は、破壊神となった蟹を倒すため、再び旅に出る。', '沼地、砂漠、廃村、山道、古戦場、温泉、謎の祠……。', '行く先々で、どうでもいい事件に巻き込まれる。'] },
    { ico: '🐊', lines: ['【沼地】', '怪しい商人「このカップ麺、今なら2個で1個の値段だよ」', 'ガリ「それ、普通じゃん」', 'カップ麺を2個もらった。'], item: 2 },
    { b: 'gator' },
    { ico: '🌵', lines: ['【砂漠】', '暑い。とにかく暑い。', 'サンドゥーラ「回復係に、水筒を持たせないでよ」'] },
    { b: 'cactus' },
    { ico: '👻', lines: ['【廃村】', '喋る石「……ここは、廃村だ」', 'ガリ「見れば分かるよ」', '喋る石「……それだけだ」'] },
    { b: 'ghost' },
    { ico: '🦅', lines: ['【山道】', '迷子のスライムが、ついてきた。', 'たかし「ペットは……盾にできません……」'] },
    { b: 'eagle' },
    { ico: '💀', lines: ['【古戦場】', '昔の戦士たちの亡霊が、そこらじゅうに立っている。', 'ガリ「……静かにしてくれない？」'] },
    { b: 'skel' },
    { ico: '♨️', rest: true, item: 1, lines: ['【温泉】', 'ついに温泉！ みんなの体力と魔力が全回復した！', 'カップ麺を1個、見つけた。'] },
    { ico: '⛩️', learn: true, lines: [
      '【謎の祠】', '謎の老人「禁断の魔法を授けよう」', 'ガリは禁断のギャンブル魔法「ガリプンテ」を覚えた！',
      '大当たりすれば、大金と経験値。', 'ハズレれば、爆発、隕石、落雷。', '味方の命すら賭ける、究極の魔法である。'] },
    { ch: '最終章：破壊神・質問の蟹', ico: '🗼', lines: [
      'ついに破壊神の塔へ到着した三人。', '待ち受けるのは、かつて仲間だった質問の蟹。', '蟹「なの姫を手に入れるため、全てを破壊するのでございます！」',
      'ガリ「もうお前の質問には答えない！」', 'サンドゥーラ「元魔王の力、見せてあげるわ！」', 'たかし「攻撃を……ください……！」', '最後の戦いが始まる。'] },
    { b: 'kanigod' },
    { ch: 'エンディング', ico: '🎉', end: true, lines: [
      '破壊神を倒し、世界に平和が戻った。', '姫「よくやったなの。報酬は検討するなの」', 'ガリ「そこは払えよ！！」', TITLE + ' 完！'] }
  ];
  var STEP_MS = 650, LOG_MAX = 8;

  // ===== 状態 =====
  var S, L = [], gen = 0;
  function el(tag, cls, text) { var d = document.createElement(tag); if (cls) d.className = cls; if (text !== undefined) d.textContent = text; return d; }
  function addLog(t) { L.push(t); if (L.length > LOG_MAX) L.shift(); $('log').textContent = L.join('\n'); }
  function mk(id) {
    var b = BASE[id], lv = S.lv, hp = b.hp + 4 * lv, mp = b.mp + lv;
    return { id: id, n: b.n, e: b.e, hp: hp, max: hp, mp: mp, mmax: mp, atk: b.atk + lv };
  }
  function alive() { return S.h.filter(function (x) { return x.hp > 0; }); }
  function hurt(x, d, L2) { x.hp = Math.max(0, x.hp - d); if (L2) { L2.push(x.n + 'は' + d + 'のダメージ！'); if (x.hp <= 0) L2.push(x.n + 'は倒れた…'); } }
  function healAll() { S.h.forEach(function (h) { h.hp = h.max; h.mp = h.mmax; }); }

  // 戦闘のメッセージを1行ずつ流して、終わったら then を呼ぶ（やり直しされたら、古い流れは捨てる）
  function play(lines, then) {
    var g = gen;
    S.busy = true; renderAll();
    lines.forEach(function (t, i) { setTimeout(function () { if (g === gen) { addLog(t); renderParty(); } }, i * STEP_MS); });
    setTimeout(function () { if (g !== gen) return; S.busy = false; renderAll(); if (then) then(); }, lines.length * STEP_MS + 150);
  }

  // ===== 描画 =====
  function renderParty() {
    var p = $('party'); p.textContent = '';
    S.h.forEach(function (h, i) {
      var d = el('div', 'hero' + (h.hp <= 0 ? ' down' : '') + (S.b && S.b.menu && S.b.idx === i ? ' cur' : ''));
      d.appendChild(el('b', '', h.e + ' ' + h.n));
      var b1 = el('div', 'bar'), i1 = el('i'); i1.style.width = Math.round(h.hp / h.max * 100) + '%'; b1.appendChild(i1);
      var b2 = el('div', 'bar mp'), i2 = el('i'); i2.style.width = Math.round(h.mp / h.mmax * 100) + '%'; b2.appendChild(i2);
      d.append(b1, el('div', '', 'HP ' + h.hp + '/' + h.max), b2, el('div', '', 'MP ' + h.mp + '/' + h.mmax));
      p.appendChild(d);
    });
  }
  function renderStage() {
    var st = $('stage'); st.textContent = '';
    if (S.b) {
      var f = el('div', 'foe'); f.appendChild(el('div', 'big', S.b.f.e)); f.appendChild(el('div', '', S.b.f.n));
      var bar = el('div', 'bar'), i = el('i'); i.style.width = Math.max(0, Math.round(S.b.f.hp / S.b.f.max * 100)) + '%'; bar.appendChild(i);
      f.appendChild(bar); st.appendChild(f);
    } else {
      var d = el('div'); d.appendChild(el('div', 'big', S.ico)); d.appendChild(el('div', 'ttl', S.title)); st.appendChild(d);
    }
  }
  function button(text, fn, disabled, cls) { var b = el('button', cls || '', text); b.type = 'button'; b.disabled = !!disabled; b.onclick = fn; return b; }
  function cmds(h) {
    var c = [{ k: 'atk', t: 'たたかう' }], s = SK[h.id];
    c.push({ k: 'sk', t: s[0] + '（MP' + s[1] + '）', cost: s[1] });
    if (h.id === 'gari' && S.learn) c.push({ k: 'gp', t: 'ガリプンテ（MP4）', cost: 4 });
    c.push({ k: 'item', t: '🍜カップ麺×' + S.item });
    return c;
  }
  function renderCmd() {
    var c = $('cmd'); c.textContent = '';
    if (S.busy) return;
    if (S.over) { c.appendChild(button('🎉 もう一度あそぶ', newGame)); return; }
    if (S.q) {
      c.appendChild(button('▶ つぎへ', nextLine));
      if (S.q.length > 1) c.appendChild(button('⏩ この場面を、まとめて読む', skipLines, false, 'sub'));
      return;
    }
    if (!S.b || !S.b.menu) return;
    var h = S.h[S.b.idx];
    c.appendChild(el('p', '', h.e + ' ' + h.n + ' は、どうする？'));
    var row = el('div', 'row');
    cmds(h).forEach(function (m, i) {
      row.appendChild(button((i + 1) + ' ' + m.t, function () { act(i); }, (m.cost && h.mp < m.cost) || (m.k === 'item' && S.item <= 0)));
    });
    c.appendChild(row);
  }
  function renderAll() { renderParty(); renderStage(); renderCmd(); }

  // ===== 物語の進行 =====
  function newGame() {
    gen++; L = []; $('log').textContent = '';
    S = { lv: 0, h: [], item: 3, step: 0, cp: 0, b: null, busy: false, over: false, q: null, ico: '🐻', title: TITLE, learn: false };
    runStep();
  }
  function runStep() {
    var st = STEPS[S.step];
    if (st.b) { S.cp = S.step; return startBattle(E[st.b], !!E[st.b].sp); }
    if (st.party) S.h = st.party.map(mk);
    if (st.down) S.h.forEach(function (h) { h.hp = 0; });
    if (st.revive) S.h.forEach(function (h) { h.hp = h.max; h.mp = h.mmax; });
    if (st.rest) healAll();
    if (st.learn) S.learn = true;
    if (st.item) S.item += st.item;
    if (st.ico) S.ico = st.ico;
    if (st.ch) { S.title = st.ch; addLog('── ' + st.ch + ' ──'); }
    S.q = st.lines.slice();
    S.b = null;
    nextLine(true);
  }
  function nextLine(first) {
    if (S.busy) return;
    if (S.q && S.q.length) { addLog(S.q.shift()); renderAll(); if (S.q.length) return; }
    else if (first !== true) { /* 最後の行のあとで、もう一度押された */ }
    if (S.q && !S.q.length && first !== true) return afterLines();
    renderAll();
  }
  function skipLines() { while (S.q && S.q.length > 1) addLog(S.q.shift()); nextLine(); }
  function afterLines() {
    var st = STEPS[S.step];
    S.q = null;
    if (st.end) { S.over = true; return renderAll(); }
    S.step++; runStep();
  }

  // ===== 戦闘 =====
  function startBattle(f, boss) {
    S.q = null;
    S.b = { f: { n: f.n, e: f.e, hp: f.hp, max: f.hp, atk: f.atk, sp: f.sp }, boss: boss, turn: 0, idx: 0, menu: false, taunt: 0 };
    play([f.e + ' ' + f.n + 'が現れた！', f.line], nextActor);
  }
  function nextActor() {
    while (S.b.idx < S.h.length && S.h[S.b.idx].hp <= 0) S.b.idx++;
    if (S.b.idx >= S.h.length) return enemyTurn();
    S.b.menu = true; renderAll();
  }

  function act(i) {
    if (S.busy || !S.b || !S.b.menu) return;
    var h = S.h[S.b.idx], f = S.b.f, m = cmds(h)[i], L2 = [];
    if (!m || (m.cost && h.mp < m.cost) || (m.k === 'item' && S.item <= 0)) return;
    S.b.menu = false;
    if (m.k === 'atk') {
      var d = h.atk + rnd(4); f.hp -= d;
      L2.push(h.e + h.n + 'の攻撃！ ' + f.n + 'に' + d + 'のダメージ！');
    } else if (m.k === 'item') {
      var t = alive().sort(function (a, b) { return a.hp / a.max - b.hp / b.max; })[0];
      S.item--; t.hp = Math.min(t.max, t.hp + 30);
      L2.push(h.e + h.n + 'はカップ麺を食べさせた！ ' + t.n + 'のHPが30回復！');
    } else {
      h.mp -= m.cost;
      if (m.k === 'gp') gamble(h, f, L2); else skill(h, f, L2);
    }
    if (f.hp <= 0) { f.hp = 0; return win(L2); }
    if (!alive().length) return lose(L2);
    S.b.idx++;
    play(L2, nextActor);
  }

  function skill(h, f, L2) {
    var d;
    if (h.id === 'gari') { d = Math.round(h.atk * 1.8) + rnd(5); f.hp -= d; L2.push('🔥 ガリ火！ ' + f.n + 'に' + d + 'のダメージ！'); }
    else if (h.id === 'kani') { var a = Math.round(h.atk * 0.9) + rnd(3), b = Math.round(h.atk * 0.9) + rnd(3); f.hp -= a + b; L2.push('🦀 ていねいなハサミ！ 「失礼いたします」 ' + a + '＋' + b + 'のダメージ！'); }
    else if (h.id === 'yohei') { d = Math.round(h.atk * 2) + rnd(4); f.hp -= d; L2.push('💰 お金の力で殴った！ ' + f.n + 'に' + d + 'のダメージ！'); }
    else if (h.id === 'sandora') { alive().forEach(function (x) { x.hp = Math.min(x.max, x.hp + 20); }); L2.push('😈 サンドゥーラ「しぶしぶ回復よ……」 みんなのHPが20回復した！'); }
    else { S.b.taunt = 2; L2.push('🐄 たかし「攻撃を……ください……！」 敵の攻撃を引き受ける！'); }
  }
  function gamble(h, f, L2) {   // ガリプンテ：大当たり〜大ハズレ
    var r = rnd(100), d;
    L2.push('🎰 ガリプンテ！！ ……さあ、どうなる！？');
    if (r < 20) { d = Math.round(h.atk * 4.5) + rnd(8); f.hp -= d; S.item += 2; L2.push('大当たり！！ ' + f.n + 'に' + d + 'のダメージ！ カップ麺も2個ゲット！'); }
    else if (r < 50) { d = Math.round(h.atk * 2.5) + rnd(6); f.hp -= d; L2.push('当たり！ ' + f.n + 'に' + d + 'のダメージ！'); }
    else if (r < 65) { d = Math.round(h.atk * 1.5); f.hp -= d; L2.push('💥 爆発！ ' + f.n + 'に' + d + 'のダメージ！ ……でも、みんなも巻き込まれた！'); alive().forEach(function (x) { hurt(x, 10, L2); }); }
    else if (r < 82) { d = Math.round(h.atk * 3); f.hp -= d; L2.push('☄️ 隕石が落ちてきた！ ' + f.n + 'に' + d + 'のダメージ！ ……味方にも当たった！'); hurt(pick(alive()), 28, L2); }
    else { L2.push('⚡ 落雷！ 敵には当たらず、味方に落ちた！'); alive().forEach(function (x) { hurt(x, 10, L2); }); }
  }

  function enemyTurn() {
    var b = S.b, f = b.f, L2 = [], a = alive();
    b.turn++;
    if (f.sp && b.turn % 3 === 0) {
      L2.push(f.e + '「' + f.sp.n + '」！ みんなに襲いかかる！');
      a.forEach(function (x) { hurt(x, f.sp.d + rnd(4), L2); });
    } else {
      var tk = S.h.filter(function (x) { return x.id === 'takashi' && x.hp > 0; })[0];
      var x = tk && (b.taunt > 0 || rnd(100) < 60) ? tk : pick(a);
      var d = f.atk + rnd(3);
      if (x === tk && b.taunt > 0) d = Math.round(d * 0.6);
      L2.push(f.e + f.n + 'の攻撃！ ' + x.n + 'に' + d + 'のダメージ！');
      hurt(x, d); if (x.hp <= 0) L2.push(x.n + 'は倒れた…');
    }
    if (b.taunt > 0) b.taunt--;
    if (!alive().length) return lose(L2);
    b.idx = 0;
    play(L2, nextActor);
  }

  function win(L2) {
    L2.push(S.b.f.e + S.b.f.n + 'を倒した！');
    S.b = null; S.lv++;
    S.h.forEach(function (h) {   // 成長：HP+4・攻撃+1・MP+1。倒れた仲間も起き上がる
      h.max += 4; h.atk += 1; h.mmax += 1;
      h.hp = h.hp <= 0 ? Math.ceil(h.max * 0.3) : Math.min(h.max, h.hp + 12);
      h.mp = Math.min(h.mmax, h.mp + 2);
    });
    L2.push('みんなが少し成長した！（倒れた仲間も、起き上がったよ）');
    if (rnd(100) < 25) { S.item++; L2.push('カップ麺を拾った！（×' + S.item + '）'); }
    play(L2, function () { S.step++; runStep(); });
  }
  function lose(L2) {
    L2.push('全滅してしまった…', 'なの姫の魔法で、さっきの場所に戻された。（もう一度、挑戦しよう）');
    play(L2, function () { healAll(); S.b = null; S.step = S.cp; runStep(); });
  }

  // ===== 入力（キーボード）=====
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (['Enter', ' ', 'ArrowRight', '1', '2', '3', '4'].indexOf(k) < 0) return;
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (S.busy) return;
    if (S.over) return newGame();
    if (S.q) { if (k === 'Enter' || k === ' ' || k === 'ArrowRight') nextLine(); return; }
    if (S.b && S.b.menu && /^[1-4]$/.test(k)) act(+k - 1);
  });
  $('restart').addEventListener('click', function () { if (confirm('最初からやり直すよ。いいかな？')) newGame(); });
  $('h1').textContent = TITLE; $('h1').appendChild(el('small', '', SUB));

  newGame();
})();
</script>
</body>
</html>

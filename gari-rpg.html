<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ガリゴンクエスト2</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--panel2:#273449;--line:#475569;--gold:#facc15;--green:#4ade80;--red:#fb7185;--blue:#7dd3fc;--txt:#f8fafc;--muted:#cbd5e1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#263449,#0b1020 65%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:16px}
#app{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:clamp(22px,4vw,34px);margin:4px 0;color:var(--gold);text-shadow:0 2px #000}.sub{color:var(--muted);font-size:12px}.panel{background:linear-gradient(145deg,#202d40,#172233);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 8px 24px #0005}.scene{min-height:170px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:linear-gradient(180deg,#1e3448,#142033)}.emoji{font-size:clamp(42px,10vw,76px);line-height:1.4;letter-spacing:5px}.sceneText{font-size:16px;line-height:1.7;margin-top:8px;white-space:pre-line}.log{height:160px;overflow:auto;text-align:left;background:#0b1220;border:1px solid #334155;border-radius:10px;padding:10px;font-size:13px;line-height:1.65}.log p{margin:0 0 4px}.muted{color:var(--muted)}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.stat{background:#0e1726;border:1px solid #334155;border-radius:10px;padding:9px;font-size:13px}.stat .exp{color:#fde68a;font-size:11px;margin-top:3px}.bar{height:7px;background:#334155;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--green)}.bar.mp i{background:#60a5fa}.buttons{display:flex;flex-wrap:wrap;gap:8px}.actionbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.actionbar button{width:100%}.buttons button,button{background:#334155;color:white;border:1px solid #64748b;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;font-size:14px}button:hover{background:#475569}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#854d0e;border-color:#eab308}.danger{background:#7f1d1d;border-color:#ef4444}.small{font-size:12px;padding:7px 9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.tag{display:inline-block;border:1px solid #64748b;border-radius:99px;padding:3px 8px;font-size:11px;color:var(--muted)}.mapline{display:flex;gap:5px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:20px}.mapline span{opacity:.35}.mapline .here{opacity:1;filter:drop-shadow(0 0 7px #facc15)}.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.footer{font-size:11px;color:#94a3b8;text-align:center;margin:14px 0}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:5}.modal>div{max-width:520px;width:100%;max-height:85vh;overflow:auto;background:#1e293b;border:1px solid #64748b;border-radius:15px;padding:16px}.modal h2{margin-top:0;color:var(--gold)}.shoprow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #334155;padding:8px 0}.key{border:1px solid #64748b;border-radius:5px;padding:1px 5px;font-size:11px}

/* スマホ向け簡易レイアウト */
@media (max-width:600px){
  body{padding:5px;background:#0b1020}
  #app{width:100%;max-width:100%}
  .top{gap:6px;margin-bottom:6px}
  h1{font-size:20px;margin:2px 0}
  .sub{font-size:10px}
  .panel{padding:8px;margin:6px 0;border-radius:9px;box-shadow:none}
  .scene{min-height:112px;padding:10px 7px}
  .emoji{font-size:40px;line-height:1.15;letter-spacing:2px}
  .sceneText{font-size:13px;line-height:1.45;margin-top:6px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .stat{padding:6px;font-size:11px;border-radius:7px;min-width:0}
  .stat b{font-size:12px}
  .bar{height:5px;margin-top:3px}
  .buttons{gap:5px}
  .buttons button,button{font-size:12px;padding:9px 8px;border-radius:7px;min-height:38px}
  .buttons button.small,button.small{font-size:11px;padding:6px 7px;min-height:30px}
  .actionbar{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .actionbar button{padding:9px 3px;font-size:12px}
  #battleActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  #battleActions button{width:100%}
  #app>section:last-of-type .buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  #nextBtn{grid-column:1/-1}
  .log{height:90px;padding:7px;font-size:11px;line-height:1.45}
  .mapline{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;font-size:16px;gap:3px;padding:2px 0}
  .tag{font-size:10px;padding:2px 6px}
  .choice{gap:5px;margin-top:7px}
  .choice button{flex:1 1 auto}
  .footer{font-size:9px;margin:8px 0}
  .modal{padding:7px}
  .modal>div{padding:11px;border-radius:10px;max-height:90vh}
  .shoprow{font-size:12px;gap:5px;padding:6px 0}
  .shoprow button{white-space:nowrap}
}
@media (max-width:360px){
  .stats{grid-template-columns:1fr}
  .stat{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:6px}
  .stat .bar{grid-column:1/-1}
  .top .buttons button{padding:5px 6px}
}
</style>
</head>
<body><div id="app">
<header class="top"><div><h1>🐻 ガリゴンクエスト2</h1><div class="sub">～絵文字と勢いで世界を救え～</div></div><div class="buttons"><button class="small" onclick="saveGame()">💾 セーブ</button><button class="small" onclick="loadGame()">📂 ロード</button><button class="small" onclick="showHelp()">❔ 操作</button></div></header>
<section class="panel"><div class="top"><b id="areaName">なの城</b><span class="tag" id="progress">冒険前</span><span class="gold" id="money">0デュラ</span></div><div class="mapline" id="mapline"></div></section>
<section class="panel scene"><div class="emoji" id="picture">🏰 👸 🐻</div><div class="sceneText" id="sceneText">姫「なの」の命令により、ガリの冒険が始まる。</div><div class="choice" id="choices"></div></section>
<section class="panel" id="actionPanel"><div class="buttons actionbar" id="actionButtons"></div><div class="sub" style="margin-top:6px">キー操作：<span class="key">→</span>進む / <span class="key">←</span>戻る / <span class="key">T</span>修行 / <span class="key">Esc</span>閉じる</div></section>
<section class="panel"><div class="top"><b>👥 パーティー</b><span class="tag" id="partyLabel">準備中</span></div><div class="stats" id="partyStats"></div></section>
<section class="panel hidden" id="battlePanel"><div class="top"><b>⚔️ バトル</b><span class="tag" id="enemyInfo">敵</span></div><div class="emoji" id="enemyEmoji">👹</div><div id="enemyName" style="text-align:center;font-weight:800"></div><div class="bar"><i id="enemyBar" style="width:100%;background:#fb7185"></i></div><div class="sub" id="enemyHp" style="text-align:center;margin:5px"></div><div class="buttons" id="battleActions"></div></section>
<section class="panel"><div class="top"><b>📜 冒険ログ</b><button class="small" onclick="clearLog()">ログ消去</button></div><div class="log" id="log"></div></section>
<section class="panel"><div class="top"><b>🎒 所持品</b><span class="tag" id="itemCount">0個</span></div><div id="items" class="buttons"></div></section>

<div class="footer">セーブデータはこのブラウザ内に保存されます。画像素材なし・HTML単体で動作。</div>
</div><div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()"><div id="modalBody"></div></div>
<script>
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const baseChars={
 gari:{name:'ガリ',emoji:'🐻',maxHp:120,hp:120,maxMp:35,mp:35,atk:19,def:9,lv:1,exp:0,role:'勇者'},
 crab:{name:'質問の蟹',emoji:'🦀',maxHp:95,hp:95,maxMp:18,mp:18,atk:17,def:8,lv:1,exp:0,role:'仲間（仮）'},
 merc:{name:'傭兵',emoji:'🗡️',maxHp:80,hp:80,maxMp:0,mp:0,atk:13,def:11,lv:1,exp:0,role:'使い捨て'},
 sand:{name:'サンドゥーラ',emoji:'😈',maxHp:100,hp:100,maxMp:75,mp:75,atk:12,def:7,lv:1,exp:0,role:'魔法・回復'},
 takashi:{name:'たかし',emoji:'🐄',maxHp:170,hp:170,maxMp:22,mp:22,atk:12,def:20,lv:1,exp:0,role:'盾役'}
};
// レベルアップで増える分（仲間ごと）。レベルアップするとHP・MPは全回復する
const GROW={gari:{hp:12,mp:3,atk:3,def:1},crab:{hp:10,mp:2,atk:3,def:1},merc:{hp:9,mp:0,atk:2,def:1},sand:{hp:8,mp:6,atk:1,def:1},takashi:{hp:14,mp:1,atk:1,def:2}};
const need=c=>c.lv*20; // 次のレベルに必要な経験値
let S;
function fresh(){return {started:false,step:0,reach:0,sinceBattle:0,lock:false,phase:'intro',money:35,items:{やくそう:3,まほうの水:1},chars:clone(baseChars),party:['gari'],mercDeaths:0,wipes:0,grave:[],eventSeen:[],battle:null,story:{crabJoined:false,mercJoined:false,sandJoined:false,takashiJoined:false,firstBoss:false,crabGod:false},done:false,log:[]}}
S=fresh();
const zones=[
['城下町','🏰','なの姫の城下町。'],['草原','🌱','草原に出た。'],['森の入口','🌳','森の入口。'],['小さな橋','🌉','橋がある。'],['古い街道','🛤️','誰もいない街道。'],['コンビニ前','🏪','なぜかコンビニがある。'],['洞窟入口','🕳️','暗い洞窟が口を開けている。'],['洞窟奥','🪨','じめじめしている。'],['魔王城前','🏰','魔王城に到着した。'],['魔王の間','😈','魔王サンドゥーラが待ち受ける。'],['焼け野原','🔥','蟹が力を得た場所。'],['給湯ポット前','♨️','コンビニの給湯ポットがある。'],['なの城','🏰','姫の城に戻ってきた。'],['城門','🚪','姫にシバかれた魔王がいる。'],['魔王城下','🏚️','元魔王の手下がうろつく。'],['沼地','🫧','足元がぬかるむ。'],['砂漠','🏜️','暑い。とにかく暑い。'],['廃村','🏚️','人の気配がない。'],['山道','⛰️','坂が続く。'],['古戦場','⚔️','昔の戦場らしい。'],['毒沼','☠️','入らない方がよさそう。'],['温泉','♨️','温泉が湧いている。'],['謎の祠','⛩️','何かを祀っている。'],['巨大な門','🚧','先に進むしかない。'],['蟹の領域','🦀','蟹の気配が濃い。'],['暗黒街道','🌑','空が暗くなってきた。'],['崩れた橋','🌉','橋が半分崩れている。'],['最終休憩所','🏕️','最後の休憩地点。'],['破壊神の塔','🗼','頂上から強大な気配。'],['最上階','👑','破壊神が待つ。']
];
const REST_STEPS=[21,27]; // 温泉・最終休憩所：着くと全員全回復（戦闘なし）
const NO_FIELD=[0,5,9,10,11,12,21,27,29]; // ザコ敵・ランダムイベントが出ないマス（物語・町・休憩所）

function log(t){S.log.push(t);if(S.log.length>100)S.log.shift();$('log').innerHTML=S.log.map(x=>'<p>› '+esc(x)+'</p>').join('');$('log').scrollTop=$('log').scrollHeight}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// 選択肢つきの場面は、選ぶまで移動できない（ロックされる）。選択肢なしの場面で、ロックは解ける
function scene(pic,txt,buttons=[]){S.lock=buttons.length>0;$('picture').textContent=pic;$('sceneText').textContent=txt;$('choices').innerHTML='';buttons.forEach(b=>{let x=document.createElement('button');x.textContent=b.label;x.onclick=()=>{S.lock=false;b.fn()};$('choices').appendChild(x)});renderActionButtons()}
function setArea(){let z=zones[Math.min(S.step,zones.length-1)];$('areaName').textContent=z[0];$('progress').textContent=`${S.step+1} / ${zones.length}`;$('mapline').innerHTML=zones.map((z,i)=>`<span class="${i===S.step?'here':''}">${z[1]}</span>`).join('');}
function aliveParty(){return S.party.filter(id=>S.chars[id]&&S.chars[id].hp>0)}
function render(){setArea();$('money').textContent=S.money+'デュラ';$('partyLabel').textContent=S.party.map(id=>S.chars[id]?.emoji||'').join(' ');$('partyStats').innerHTML=S.party.map(id=>{let c=S.chars[id];if(!c)return '';return `<div class="stat"><b>${c.emoji} ${c.name}</b> <span class="muted">Lv${c.lv} ${c.role}</span><div>HP ${c.hp}/${c.maxHp}</div><div class="bar"><i style="width:${100*c.hp/c.maxHp}%"></i></div><div>MP ${c.mp}/${c.maxMp}</div><div class="bar mp"><i style="width:${c.maxMp?100*c.mp/c.maxMp:0}%"></i></div><div class="exp">EXP ${c.exp}/${need(c)}</div></div>`}).join('');$('items').innerHTML=Object.entries(S.items).filter(x=>x[1]>0).map(([n,v])=>`<span class="tag">${esc(n)} ×${v}</span>`).join('')||'<span class="muted">何も持っていない</span>';$('itemCount').textContent=Object.values(S.items).reduce((a,b)=>a+b,0)+'個';$('log').innerHTML=S.log.map(x=>'<p>› '+esc(x)+'</p>').join('');$('log').scrollTop=$('log').scrollHeight;$('battlePanel').classList.toggle('hidden',!S.battle);renderActionButtons();if(S.battle)renderBattle();}

// 動けるのは、冒険中で、戦闘中でも、選択肢待ちでもないとき
function canMove(){return S.started&&!S.battle&&!S.done&&!S.lock&&(S.phase==='journey'||S.phase==='post')}
function isTown(){return S.step===0||S.step===12}
// 負けたあとに、町から「最前線」へ一気に戻れる場所（物語の戦闘や出来事の手前まで）
function frontier(){if(!S.story.firstBoss)return Math.min(S.reach,8);if(!S.story.takashiJoined)return 0;return Math.min(Math.max(S.reach,13),28)}
function renderActionButtons(){let a=$('actionButtons');if(!a)return;a.innerHTML='';let defs=[];
 if(!S.started||S.battle||S.done){$('actionPanel').classList.add('hidden');return}
 $('actionPanel').classList.remove('hidden');let mv=canMove();
 if(isTown()){defs.push(['🛏️ 宿屋',openInn],['🏪 お店',openShop],['🪦 墓地',openGraveyard]);if(mv){defs.push(['➡️ 進む',advance],['⚔️ 修行',train]);if(frontier()>S.step+1)defs.push(['🗺️ 最前線へ',warp])}}
 else if(mv){defs.push(['⬅️ 戻る',goBack],['➡️ 進む',advance],['⚔️ 修行',train])}
 defs.push(['✨ 魔法',()=>openMagic(false)],['🎒 道具',()=>openItems(false)]);
 defs.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;a.appendChild(b)})}

function begin(){S.started=true;S.phase='town';S.party=['gari'];log('ガリゴンクエスト2 開始！');scene('🏰 👸 🐻','姫「なの」：魔王サンドゥーラを倒してくるなの。命令を受けなければ体内に結石が発生する魔法かけます。',[{label:'😨 冒険に出る',fn:()=>{log('ガリは結石を恐れて旅立った。');S.phase='crab';scene('🐻 🌱 🦀','草原で質問の蟹が現れた。🦀「仲間に入れてくださいませ！」',[{label:'仲間にする',fn:joinCrab}])}}]);render()}
function joinCrab(){if(!S.party.includes('crab'))S.party.push('crab');S.story.crabJoined=true;S.phase='merc';scene('🐻 🦀 🏘️','質問の蟹が仲間になった。まずは町で傭兵と回復アイテムを準備しよう。',[{label:'傭兵を雇う（無料）',fn:()=>{if(!S.party.includes('merc'))S.party.push('merc');S.story.mercJoined=true;log('なの姫の費用で傭兵を雇った。');scene('🗡️','傭兵「よろしくお願いします」',[{label:'出発',fn:()=>{S.phase='journey';S.step=1;S.reach=1;S.sinceBattle=0;log('冒険開始。');fieldStep();render()}}]);render()}}]);render()}
function advance(){if(!S.started){begin();return}if(!canMove())return;S.step=Math.min(S.step+1,zones.length-1);S.reach=Math.max(S.reach,S.step);regen();storyAtStep()}
function goBack(){if(!canMove())return;if(S.step>1&&S.step!==12){S.step--;log(zones[S.step][0]+'へ戻った。');afterStep()}else log('これ以上は戻れない。')}
function warp(){if(!canMove())return;let t=frontier();if(t<=S.step)return;S.step=t;S.sinceBattle=0;log('最前線の'+zones[t][0]+'へ向かった。');afterStep()}
// 1マス進むたびに、少しだけHP・MPが回復する
function regen(){S.party.forEach(id=>{let c=S.chars[id];if(!c||c.hp<=0)return;c.hp=Math.min(c.maxHp,c.hp+Math.max(1,Math.round(c.maxHp*.03)));if(c.maxMp)c.mp=Math.min(c.maxMp,c.mp+1)})}
function restoreAll(){S.party.forEach(id=>{let c=S.chars[id];if(c){c.hp=c.maxHp;c.mp=c.maxMp}})}

function storyAtStep(){let z=zones[S.step],s=S.step;log(z[1]+' '+z[0]+'に到着。');
 if(s===5&&S.party.includes('crab')){scene('🏪 🦀','🦀「少々コンビニに寄ってまいります」蟹は何かを買って戻ってきた。',[{label:'先へ進む',fn:()=>{log('蟹は何も説明しなかった。');afterStep()}}]);return}
 if(s===9&&!S.story.firstBoss){startBattle({name:'魔王サンドゥーラ',emoji:'😈',hp:190,atk:20,def:7,boss:'first'});return}
 if(s===10&&!S.story.crabGod){scene('🦀💥🐻','魔王を倒した直後、質問の蟹がガリに襲いかかった！🦀「英雄は一人で十分なのでございます」',[{label:'えっ',fn:()=>{let g=S.chars.gari;g.hp=0;log('ガリは質問の蟹に倒された……');S.story.crabGod=true;S.phase='revive';S.step=11;S.reach=11;scene('🏪 ♨️ 🐻','なの姫はコンビニのカップ麺用給湯ポットのお湯をガリにかけた！ 🐻「熱っっ！！ 生き返ったぞ！！」',[{label:'復活！',fn:()=>{g.hp=g.maxHp;g.mp=g.maxMp;S.party=['gari'];S.phase='rescue';log('給湯ポットでガリが雑に復活した。');scene('👸 😈','なの姫にシバかれたサンドゥーラが仲間になりたそうにこちらを見ている。',[{label:'サンドゥーラ加入',fn:joinSand}]);render()}}]);render()}}]);return}
 if(s===12&&!S.story.takashiJoined){scene('😈 🐄','サンドゥーラ「手下のたかしも連れていくわ」🐄「盾役なら任せてください……！」',[{label:'たかし加入',fn:joinTakashi}]);return}
 if(s===29){startBattle({name:'破壊神・質問の蟹',emoji:'🦀🔥',hp:520,atk:34,def:13,boss:'final'});return}
 if(REST_STEPS.includes(s)){restoreAll();log('ここで休んで、全員のHP・MPが全回復した！');scene(z[1],z[2]+'\n全員のHP・MPが全回復した。➡️で先へ進もう。');render();return}
 if(!NO_FIELD.includes(s))fieldStep();else afterStep()}
function afterStep(){render();if(S.done){endingScene();return}scene(zones[S.step][1],zones[S.step][2]+(isTown()?' 準備ができたら➡️で先へ進もう。':' ➡️で先へ進もう。'))}
function joinSand(){S.chars.sand.hp=S.chars.sand.maxHp;S.chars.sand.mp=S.chars.sand.maxMp;S.party=['gari','sand'];S.story.sandJoined=true;S.phase='post';log('サンドゥーラが仲間になった。');scene('🐻 😈','元魔王サンドゥーラが仲間になった。攻撃と回復の魔法を使える。',[{label:'進む',fn:()=>{S.step=12;S.reach=12;joinTakashi()}}]);render()}

// 進んだ場所に合わせて、敵が少しずつ強く（＋経験値・お金も多く）なる
function makeEnemy(step){let pool=ENEMIES.filter(e=>step>=e.min&&step<=e.max);if(!pool.length)pool=ENEMIES;let b=pool[rand(0,pool.length-1)];return {name:b.name,emoji:b.emoji,hp:Math.round(b.hp*(1+step*.03)),atk:Math.round(b.atk*(1+step*.02)),def:b.def+Math.floor(step/8),exp:Math.round(8+step*.8)+rand(0,4),gold:rand(4,10)+Math.floor(step/2)}}
function trainStep(){return S.step===0?1:S.step===12?13:S.step}
function train(){if(!canMove())return;S.sinceBattle=0;log('周りを探して、敵を探した。');startBattle(makeEnemy(trainStep()))}

function randomEventMaybe(){if(Math.random()<.55){let e=pickEvent();if(e){S.eventSeen.push(e.id);scene(e.pic,e.text,e.opts.map(o=>({label:o[0],fn:()=>{o[1]();if(!S.battle&&!S.lock)afterStep()}})));return}}afterStep()}
function pickEvent(){let ok=events.filter(e=>!e.cond||e.cond());if(!ok.length)return null;let pool=ok.filter(e=>!S.eventSeen.includes(e.id));if(!pool.length){S.eventSeen=S.eventSeen.filter(id=>!ok.some(e=>e.id===id));pool=ok}return pool[rand(0,pool.length-1)]}

// ダメージ。kill が true のときだけ、戦闘不能にできる（イベントのダメージで、全滅はしない）
function hurt(id,n,kill){let c=S.chars[id];if(!c)return;c.hp=kill?Math.max(0,c.hp-n):Math.max(1,c.hp-n);if(c.hp<=0)log(c.name+'は倒れた！');checkWipe()}
// 経験値は、戦える仲間全員がもらう。レベルアップでHP・MPは全回復
function gainExp(n){S.party.forEach(id=>{let c=S.chars[id];if(!c||c.hp<=0)return;c.exp+=n;while(c.exp>=need(c)){c.exp-=need(c);c.lv++;let g=GROW[id]||{hp:8,mp:1,atk:2,def:1};c.maxHp+=g.hp;c.maxMp+=g.mp;c.atk+=g.atk;c.def+=g.def;c.hp=c.maxHp;c.mp=c.maxMp;log(c.name+'はレベルアップ！ Lv'+c.lv)}})}

// ---- バトル ----
function startBattle(e){S.battle={enemy:e,maxHp:e.hp,turn:0};$('battlePanel').classList.remove('hidden');log(e.name+'が現れた！');render();battleButtons()}
function renderBattle(){let b=S.battle;if(!b)return;$('enemyEmoji').textContent=b.enemy.emoji;$('enemyName').textContent=b.enemy.name;$('enemyInfo').textContent='敵HP '+b.enemy.hp+'/'+b.maxHp;$('enemyHp').textContent=b.enemy.hp+' / '+b.maxHp;$('enemyBar').style.width=Math.max(0,100*b.enemy.hp/b.maxHp)+'%'}
function battleButtons(){let a=$('battleActions');a.innerHTML='';[['⚔️ 戦う','attack'],['✨ 魔法','magic'],['🎒 道具','item'],['🏃 逃げる','run']].forEach(([t,k])=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>battleAction(k);a.appendChild(b)})}
// 攻撃するのは、ガリ。ガリが倒れているときは、戦える仲間の中で、いちばん攻撃力が高い人
function attacker(){let al=aliveParty();if(!al.length)return null;if(al.includes('gari'))return S.chars.gari;return S.chars[al.reduce((a,b)=>S.chars[b].atk>S.chars[a].atk?b:a)]}
function battleAction(k){if(!S.battle)return;if(k==='attack'){let c=attacker();if(!c){checkWipe();return}log(c.name+'の攻撃！');damageEnemy(Math.max(1,c.atk+rand(0,7)-S.battle.enemy.def))}else if(k==='magic'){openMagic(true);return}else if(k==='item'){openItems(true);return}else if(k==='run'){if(S.battle.enemy.boss){log('ボス戦からは逃げられない！')}else if(Math.random()<.65){log('逃げ切った！');S.battle=null;render();scene('💨','うまく逃げ切った。➡️で先へ進もう。');return}else log('逃げられない！')}enemyTurn();}
function damageEnemy(n){let b=S.battle;if(!b)return;b.enemy.hp=Math.max(0,b.enemy.hp-n);log('敵に'+n+'ダメージ！');if(b.enemy.hp<=0)winBattle();else renderBattle()}
function enemyTurn(){let b=S.battle;if(!b)return;let targets=aliveParty();if(!targets.length){checkWipe();return}let id;if(S.story.takashiJoined&&targets.includes('takashi')){let r=Math.random();id=r<.5?'takashi':r<.8?'gari':'sand';if(!targets.includes(id))id=targets[Math.floor(Math.random()*targets.length)]}else{id=targets[Math.floor(Math.random()*targets.length)]}let c=S.chars[id];let d=Math.max(1,b.enemy.atk+rand(-3,4)-c.def);c.hp=Math.max(0,c.hp-d);log(b.enemy.name+'の攻撃！ '+c.name+'に'+d+'ダメージ！');if(c.hp<=0)log(c.name+'は倒れた！');if(!aliveParty().length){checkWipe();return}render()}
function endingScene(){scene('🎉🏰🎉','ガリゴンクエスト2 完！\nご協力ありがとうございました。',[{label:'最初から',fn:()=>{S=fresh();begin();render()}}])}
function winBattle(){let b=S.battle,e=b.enemy;log(e.name+'を倒した！');
 if(e.boss==='first'){S.story.firstBoss=true;S.money+=80;gainExp(45);S.battle=null;render();storyAtStep();return}
 if(e.boss==='final'){S.battle=null;S.done=true;S.lock=false;render();saveGame();log('GAME CLEAR！');scene('🐻 😈 🐄 🦀💥','破壊神・質問の蟹を倒した！世界に平和が戻った……たぶん。\n姫「よくやったなの。報酬は検討するなの」',[{label:'エンディング',fn:endingScene}]);return}
 let exp=e.exp||10,gold=e.gold||rand(5,18);S.money+=gold;log('経験値'+exp+'と'+gold+'デュラを手に入れた。');gainExp(exp);if(Math.random()<.25){S.items['やくそう']=(S.items['やくそう']||0)+1;log('やくそうを手に入れた。')}S.battle=null;render();scene('🎉',e.name+'に勝利！'+(isTown()?'':' ➡️で先へ進もう。'))}

// ---- 魔法・道具 ----
function spellData(){return {'ホイミョ':{cost:4,type:'heal',power:30},'ベホイミョ':{cost:10,type:'heal',power:70},'ベホマョ':{cost:20,type:'heal',power:999},'ザオリョ':{cost:18,type:'revive'},'メリャ':{cost:3,type:'attack',power:20},'メラリャ':{cost:7,type:'attack',power:45},'メラギリャ':{cost:13,type:'attack',power:85},'ギリャ':{cost:6,type:'allattack',power:15},'ベギリャ':{cost:15,type:'allattack',power:45},'スカリョ':{cost:5,type:'def'},'バイキリョ':{cost:7,type:'atk'},'ベホミョズン':{cost:35,type:'allheal'},'ガリプンテ':{cost:12,type:'special'},'ガリデイン':{cost:25,type:'allattack',power:125}}}
function casterFor(name){return ['ホイミョ','ベホイミョ','ベホマョ','ザオリョ','メリャ','メラリャ','メラギリャ','ギリャ','ベギリャ','スカリョ','バイキリョ'].includes(name)&&S.party.includes('sand')?'sand':'gari'}
function cast(name,targetId){let sp=spellData()[name];if(!sp)return false;let caster=casterFor(name),c=S.chars[caster];if(c.hp<=0){log(c.name+'は倒れていて、魔法を唱えられない！');return false}if(c.mp<sp.cost){log(c.name+'のMPが足りない！');return false}if(['heal','revive','def','atk'].includes(sp.type)&&!targetId){log('対象を選んでください。');return false}if(sp.type==='revive'&&S.chars[targetId]?.hp>0){log('その仲間は倒れていない。');return false}if(sp.type==='heal'&&S.chars[targetId]?.hp<=0){log('倒れている仲間にはザオリョが必要だ。');return false}c.mp-=sp.cost;log(c.name+'は'+name+'を唱えた！');if(sp.type==='heal')heal(targetId,sp.power);else if(sp.type==='revive'){let t=S.chars[targetId];t.hp=Math.max(1,Math.floor(t.maxHp*.25));log(t.name+'が復活！')}else if(sp.type==='allheal')S.party.forEach(id=>heal(id,999));else if(sp.type==='attack')spellDamage(sp.power,false);else if(sp.type==='allattack')spellDamage(sp.power,true);else if(sp.type==='special')gariPunte();else if(sp.type==='atk'||sp.type==='def')buff(sp.type,targetId);return true}
function heal(id,n){let c=S.chars[id];if(!c)return;if(c.hp<=0&&n<999)return;c.hp=Math.min(c.maxHp,c.hp+n);log(c.name+'のHPが回復！')}
function spellDamage(n,all){if(!S.battle){log('魔法が空に飛んでいった。');return}let dmg=n+rand(-5,8);if(all){dmg=Math.max(1,Math.floor(dmg*.75));}damageEnemy(dmg)}
function buff(k,id){let c=S.chars[id];if(c){c[k]+=Math.ceil(c[k]*.5);log(c.name+'の'+(k==='atk'?'攻撃':'防御')+'力が上がった！（戦闘終了まで）')}}
function gariPunte(){let r=Math.random()*100;if(r<18){hurt('gari',999,true);log('💥 ガリは爆発した！');}else if(r<32){hurt('gari',65,true);log('☄️ 隕石がガリに直撃！');}else if(r<44){hurt('gari',45,true);log('⚡ 雷がガリに落ちた！');}else if(r<54){hurt('gari',35,true);log('🪨 岩が降ってきた！');}else if(r<62){if(S.battle)S.battle.enemy.atk+=8;log('😡 敵がガリに激怒！敵の攻撃力アップ。');}else if(r<70){S.party.forEach(id=>{S.chars[id].hp=Math.max(0,S.chars[id].hp-15)});log('💥 大爆発！味方全員に15ダメージ！');checkWipe();}else if(r<79){let n=rand(80,180);S.money+=n;log('💰 お金が降ってきた！'+n+'デュラ獲得！');}else if(r<88){gainExp(90);log('⭐ 経験値大量獲得！');}else if(r<94){if(S.battle)damageEnemy(100);else S.items['やくそう']=(S.items['やくそう']||0)+3;log('🌟 奇跡！');}else if(r<98){S.party.forEach(id=>{heal(id,999);S.chars[id].mp=Math.min(S.chars[id].maxMp,S.chars[id].mp+15)});log('🌈 全員のHP・MPが大回復！');}else{let n=rand(250,500);S.money+=n;gainExp(150);log('👑 超大当たり！！'+n+'デュラと経験値大量獲得！')} }
function openMagic(inBattle=false){let names=S.story.sandJoined?Object.keys(spellData()):['ホイミョ','メリャ','ガリプンテ','ガリデイン'];let body='<h2>✨ 魔法</h2><p class="muted">使う魔法を選択。</p>';names.forEach(n=>{let sp=spellData()[n];body+=`<div class="shoprow"><span>${n} <small class="muted">MP${sp.cost}</small></span><button onclick="chooseSpellTarget('${n}',${inBattle})">選ぶ</button></div>`});body+='<button onclick="closeModal()">閉じる</button>';openModal(body)}
function chooseSpellTarget(n,inBattle){let sp=spellData()[n];if(!sp)return; if(['heal','revive','def','atk'].includes(sp.type)){let body=`<h2>${n}：対象を選択</h2>`;S.party.forEach(id=>{let c=S.chars[id];body+=`<div class="shoprow"><span>${c.emoji} ${c.name} HP${c.hp}/${c.maxHp} MP${c.mp}/${c.maxMp}</span><button onclick="useSpell('${n}',${inBattle},'${id}')">この仲間に使う</button></div>`});body+='<button onclick="openMagic('+inBattle+')">戻る</button>';openModal(body)}else useSpell(n,inBattle,null)}
function useSpell(n,inBattle,targetId){let ok=cast(n,targetId);render();if(ok){closeModal();if(inBattle&&S.battle)enemyTurn();else if(!inBattle&&!S.lock)scene('✨','魔法を使った。')}}
function openItems(inBattle=false){let body='<h2>🎒 道具</h2><p class="muted">使う道具を選択。</p>';Object.entries(S.items).filter(x=>x[1]>0).forEach(([n,v])=>body+=`<div class="shoprow"><span>${esc(n)} ×${v}</span><button onclick="chooseItemTarget('${n}',${inBattle})">選ぶ</button></div>`);body+='<button onclick="closeModal()">閉じる</button>';openModal(body)}
function chooseItemTarget(n,inBattle){if(n==='やくそう'||n==='まほうの水'){let body=`<h2>${esc(n)}：対象を選択</h2>`;S.party.forEach(id=>{let c=S.chars[id];body+=`<div class="shoprow"><span>${c.emoji} ${c.name} HP${c.hp}/${c.maxHp} MP${c.mp}/${c.maxMp}</span><button onclick="useItem('${n}',${inBattle},'${id}')">この仲間に使う</button></div>`});body+='<button onclick="openItems('+inBattle+')">戻る</button>';openModal(body)}else useItem(n,inBattle,'gari')}
function useItem(n,inBattle,targetId='gari'){if(!S.items[n])return;let c=S.chars[targetId]||S.chars.gari;if(n==='やくそう'){if(c.hp<=0){log('倒れている仲間には使えない。');return}S.items[n]--;heal(targetId,45)}else if(n==='まほうの水'){if(c.maxMp<=0){log(c.name+'はMPを使わない。');return}S.items[n]--;c.mp=Math.min(c.maxMp,c.mp+20);log(c.name+'のMPが20回復。')}else{S.items[n]--;log('木の棒を眺めた。')}render();closeModal();if(inBattle&&S.battle)enemyTurn()}

// ---- 町の施設 ----
function openShop(){let body='<h2>🏪 道具屋</h2><p>なの姫の補助で傭兵は無料。武器・防具は売っていない。</p>';if(S.started&&!S.story.sandJoined&&S.party.includes('crab')&&!S.party.includes('merc'))body+='<div class="shoprow"><span>🗡️ 傭兵（無料）</span><button onclick="hireMerc()">雇う</button></div>'; [['やくそう',12,'HPを45回復'],['まほうの水',25,'MPを20回復'],['ガリプンテ券',40,'買っても特に意味はない']].forEach(([n,p,d])=>body+=`<div class="shoprow"><span>${n} <small class="muted">${d}</small></span><button onclick="buy('${n}',${p})">${p}デュラ</button></div>`);body+='<button onclick="closeModal()">閉じる</button>';openModal(body)}
function hireMerc(){if(S.party.includes('merc')||S.story.sandJoined)return;let c=clone(baseChars.merc);c.maxHp+=Math.min(70,S.wipes*10);c.hp=c.maxHp;c.atk+=Math.min(12,S.wipes*2);c.def+=Math.min(10,S.wipes*2);S.chars.merc=c;S.party.push('merc');log('なの姫の費用で新しい傭兵を雇った。全滅回数に応じて少し強くなっている。');render();openShop()}
function buy(n,p){if(S.money<p){log('デュラが足りない。');return}S.money-=p;S.items[n]=(S.items[n]||0)+1;log(n+'を購入。');render()}
function openInn(){if(S.money<10){log('宿代10デュラが足りない。');return}S.money-=10;restoreAll();log('宿屋で全員回復。10デュラ。');render();if(!S.lock)scene('🛏️','ぐっすり休んだ。HP・MP全回復。')}
function openGraveyard(){let body='<h2>🪦 傭兵墓地</h2><p>ここには帰らなかった傭兵たちが眠っている。</p>';body+=S.grave.length?S.grave.map((g,i)=>`<p>🪦 ${esc(g)}の墓</p>`).join(''):'<p>まだ墓はない。</p>';body+='<p>お供え物を盗む？（罰は当たるかもしれない）</p><button onclick="stealOffering()">🎁 盗む</button> <button onclick="closeModal()">閉じる</button>';openModal(body)}
function stealOffering(){if(Math.random()<.65){let n=rand(5,25);S.money+=n;log('お供え物から'+n+'デュラを盗んだ。');}else{hurt('gari',8);log('バチが当たった！HP-8')}render();closeModal()}
// 全滅：なの城（町）に運ばれる。物語の戦闘や出来事は、飛ばされない
function checkWipe(){if(aliveParty().length)return;S.wipes++;if(S.party.includes('merc')){S.mercDeaths++;S.grave.push('傭兵'+S.mercDeaths);delete S.chars.merc;S.party=S.party.filter(x=>x!=='merc')}S.party=S.party.filter(id=>S.chars[id]);restoreAll();S.money+=5;S.battle=null;S.phase='post';S.sinceBattle=0;S.step=S.story.takashiJoined?12:0;log('全滅！なの城に運ばれた。傭兵は帰らぬ人となった。');scene('🏰 👸','なの姫「また全滅したなの？ 反省文を提出するなの。……はい、立て直し費用5デュラなの」\n町で準備して、また出発しよう。',[{label:'再出発',fn:()=>{render();afterStep()}}]);render()}

// ---- セーブ・ロード（戦闘中・物語の選択肢待ちは、セーブできない）----
function saveGame(){if(!S.started||S.battle||S.lock||!(S.phase==='journey'||S.phase==='post')){log('今はセーブできない。（戦闘中や、物語の途中では保存できない）');return}try{localStorage.setItem('gari_quest2_save',JSON.stringify(S));log('セーブした。');render()}catch(e){log('セーブできなかった。')}}
function loadGame(){try{let x=localStorage.getItem('gari_quest2_save');if(!x){log('セーブデータがない。');return}let d=JSON.parse(x),n=Object.assign(fresh(),d);n.story=Object.assign(fresh().story,d.story||{});if(!n.started||n.battle||!(n.phase==='journey'||n.phase==='post')){log('このセーブは読み込めない。（戦闘中や、物語の途中のデータ）');return}S=n;S.lock=false;log('ロードした。');render();afterStep()}catch(e){log('ロードに失敗。')}}
function openModal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function showHelp(){openModal('<h2>🕹️ 操作方法</h2><p>➡️ すすむ：一本道を進行。進むたびに、ザコ敵が出たり、イベントが起きたりする。</p><p>⚔️ 修行：その場所の敵と戦う。レベル上げ・お金かせぎに。</p><p>🗺️ 最前線へ：町から、進めた所まで一気に戻る（全滅したあとなどに便利）。</p><p>⚔️ 戦闘：たたかう・魔法・道具・逃げる。勝つと、仲間全員が経験値をもらう。</p><p>♨️ 温泉・最終休憩所では、全員が全回復する。</p><p>💾 セーブ：ブラウザ内に保存（戦闘中・物語の途中は不可）。</p><p>ガリプンテは悲惨な結果多め。たまに大当たり。</p><p>画像なし・絵文字だけの雑RPGです。</p><button onclick="closeModal()">閉じる</button>')}
function clearLog(){S.log=[];render()}
document.addEventListener('keydown',e=>{if(!$('modal').classList.contains('hidden')){if(e.key==='Escape')closeModal();return}if((e.key==='ArrowRight'||e.key==='Enter'||e.key.toLowerCase()==='z')&&!e.repeat){e.preventDefault();if(S.battle)battleAction('attack');else advance()}if(e.key==='ArrowLeft'&&!e.repeat){e.preventDefault();goBack()}if(e.key.toLowerCase()==='t'&&!e.repeat){train()}if(e.key==='Escape'||e.key.toLowerCase()==='x')openMagic()});
// 起動時はタイトル画面。保存データがあればロード可能。
scene('🏰 👸 🐻','姫「なの」の命令で、ガリの新たな冒険が始まる。\n前作のだいたい2倍、雑さも2倍。',[{label:'▶ はじめから',fn:()=>{S=fresh();begin();render()}},{label:'📂 セーブから再開',fn:()=>loadGame()}]);render();
</script></body></html>

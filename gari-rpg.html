<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガリゴンクエスト 滅 </title>
<style>
  :root { --bg:#1f1f23; --panel:#2b2b31; --panel2:#36363d; --ink:#ece6e0; --soft:#a9a39e; --line:#46464e; --orange:#ffb27a; --on:#3d2e24; --sky:#cfe3f5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; font-size: 15px; line-height: 1.6; background: var(--bg); color: var(--ink); padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); user-select: none; }
  .wrap { max-width: 460px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 16px; color: #ffbf93; }
  a.home { font-size: 12px; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); border-radius: 99px; padding: 2px 12px; text-decoration: none; white-space: nowrap; }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 12px; }
  #status { font-size: 12px; color: var(--sky); margin-bottom: 8px; }
  #view { min-height: 120px; display: flex; align-items: center; justify-content: center; background: #17171a; border-radius: 12px; margin-bottom: 8px; overflow: hidden; padding: 8px 0; }
  .strip { display: flex; gap: 2px; }
  .strip span { width: 32px; text-align: center; font-size: 24px; }
  .foe { text-align: center; }
  .foe .big { font-size: 56px; line-height: 1.1; }
  .foe .nm { font-size: 13px; }
  .bar { width: 140px; height: 8px; background: var(--line); border-radius: 4px; margin: 4px auto 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #f87171; }
  #msg { min-height: 4.8em; background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  #menu { min-height: 1.6em; margin-top: 6px; font-size: 14px; color: var(--soft); }
  #menu div { color: var(--ink); }
  #menu .sel { color: var(--orange); font-weight: 700; }
  .ctrl { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
  .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 48px); gap: 4px; }
  .pad button:nth-child(1) { grid-column: 2; grid-row: 1; }
  .pad button:nth-child(2) { grid-column: 1; grid-row: 2; }
  .pad button:nth-child(3) { grid-column: 2; grid-row: 2; }
  .pad button:nth-child(4) { grid-column: 3; grid-row: 2; }
  button { font: inherit; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; touch-action: manipulation; }
  button:active { background: #46464e; }
  button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .acts { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .acts button { padding: 12px 8px; font-weight: 700; }
  #ok { background: var(--orange); color: var(--on); border-color: #c4824f; }
  .note { margin-top: 10px; font-size: 11px; color: var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐻 ガリゴンクエスト 滅 </h1>
    <a class="home" href="./index.html">🏠 もずべや</a>
  </header>
  <div class="panel">
    <div id="status"></div>
    <div id="view"></div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div id="menu"></div>
    <div class="ctrl">
      <div class="pad">
        <button data-k="up" aria-label="上">▲</button>
        <button data-k="left" aria-label="左">◀</button>
        <button data-k="down" aria-label="下">▼</button>
        <button data-k="right" aria-label="右">▶</button>
      </div>
      <div class="acts">
        <button id="ok" data-k="ok">はい / 決定</button>
        <button id="no" data-k="no">いいえ / キャンセル</button>
      </div>
    </div>
  </div>
  <p class="note">キーボード：矢印キー＝移動・選択／Enter・Zキー＝決定／Esc・Xキー＝キャンセル。おうち（🏠）でOK＝街のメニュー。進行は、このブラウザの中に自動で記録されるよ。</p>
</div>

<script>
(function () {
  'use strict';
  var LAST = 40, SAVE = 'gari_rpg_v1', LV_MAX = 99;

  var MON = [
    { n: '質問の蟹', e: '🦀', hp: 1, atk: 1, exp: 10, z: 0, line: 'ぬくもりを求めてさまよっている！' },
    { n: 'たかし', e: '👴', hp: 1, atk: 1, exp: 10, z: 0, line: '「ホーケー牧場」と叫んでいる！' },
    { n: 'スライム', e: '🫠', hp: 13, atk: 5, exp: 15, z: 0, line: 'ぷるんぷるん揺れながら見つめている！' },
    { n: '二日酔い', e: '🤢', hp: 18, atk: 6, exp: 18, z: 0, line: '頭がガンガンして視界がグラグラしている！' },

    { n: 'しつこいクリップ', e: '📎', hp: 30, atk: 4, exp: 20, z: 1, line: '何にでも挟まろうとしてくる！' },
    { n: '長すぎるレシート', e: '🧾', hp: 34, atk: 8, exp: 30, z: 1, line: '「ぺいぺいはお持ちですか？」と迫る！' },
    { n: '未読通知99+', e: '📱', hp: 32, atk: 10, exp: 40, z: 1, line: 'ピコピコ鳴って落ち着かない！' },
    { n: '既読スルー', e: '💬', hp: 36, atk: 9, exp: 35, z: 1, line: '既読が付いたまま、3日が経過している！' },
    { n: '営業電話', e: '📞', hp: 33, atk: 11, exp: 38, z: 1, line: '非通知からの電話が鳴りやまない！' },

    { n: '終電の幻', e: '🚃', hp: 55, atk: 14, exp: 80, z: 2, line: '目の前で扉が閉まりそうだ！' },
    { n: '月曜日の朝', e: '🏢', hp: 60, atk: 13, exp: 90, z: 2, line: '全員の気分をどんより重くしている！' },
    { n: 'あすか', e: '👵', hp: 58, atk: 15, exp: 100, z: 2, line: '「男なんて…」と語りはじめた！' },
    { n: '上司の説教', e: '🗣️', hp: 62, atk: 16, exp: 95, z: 2, line: '「俺の若い頃は」が止まらない！' },
    { n: '住宅ローン', e: '🏦', hp: 65, atk: 14, exp: 105, z: 2, line: '35年後まで、ガリを見張っている！' },

    { n: '結婚式の二次会', e: '💒', hp: 75, atk: 17, exp: 130, z: 3, line: '「次はガリくんの番だね」と笑っている！' },
    { n: '同窓会のマウント', e: '🎓', hp: 78, atk: 18, exp: 140, z: 3, line: '「年収いくら？」と無邪気に聞いてくる！' },
    { n: '婚活パーティーの沈黙', e: '💔', hp: 72, atk: 17, exp: 135, z: 3, line: '会話が続かず、気まずい空気が流れている！' },
    { n: '母からのLINE', e: '📱', hp: 80, atk: 19, exp: 150, z: 3, line: '「いい人いないの？」が連投されている！' },
    { n: '鏡に映る自分', e: '🪞', hp: 85, atk: 20, exp: 160, z: 3, line: '「このままでいいのか」と問いかけてくる！' }
  ];
  var BOSS = { n: '大魔王サンドゥーラ', e: '😈', hp: 130, atk: 18, exp: 0, line: '「あたしを口説こうなんて、百年早いわ」' };
  var ATK_LINES = ['今夜、一杯どうだい？', '君の瞳に、ハイボール', 'とりあえず生で！', '孤独な夜に、ちょうどいい男さ', '連絡先、交換しない？', '俺、お酒とタバコ以外にも、取り柄があるんだ…'];
  var LV_LINES = ['酒の強さが少し上がった気がする。', '孤独への耐性が上がった。', '肺活量が増えた気がする。', '口説き文句の精度が上がった。'];

  var ZONE_TILE = ['🌾', '🌲', '🌋', '🌃'];

  var CHAR_DEFS = {
    kani:      { name: '質問の蟹', emoji: '🦀', role: '村人・とにかく弱い',         hpMult: 0.30, atkMult: 0.15 },
    takashi:   { name: 'たかし',   emoji: '👴', role: '雑魚',                        hpMult: 0.30, atkMult: 0.15 },
    yuuna:     { name: 'ゆうな',   emoji: '👧', role: '村娘・平均的に強い',          hpMult: 1.00, atkMult: 1.00 },
    sakashita: { name: '坂下',     emoji: '🕴️', role: '万能職・女性にだらしない',    hpMult: 1.00, atkMult: 1.00 },
    nasuchin:  { name: 'なすちん', emoji: '🛡️', role: '戦士・前衛が強い',            hpMult: 1.20, atkMult: 1.15 },
    miruku:    { name: 'みるく',   emoji: '👊', role: '武道家・ワンパンが強い',      hpMult: 0.90, atkMult: 1.00 },
    yanitan:   { name: 'やにたん', emoji: '🧙‍♀️', role: '魔法使い・魔法のエキスパート', hpMult: 0.80, atkMult: 1.15 },
    zenchin:   { name: 'ぜんちん', emoji: '👨‍👩‍👧', role: '子持ちの不倫大好き男',       hpMult: 0.90, atkMult: 0.90 },
    nano:      { name: 'なの',     emoji: '👸', role: '姫様・回復と魔法そこそこ強い', hpMult: 0.90, atkMult: 0.90 },
    umi:       { name: '海蘊',     emoji: '🙏', role: '僧侶・作中最強',              hpMult: 1.30, atkMult: 1.30 }
  };

  var RECRUIT_AT = { 3: 'kani', 7: 'takashi', 11: 'yuuna', 15: 'sakashita', 21: 'nasuchin', 25: 'miruku', 28: 'yanitan', 32: 'zenchin', 36: 'nano', 39: 'umi' };
  var RECRUIT_INTRO = {
    kani: ['また質問の蟹が現れた。「お供させてくださいませ」'],
    takashi: ['たかしが現れた。「ホーケー牧場、一緒に行くぞ」'],
    yuuna: ['村娘のゆうなが声をかけてきた。「わたしも連れて行ってください！」'],
    sakashita: ['坂下が現れた。「君みたいな子、好きだなあ……あ、仲間になるよ」'],
    nasuchin: ['戦士なすちんが現れた。「前に出て戦うのは得意だ」'],
    miruku: ['武道家のみるくが現れた。「一発、重いのを入れるのが得意でね」'],
    yanitan: ['魔法使いのやにたんが現れた。「魔法なら任せて」'],
    zenchin: ['ぜんちんが現れた。「二股……いや、仲間に入れてくれ」'],
    nano: ['姫のなのが現れた。「わたしも一緒に戦うなの」'],
    umi: ['僧侶の海蘊が現れた。「……手伝ってあげてもいいけど？」']
  };

  var p = { lv: 1, exp: 0, hp: 30, items: 3, pos: 0, far: 0, money: 0, party: [], roster: {}, allyHp: {}, seenRecruit: {} };
  var st = 'map', q = [], after = null, cur = 0, b = null, yn = null;
  var menuItems = [], menuCancel = null;

  function $(id) { return document.getElementById(id); }
  function maxHp() { return 30 + 10 * (p.lv - 1); }
  function atk() { return 5 + 2 * (p.lv - 1); }
  function need() { return 10 + p.lv * 8; }
  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rnd(a.length)]; }
  function zone(i) { return i <= 9 ? 0 : i <= 19 ? 1 : i <= 29 ? 2 : 3; }
  function tile(i) { return i === 0 ? '🏠' : i === LAST ? '🏰' : ZONE_TILE[zone(i)]; }

  function allyMaxHp(id) { return Math.max(1, Math.round(maxHp() * CHAR_DEFS[id].hpMult)); }
  function allyAtk(id) { return Math.max(1, Math.round(atk() * CHAR_DEFS[id].atkMult)); }
  function aliveAllies() { return p.party.filter(function (id) { return (p.allyHp[id] || 0) > 0; }); }

  function save() { try { localStorage.setItem(SAVE, JSON.stringify(p)); } catch (e) {} }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(SAVE));
      if (s && [s.lv, s.exp, s.hp, s.items, s.pos].every(Number.isFinite)) {
        s.lv = Math.max(1, Math.min(LV_MAX, s.lv));
        s.pos = Math.max(0, Math.min(LAST - 1, s.pos));
        s.items = Math.max(0, Math.min(9, s.items));
        s.money = Number.isFinite(s.money) ? Math.max(0, s.money) : 30;
        s.far = Number.isFinite(s.far) ? Math.max(0, Math.min(LAST, s.far)) : s.pos;
        s.party = Array.isArray(s.party) ? s.party.filter(function (id) { return CHAR_DEFS[id]; }).slice(0, 3) : [];
        s.roster = (s.roster && typeof s.roster === 'object') ? s.roster : {};
        s.allyHp = (s.allyHp && typeof s.allyHp === 'object') ? s.allyHp : {};
        s.seenRecruit = (s.seenRecruit && typeof s.seenRecruit === 'object') ? s.seenRecruit : {};
        return s;
      }
    } catch (e) {}
    return null;
  }

  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  function render() {
    var partyEmoji = p.party.map(function (id) { return CHAR_DEFS[id].emoji; }).join('');
    $('status').textContent = 'Lv' + p.lv + '　HP ' + p.hp + '/' + maxHp() + '　EXP ' + p.exp + '/' + need() + '　🧪×' + p.items + '　🪙' + p.money + (partyEmoji ? '　👥' + partyEmoji : '');
    var v = $('view'); v.textContent = '';
    if (b) {
      var f = el('div', 'foe');
      f.appendChild(el('div', 'big', b.m.e));
      f.appendChild(el('div', 'nm', b.m.n));
      var bar = el('div', 'bar'), i = el('i');
      i.style.width = Math.round(b.m.hp / b.m.max * 100) + '%';
      bar.appendChild(i); f.appendChild(bar);
      var hpLine = 'ガリHP' + p.hp;
      p.party.forEach(function (id) { hpLine += '　' + CHAR_DEFS[id].emoji + (p.allyHp[id] || 0); });
      f.appendChild(el('div', 'nm', hpLine));
      v.appendChild(f);
    } else {
      var s = el('div', 'strip');
      for (var k = -4; k <= 4; k++) {
        var idx = p.pos + k;
        s.appendChild(el('span', '', k === 0 ? '🐻' : (idx < 0 || idx > LAST ? '　' : tile(idx))));
      }
      v.appendChild(s);
    }
    var m = $('menu'); m.textContent = '';
    if (st === 'battle') {
      ['口説く（たたかう）', 'ガンギマリンα ×' + p.items, 'にげる'].forEach(function (t, n) {
        m.appendChild(el('div', n === cur ? 'sel' : '', (n === cur ? '▶ ' : '　') + t));
      });
    } else if (st === 'yn') {
      m.textContent = '決定＝はい　／　キャンセル＝いいえ';
    } else if (st === 'menu') {
      menuItems.forEach(function (it, n) {
        m.appendChild(el('div', n === cur ? 'sel' : '', (n === cur ? '▶ ' : '　') + it.label));
      });
    }
  }

  function openMenu(items, cancelFn) {
    menuItems = items; cur = 0; menuCancel = cancelFn || toMap; st = 'menu'; render();
  }

  function say(lines, then) { q = lines.slice(); after = then || null; st = 'msg'; $('msg').textContent = q.shift(); render(); }
  function advance() {
    if (q.length) { $('msg').textContent = q.shift(); render(); }
    else { var a = after; after = null; if (a) a(); else toMap(); }
  }
  function toMap() {
    st = 'map'; b = null;
    $('msg').textContent = p.pos === 0
      ? '🏠 おうちだ。OKで街のメニュー、▶で旅に出よう。'
      : '▲▶ で奥へ、◀▼ で手前へ進もう。（いちばん奥に大魔王の城があるよ）';
    save(); render();
  }
  function yesNo(text, y, n) { st = 'yn'; yn = { y: y, n: n }; $('msg').textContent = text; render(); }

  function newGame() {
    p = { lv: 1, exp: 0, hp: 30, items: 5, pos: 0, far: 0, money: 30, party: [], roster: {}, allyHp: {}, seenRecruit: {} };
    say(['ガリ（酒とタバコと石が友）は、大魔王サンドゥーラを口説き（討伐し）に旅立った！',
         '持ち物：ガンギマリンα×5　所持金🪙30',
         'おうち（🏠）では、OKボタンで闘技場・カジノ・買い物・仲間・娼館に行けるよ。',
         '旅の途中で、心強い仲間に出会えるかも……？'], toMap);
  }

  function move(d) {
    var np = Math.max(0, Math.min(LAST, p.pos + d));
    if (np === p.pos) return;
    p.pos = np;
    if (p.pos > p.far) p.far = p.pos;
    render();

    var rid = RECRUIT_AT[p.pos];
    if (rid && !p.seenRecruit[rid]) { triggerRecruit(rid); return; }

    if (p.pos === LAST) {
      yesNo('大魔王サンドゥーラの城だ…… 口説き（討伐）に挑む？', function () { startBattle(BOSS, true); }, function () { p.pos--; toMap(); });
    } else if (p.pos > 0 && rnd(100) < 22) {
      var z = zone(p.pos);
      startBattle(pick(MON.filter(function (m) { return m.z === z; })), false);
    }
  }

  function triggerRecruit(id) {
    p.seenRecruit[id] = true;
    save();
    say(RECRUIT_INTRO[id], function () {
      yesNo('仲間にする？', function () { joinAlly(id); }, function () { toMap(); });
    });
  }
  function joinAlly(id) {
    p.roster[id] = true;
    p.allyHp[id] = allyMaxHp(id);
    var added = false;
    if (p.party.length < 3) { p.party.push(id); added = true; }
    var c = CHAR_DEFS[id];
    say([c.name + 'が仲間になった！' + (added ? '（自動で編成に加わったよ）' : '（おうちの「仲間」メニューから編成できるよ）')], toMap);
  }

  function startBattle(m, boss) {
    b = { m: { n: m.n, e: m.e, hp: m.hp, max: m.hp, atk: m.atk, exp: m.exp, line: m.line }, boss: boss };
    say([m.e + ' ' + m.n + 'が現れた！', m.line], battleMenu);
  }
  function battleMenu() { st = 'battle'; cur = 0; $('msg').textContent = 'どうする？'; render(); }

  function pickMostHurtTarget() {
    var cands = [{ id: 'gari', pct: p.hp / maxHp() }];
    p.party.forEach(function (id) {
      if ((p.allyHp[id] || 0) > 0) cands.push({ id: id, pct: (p.allyHp[id] || 0) / allyMaxHp(id) });
    });
    cands.sort(function (a, b2) { return a.pct - b2.pct; });
    return (cands[0] && cands[0].pct < 0.9) ? cands[0].id : null;
  }

  function allyDamage(id) {
    var c = CHAR_DEFS[id];
    var dmg = allyAtk(id) + rnd(4);
    var flavor = c.name + 'の一撃！';

    if (id === 'kani' || id === 'takashi') {
      flavor = c.name + 'のよわよわな一撃……';
    } else if (id === 'zenchin' && rnd(100) < 30) {
      dmg = Math.round(dmg * 1.8);
      flavor = c.name + '「二股は得意でね」二連撃！';
    } else if (id === 'miruku') {
      var r = rnd(100);
      if (r < 20) { dmg = Math.round(dmg * 2.5); flavor = c.name + '「ワンパンだ」会心の一撃！！'; }
      else if (r < 35) { dmg = Math.max(1, Math.round(dmg * 0.3)); flavor = c.name + 'の一撃は、かすっただけだった…'; }
    } else if (id === 'nano' && rnd(100) < 40) {
      var healTarget = pickMostHurtTarget();
      if (healTarget) {
        var healAmt = Math.max(5, Math.round(allyMaxHp('nano') * 0.3));
        if (healTarget === 'gari') p.hp = Math.min(maxHp(), p.hp + healAmt);
        else p.allyHp[healTarget] = Math.min(allyMaxHp(healTarget), (p.allyHp[healTarget] || 0) + healAmt);
        flavor = c.name + 'は魔法で攻撃しつつ、' + (healTarget === 'gari' ? 'ガリ' : CHAR_DEFS[healTarget].name) + 'を少し回復した！';
      } else {
        flavor = c.name + 'の魔法攻撃！';
      }
    } else if (id === 'umi') {
      flavor = c.name + 'の一撃！（さすがの強さ）';
    } else if (id === 'yanitan') {
      flavor = c.name + 'の魔法が炸裂！';
    } else if (id === 'nasuchin') {
      flavor = c.name + 'の鋭い斬撃！';
    }
    return { dmg: Math.max(1, dmg), line: flavor + ' ' + b.m.n + 'に' + Math.max(1, dmg) + 'ダメージ！' };
  }

  function enemyAttack(lines) {
    var targets = ['gari'].concat(aliveAllies());
    var target = targets[rnd(targets.length)];
    var d = Math.max(1, b.m.atk - Math.floor(p.lv / 2) + rnd(3));
    if (target === 'gari') {
      p.hp = Math.max(0, p.hp - d);
      lines.push(b.m.n + 'の攻撃！ ガリは' + d + 'のダメージを受けた！');
    } else {
      p.allyHp[target] = Math.max(0, (p.allyHp[target] || 0) - d);
      lines.push(b.m.n + 'の攻撃！ ' + CHAR_DEFS[target].name + 'は' + d + 'のダメージを受けた！');
      if (p.allyHp[target] === 0) lines.push(CHAR_DEFS[target].name + 'は倒れてしまった…');
    }
  }
  function endTurn(lines) {
    if (p.hp <= 0) {
      lines.push('ガリは力尽きた…', '目が覚めると、居酒屋の座敷で寝ていた。（もう一度、旅立とう）');
      say(lines, function () {
        p.hp = maxHp(); p.pos = 0;
        p.party.forEach(function (id) { p.allyHp[id] = allyMaxHp(id); });
        toMap();
      });
    } else {
      say(lines, battleMenu);
    }
  }

  function doAttack() {
    var lines = [];
    var d = atk() + rnd(4);
    b.m.hp = Math.max(0, b.m.hp - d);
    lines.push('ガリ「' + pick(ATK_LINES) + '」！ ' + b.m.n + 'に' + d + 'のダメージ！');
    if (b.m.hp <= 0) return win(lines);

    for (var idx = 0; idx < p.party.length; idx++) {
      var id = p.party[idx];
      if (b.m.hp <= 0) break;
      if ((p.allyHp[id] || 0) <= 0) { lines.push(CHAR_DEFS[id].name + 'は倒れていて動けない…'); continue; }
      var hit = allyDamage(id);
      b.m.hp = Math.max(0, b.m.hp - hit.dmg);
      lines.push(hit.line);
      if (b.m.hp <= 0) return win(lines);
    }

    enemyAttack(lines); endTurn(lines);
  }

  function useItem() {
    if (p.items <= 0) { say(['ガンギマリンαが ない！'], battleMenu); return; }
    var opts = [{ id: 'gari', label: 'ガリ', hp: p.hp, max: maxHp() }];
    p.party.forEach(function (id) { opts.push({ id: id, label: CHAR_DEFS[id].name, hp: (p.allyHp[id] || 0), max: allyMaxHp(id) }); });
    var items = opts.map(function (o) {
      return { label: o.label + '（HP' + o.hp + '/' + o.max + '）', fn: function () { itemHealTarget(o.id); } };
    });
    items.push({ label: 'やめる', fn: battleMenu });
    $('msg').textContent = '🧪 誰に使う？';
    openMenu(items, battleMenu);
  }
  function itemHealTarget(id) {
    p.items--;
    var lines;
    if (id === 'gari') {
      var h = Math.min(40, maxHp() - p.hp); p.hp += h;
      lines = ['ガリはガンギマリンαを飲んだ！ 目がガンギマリして HPが' + h + '回復した！'];
    } else {
      var max = allyMaxHp(id);
      var h2 = Math.min(40, max - (p.allyHp[id] || 0));
      p.allyHp[id] = Math.min(max, (p.allyHp[id] || 0) + h2);
      lines = [CHAR_DEFS[id].name + 'はガンギマリンαを飲んだ！ HPが' + h2 + '回復した！'];
    }
    enemyAttack(lines); endTurn(lines);
  }

  function flee() {
    if (b.boss) { say(['大魔王サンドゥーラからは逃げられない！（口説きたいので）'], battleMenu); return; }
    if (rnd(100) < 60) { say(['ガリは逃げ出した！（格好悪い）'], toMap); return; }
    var lines = ['逃げられなかった！']; enemyAttack(lines); endTurn(lines);
  }

  function win(lines) {
    if (b.boss) {
      try { localStorage.removeItem(SAVE); } catch (e) {}
      lines.push('大魔王サンドゥーラ「……友だちからなら、いいわよ」', 'ガリは大魔王サンドゥーラを口説き落とした（討伐した）！！', '孤独な旅は、ちょっとだけ報われた。');
      say(lines, function () { st = 'clear'; b = null; $('msg').textContent = '〜 FIN 〜　決定ボタンで、はじめから遊べるよ'; render(); });
      return;
    }
    p.exp += b.m.exp;
    var gold = Math.max(1, Math.ceil(b.m.exp * 0.3));
    p.money += gold;
    lines.push(b.m.n + 'を倒した！ 経験値' + b.m.exp + 'と、🪙' + gold + 'を得た！');
    while (p.lv < LV_MAX && p.exp >= need()) {
      p.exp -= need(); p.lv++; p.hp = Math.min(maxHp(), p.hp + 10);
      p.party.forEach(function (id) { p.allyHp[id] = Math.min(allyMaxHp(id), (p.allyHp[id] || 0) + 10); });
      lines.push('ガリはレベル' + p.lv + 'になった！' + pick(LV_LINES));
    }
    if (rnd(100) < 30 && p.items < 9) { p.items++; lines.push('ガンギマリンαを拾った！（×' + p.items + '）'); }
    say(lines, toMap);
  }

  function openTown() {
    $('msg').textContent = '🏠 おうちだ。何をする？';
    openMenu([
      { label: '⚔️ 闘技場', fn: openArena },
      { label: '🎰 カジノ', fn: openCasino },
      { label: '🛍️ 買い物', fn: openShop },
      { label: '👥 仲間', fn: openParty },
      { label: '💰 娼館（高額）', fn: openBrothel },
      { label: '🚪 旅にもどる', fn: toMap }
    ], toMap);
  }

  var ARENA_TAGS = ['よわめ', 'ふつう', 'つよめ', 'かなりつよい'];
  function openArena() {
    $('msg').textContent = '⚔️ 闘技場：腕試しの相手を選んでね。（経験値とお金が少し多めにもらえるよ）';
    var maxZone = zone(Math.min(p.far, LAST - 1));
    var items = [];
    for (var zi = 0; zi <= maxZone; zi++) {
      (function (zIndex) {
        items.push({ label: (ARENA_TAGS[zIndex] || ('エリア' + zIndex)) + 'な相手', fn: function () { arenaBattle(zIndex); } });
      })(zi);
    }
    items.push({ label: 'やめる', fn: openTown });
    openMenu(items, openTown);
  }
  function arenaBattle(zIndex) {
    var pool = MON.filter(function (m) { return m.z === zIndex; });
    var m = pick(pool);
    b = { m: { n: m.n, e: m.e, hp: m.hp, max: m.hp, atk: m.atk, exp: Math.ceil(m.exp * 1.3), line: m.line }, boss: false };
    say(['【闘技場】' + m.e + ' ' + m.n + 'が、挑戦者として現れた！', m.line], battleMenu);
  }

  function openCasino() {
    $('msg').textContent = '🎰 カジノ：所持金🪙' + p.money + '。いくら賭ける？';
    openMenu([
      { label: '🪙10で賭ける', fn: function () { gamble(10); } },
      { label: '🪙30で賭ける', fn: function () { gamble(30); } },
      { label: '🪙100で賭ける', fn: function () { gamble(100); } },
      { label: 'やめる', fn: openTown }
    ], openTown);
  }
  function gamble(bet) {
    if (p.money < bet) { say(['所持金が足りないよ…（🪙' + p.money + '）'], openCasino); return; }
    p.money -= bet;
    if (rnd(100) < 46) {
      var payout = bet * 2;
      p.money += payout;
      say(['🎰 チリンチリン！ 大当たり！ +🪙' + payout], openCasino);
    } else {
      say(['🎰 ……ハズレ。🪙' + bet + 'は夜の肥やしに消えた。'], openCasino);
    }
  }

  function openShop() {
    $('msg').textContent = '🛍️ 買い物：所持金🪙' + p.money;
    openMenu([
      { label: '宿屋で休む（全回復）🪙20', fn: restAtInn },
      { label: 'ガンギマリンαを買う 🪙15', fn: buyItem },
      { label: 'やめる', fn: openTown }
    ], openTown);
  }
  function restAtInn() {
    if (p.money < 20) { say(['お金が足りないよ…（🪙' + p.money + '）'], openShop); return; }
    p.money -= 20; p.hp = maxHp();
    p.party.forEach(function (id) { p.allyHp[id] = allyMaxHp(id); });
    say(['宿屋でぐっすり休んだ。みんなのHPが全回復した！'], openShop);
  }
  function buyItem() {
    if (p.money < 15) { say(['お金が足りないよ…（🪙' + p.money + '）'], openShop); return; }
    if (p.items >= 9) { say(['これ以上は持てないみたい。（🧪×9が上限）'], openShop); return; }
    p.money -= 15; p.items++;
    say(['ガンギマリンαを買った！（🧪×' + p.items + '）'], openShop);
  }

  function openParty() {
    var ids = Object.keys(p.roster).filter(function (id) { return p.roster[id]; });
    if (!ids.length) { say(['まだ誰も仲間になっていないみたい。旅の途中で出会えるかも。'], openTown); return; }
    var items = ids.map(function (id) {
      var c = CHAR_DEFS[id];
      var active = p.party.indexOf(id) >= 0;
      return { label: (active ? '✅ ' : '　　') + c.emoji + ' ' + c.name + '（' + c.role + '）', fn: function () { toggleParty(id); } };
    });
    items.push({ label: 'やめる', fn: openTown });
    $('msg').textContent = '👥 仲間：編成に入れる人を選んでね（ガリ＋最大3人）。✅＝編成中';
    openMenu(items, openTown);
  }
  function toggleParty(id) {
    var idx = p.party.indexOf(id);
    if (idx >= 0) {
      p.party.splice(idx, 1);
    } else {
      if (p.party.length >= 3) { openParty(); return; }
      p.party.push(id);
      if (!Number.isFinite(p.allyHp[id])) p.allyHp[id] = allyMaxHp(id);
    }
    openParty();
  }

  var BROTHEL_LINES = [
    'ガリは有り金をはたいて、暖簾をくぐった……',
    '一晩、誰かに話を聞いてもらっただけで、なぜか心が軽くなった……',
    '高いお酒と、優しい会話。財布は軽くなったが、心は少し満たされた……'
  ];
  function brothelCost() { return 150 + (p.lv - 1) * 20; }
  function openBrothel() {
    if (p.lv >= LV_MAX) { say(['もうこれ以上は、強くなれないみたい。'], openTown); return; }
    var cost = brothelCost();
    $('msg').textContent = '💰 娼館：利用すると、レベルが1上がるよ。（🪙' + cost + '／所持金🪙' + p.money + '）';
    openMenu([
      { label: '利用する（🪙' + cost + '）', fn: useBrothel },
      { label: 'やめる', fn: openTown }
    ], openTown);
  }
  function useBrothel() {
    var cost = brothelCost();
    if (p.money < cost) { say(['お金が足りないみたい…（🪙' + p.money + '／必要🪙' + cost + '）'], openBrothel); return; }
    p.money -= cost;
    p.lv++; p.hp = maxHp();
    p.party.forEach(function (id) { p.allyHp[id] = allyMaxHp(id); });
    say([pick(BROTHEL_LINES), '一夜明けて、妙に自信がついた気がする！ ガリはレベル' + p.lv + 'になった！' + pick(LV_LINES)], openTown);
  }

  function press(k) {
    if (st === 'map') {
      if (k === 'ok' && p.pos === 0) { openTown(); return; }
      if (k === 'up' || k === 'right') move(1);
      else if (k === 'down' || k === 'left') move(-1);
    } else if (st === 'msg') {
      if (k === 'ok') advance();
    } else if (st === 'battle') {
      if (k === 'up' || k === 'left') { cur = (cur + 2) % 3; render(); }
      else if (k === 'down' || k === 'right') { cur = (cur + 1) % 3; render(); }
      else if (k === 'ok') [doAttack, useItem, flee][cur]();
    } else if (st === 'menu') {
      if (!menuItems.length) return;
      if (k === 'up' || k === 'left') { cur = (cur + menuItems.length - 1) % menuItems.length; render(); }
      else if (k === 'down' || k === 'right') { cur = (cur + 1) % menuItems.length; render(); }
      else if (k === 'ok') { var it = menuItems[cur]; if (it) it.fn(); }
      else if (k === 'no') { (menuCancel || toMap)(); }
    } else if (st === 'yn') {
      if (k === 'ok') { var f = yn.y; yn = null; f(); }
      else if (k === 'no') { var g = yn.n; yn = null; g(); }
    } else if (st === 'clear') {
      if (k === 'ok') newGame();
    }
  }

  var KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok', ' ': 'ok', z: 'ok', Z: 'ok', Escape: 'no', Backspace: 'no', x: 'no', X: 'no' };
  document.addEventListener('keydown', function (e) {
    var k = KEYS[e.key];
    if (!k) return;
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    press(k);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (btn) {
    btn.addEventListener('click', function () { press(btn.getAttribute('data-k')); });
  });

  var s = load();
  if (s) {
    yesNo('前回の続きから始める？（はい＝つづき／いいえ＝はじめから）',
      function () { p = s; if (p.hp > maxHp()) p.hp = maxHp(); toMap(); },
      newGame);
  } else {
    newGame();
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真・ガリゴンクエスト</title>
<style>
  :root { --bg:#1f1f23; --panel:#2b2b31; --panel2:#36363d; --ink:#ece6e0; --soft:#a9a39e; --line:#46464e; --orange:#ffb27a; --on:#3d2e24; --sky:#cfe3f5; --hp:#f87171; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; font-size: 15px; line-height: 1.6; background: var(--bg); color: var(--ink); padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); user-select: none; }
  .wrap { max-width: 460px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 16px; color: #ffbf93; }
  a.home { font-size: 12px; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); border-radius: 99px; padding: 2px 12px; text-decoration: none; white-space: nowrap; }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 12px; }
  #status { font-size: 11px; color: var(--sky); margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
  #view { min-height: 120px; display: flex; align-items: center; justify-content: center; background: #17171a; border-radius: 12px; margin-bottom: 8px; overflow: hidden; padding: 8px 0; }
  .strip { display: flex; gap: 2px; }
  .strip span { width: 32px; text-align: center; font-size: 24px; }
  .foe { text-align: center; }
  .foe .big { font-size: 56px; line-height: 1.1; }
  .foe .nm { font-size: 13px; }
  .bar { width: 140px; height: 8px; background: var(--line); border-radius: 4px; margin: 4px auto 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--hp); transition: width 0.3s; }
  #msg { min-height: 4.8em; background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
  #menu { min-height: 1.6em; margin-top: 6px; font-size: 14px; color: var(--soft); max-height: 150px; overflow-y: auto; }
  #menu div { color: var(--ink); padding: 2px 0; }
  #menu .sel { color: var(--orange); font-weight: 700; background: rgba(255,255,255,0.05); }
  .ctrl { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
  .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 48px); gap: 4px; }
  .pad button:nth-child(1) { grid-column: 2; grid-row: 1; }
  .pad button:nth-child(2) { grid-column: 1; grid-row: 2; }
  .pad button:nth-child(3) { grid-column: 2; grid-row: 2; }
  .pad button:nth-child(4) { grid-column: 3; grid-row: 2; }
  button { font: inherit; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; touch-action: manipulation; }
  button:active { background: #46464e; }
  button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .acts { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .acts button { padding: 12px 8px; font-weight: 700; }
  #ok { background: var(--orange); color: var(--on); border-color: #c4824f; }
  .note { margin-top: 10px; font-size: 11px; color: var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐻 真・ガリゴンクエスト</h1>
    <a class="home" href="./index.html">🏠 もずべや</a>
  </header>
  <div class="panel">
    <div id="status"></div>
    <div id="view"></div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div id="menu"></div>
    <div class="ctrl">
      <div class="pad">
        <button data-k="up" aria-label="上">▲</button>
        <button data-k="left" aria-label="左">◀</button>
        <button data-k="down" aria-label="下">▼</button>
        <button data-k="right" aria-label="右">▶</button>
      </div>
      <div class="acts">
        <button id="ok" data-k="ok">はい / 決定</button>
        <button id="no" data-k="no">いいえ / キャンセル</button>
      </div>
    </div>
  </div>
  <p class="note">キーボード：矢印キー＝移動・選択／Enter・Zキー＝決定／Esc・Xキー＝キャンセル。<br>おうち（🏠）や街（🏘️）でOK＝街のメニュー。ストックした仲間は裏路地で合体できるよ。</p>
</div>

<script>
(function () {
  'use strict';
  // スケールアップ設定
  var LAST = 400, SAVE = 'gari_rpg_v2', LV_MAX = 99;
  var TOWNS = {
    0: { name: '実家', e: '🏠', line: 'おうちだ。休んでいこう。' },
    100: { name: 'ネオ・新橋', e: '🏘️', line: '酔っ払いとサラリーマンの聖地、ネオ・新橋だ。' },
    200: { name: 'メンヘラ・シティ', e: '🏘️', line: '空気が重いメンヘラ・シティだ。' },
    300: { name: 'タワマン・ビレッジ', e: '🏘️', line: '見上げると首が痛くなるタワマン・ビレッジだ。' }
  };
  var ZONE_TILE = ['🌾', '🌲', '🌋', '🌃', '🏢', '🌧️', '🗼', '🛸', '🌌', '😈'];

  // モンスターデータ
  var MON = [
    // 序盤 (Zone 0-2)
    { n: '質問の蟹', e: '🦀', hp: 15, atk: 5, exp: 10, z: 0, line: 'ぬくもりを求めている！' },
    { n: 'たかし', e: '👴', hp: 20, atk: 7, exp: 15, z: 0, line: '「ホーケー牧場」と叫んでいる！', recruit: 'takashi' },
    { n: '二日酔い', e: '🤢', hp: 25, atk: 9, exp: 18, z: 0, line: '視界がグラグラしている！' },
    { n: 'ゆうな', e: '👧', hp: 30, atk: 12, exp: 25, z: 1, line: '「お兄さん、遊んでかない？」', recruit: 'yuuna' },
    { n: 'しつこいクリップ', e: '📎', hp: 35, atk: 15, exp: 30, z: 1, line: '何にでも挟まろうとしてくる！' },
    { n: '坂下', e: '🕴️', hp: 45, atk: 20, exp: 45, z: 2, line: '「君みたいな子、好きだなあ」', recruit: 'sakashita' },
    { n: '未読通知99+', e: '📱', hp: 40, atk: 22, exp: 40, z: 2, line: 'ピコピコ鳴って落ち着かない！' },
    // 中盤 (Zone 3-6)
    { n: 'なすちん', e: '🛡️', hp: 70, atk: 35, exp: 80, z: 3, line: '前に出て盾になろうとしている！', recruit: 'nasuchin' },
    { n: '長すぎるレシート', e: '🧾', hp: 60, atk: 40, exp: 70, z: 3, line: '「ぺいぺいはお持ちですか？」' },
    { n: 'みるく', e: '👊', hp: 90, atk: 55, exp: 120, z: 4, line: 'ワンパンを狙っている！', recruit: 'miruku' },
    { n: '上司の説教', e: '🗣️', hp: 120, atk: 50, exp: 150, z: 4, line: '「俺の若い頃は」が止まらない！' },
    { n: 'やにたん', e: '🧙‍♀️', hp: 110, atk: 70, exp: 180, z: 5, line: '魔法の詠唱を始めた！', recruit: 'yanitan' },
    { n: '確定申告の鬼', e: '👿', hp: 150, atk: 80, exp: 200, z: 5, line: '領収書の不備を指摘してきた！' },
    { n: 'ぜんちん', e: '👨‍👩‍👧', hp: 180, atk: 90, exp: 250, z: 6, line: '「二股……いや、仲間に入れてくれ」', recruit: 'zenchin' },
    { n: 'マウント親戚', e: '👵', hp: 200, atk: 85, exp: 240, z: 6, line: '「で、年収いくらなの？」' },
    // 終盤 (Zone 7-9)
    { n: 'なの', e: '👸', hp: 250, atk: 120, exp: 400, z: 7, line: '「わたしも一緒に戦うなの」', recruit: 'nano' },
    { n: '意識高い系インターン', e: '💻', hp: 220, atk: 130, exp: 380, z: 7, line: '「海老ダンスです。シナジーがー」' },
    { n: '海蘊', e: '🙏', hp: 350, atk: 180, exp: 9999, z: 8, line: '「……手伝ってあげてもいいけど？」', recruit: 'umi' },
    { n: '老後資金2000万の壁', e: '🏦', hp: 800, atk: 200, exp: 1000, z: 8, line: 'とてつもない重圧を放っている！' },
    { n: '健康診断D判定', e: '🩺', hp: 500, atk: 250, exp: 1200, z: 9, line: '再検査の通知が突き刺さる！' }
  ];
  
  // はぐれメタル枠
  var METAL = { n: 'プレミアムフライデーの亡霊', e: '👻', hp: 5, atk: 50, exp: 9999, z: -1, line: '「早く帰ろうよぉ…」と震えている！すぐ逃げそうだ！', metal: true };

  // 大魔王 (HP 13000)
  var BOSS = { n: '大魔王サンドゥーラ', e: '😈', hp: 33000, atk: 350, exp: 0, line: '「年収1000万以上、身長180cm以上、次男じゃないと無理よ」' };
  
  var ATK_LINES = ['今夜、一杯どうだい？', '君の瞳に、ハイボール', 'とりあえず生で！', '孤独な夜に、ちょうどいい男さ'];
  var LV_LINES = ['酒の強さが上がった。', '孤独への耐性が上がった。', '肺活量が増えた。', '口説き文句の精度が上がった。'];

  // キャラクター定義
  var CHAR_DEFS = {
    takashi:   { name: 'たかし',   emoji: '👴', role: '雑魚', hpMult: 0.3, atkMult: 0.2 },
    yuuna:     { name: 'ゆうな',   emoji: '👧', role: '村娘', hpMult: 0.8, atkMult: 0.7 },
    sakashita: { name: '坂下',     emoji: '🕴️', role: '万能', hpMult: 1.0, atkMult: 1.0 },
    nasuchin:  { name: 'なすちん', emoji: '🛡️', role: '戦士', hpMult: 1.5, atkMult: 1.2 },
    miruku:    { name: 'みるく',   emoji: '👊', role: '武道', hpMult: 0.9, atkMult: 1.6 },
    yanitan:   { name: 'やにたん', emoji: '🧙‍♀️', role: '魔法', hpMult: 1.0, atkMult: 3.0 },
    zenchin:   { name: 'ぜんちん', emoji: '👨‍👩‍👧', role: '不倫', hpMult: 1.2, atkMult: 1.2 },
    nano:      { name: 'なの',     emoji: '👸', role: '姫様', hpMult: 1.1, atkMult: 1.3 },
    umi:       { name: '海蘊',     emoji: '🙏', role: '僧侶', hpMult: 2.0, atkMult: 2.0 },
    // 合体専用（進化）キャラ
    supertakashi: { name: 'ｽｰﾊﾟｰたかし', emoji: '🦸‍♂️', role: '覚醒', hpMult: 1.5, atkMult: 1.5 },
    shuraba:      { name: '修羅場',      emoji: '🌋', role: '混沌', hpMult: 2.5, atkMult: 3.0 },
    Tenshiusagi:   { name: '天使うさぎ', emoji: '🐰', role: '魔法', hpMult: 10.0, atkMult: 10.0 },
    kami:         { name: '神・海蘊',    emoji: '👼', role: '創造', hpMult: 15.0, atkMult: 15.0 }
  };

  // 合体レシピ
  var FUSION_RECIPES = {
    'takashi+takashi': 'supertakashi',
    'yuuna+zenchin': 'shuraba',
    'zenchin+yuuna': 'shuraba',
    'umi+umi': 'kami'
  };

  // プレイヤー状態
  var p = { lv: 1, exp: 0, hp: 30, items: 5, pos: 0, far: 0, money: 30, party: [], roster: [], allyHp: {} };
  var st = 'map', q = [], after = null, cur = 0, b = null, yn = null, fusionOpts = [];
  var menuItems = [], menuCancel = null;

  function $(id) { return document.getElementById(id); }
  function maxHp() { return Math.floor(30 + 15 * Math.pow(p.lv - 1, 1.2)); }
  function atk() { return Math.floor(10 + 5 * Math.pow(p.lv - 1, 1.1)); }
  function need() { return Math.floor(20 + 15 * Math.pow(p.lv, 1.5)); }
  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rnd(a.length)]; }
  function zone(i) { return Math.min(9, Math.floor(i / 40)); }
  function tile(i) { 
    if (TOWNS[i]) return TOWNS[i].e;
    if (i === LAST) return '🏰';
    return ZONE_TILE[zone(i)]; 
  }

  // rostor内の仲間の実データ取得
  function getAllyData(rosterIdx) { return p.roster[rosterIdx]; }
  function allyMaxHp(rIdx) { var a = getAllyData(rIdx); return Math.max(1, Math.floor(maxHp() * CHAR_DEFS[a.id].hpMult * (1 + a.plus * 0.2))); }
  function allyAtk(rIdx) { var a = getAllyData(rIdx); return Math.max(1, Math.floor(atk() * CHAR_DEFS[a.id].atkMult * (1 + a.plus * 0.2))); }
  function aliveAllies() { return p.party.filter(function (rIdx) { return (p.allyHp[rIdx] || 0) > 0; }); }

  function save() { try { localStorage.setItem(SAVE, JSON.stringify(p)); } catch (e) {} }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(SAVE));
      if (s && s.lv) {
        s.party = s.party || []; s.roster = s.roster || []; s.allyHp = s.allyHp || {};
        return s;
      }
    } catch (e) {}
    return null;
  }

  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  function render() {
    var partyStr = p.party.map(function(idx) { 
      var a = getAllyData(idx); 
      return CHAR_DEFS[a.id].emoji + (a.plus > 0 ? '+' + a.plus : ''); 
    }).join(' ');
    
    $('status').innerHTML = '<span>Lv' + p.lv + '</span> <span>HP ' + p.hp + '/' + maxHp() + '</span> <span>EXP ' + p.exp + '/' + need() + '</span> <span>🧪×' + p.items + '</span> <span>🪙' + p.money + '</span>' + (partyStr ? '<br>👥 ' + partyStr : '');
    
    var v = $('view'); v.textContent = '';
    if (b) {
      var f = el('div', 'foe');
      f.appendChild(el('div', 'big', b.m.e));
      f.appendChild(el('div', 'nm', b.m.n));
      var bar = el('div', 'bar'), i = el('i');
      i.style.width = Math.max(0, Math.min(100, (b.m.hp / b.m.max * 100))) + '%';
      bar.appendChild(i); f.appendChild(bar);
      var hpLine = 'ガリ' + p.hp;
      p.party.forEach(function (rIdx) { 
        var a = getAllyData(rIdx);
        hpLine += ' ' + CHAR_DEFS[a.id].emoji + (p.allyHp[rIdx] || 0); 
      });
      f.appendChild(el('div', 'nm', hpLine));
      v.appendChild(f);
    } else {
      var s = el('div', 'strip');
      for (var k = -4; k <= 4; k++) {
        var idx = p.pos + k;
        s.appendChild(el('span', '', k === 0 ? '🐻' : (idx < 0 || idx > LAST ? ' ' : tile(idx))));
      }
      v.appendChild(s);
    }
    
    var m = $('menu'); m.textContent = '';
    if (st === 'battle') {
      ['口説く（たたかう）', 'ガンギマリンα ×' + p.items, 'にげる'].forEach(function (t, n) {
        m.appendChild(el('div', n === cur ? 'sel' : '', (n === cur ? '▶ ' : ' ') + t));
      });
    } else if (st === 'yn') {
      m.textContent = '決定＝はい ／ キャンセル＝いいえ';
    } else if (st === 'menu') {
      menuItems.forEach(function (it, n) {
        m.appendChild(el('div', n === cur ? 'sel' : '', (n === cur ? '▶ ' : ' ') + it.label));
      });
      // メニューのスクロール調整
      if (m.children[cur]) m.children[cur].scrollIntoView({ block: 'nearest' });
    }
  }

  function openMenu(items, cancelFn) { menuItems = items; cur = 0; menuCancel = cancelFn || toMap; st = 'menu'; render(); }
  function say(lines, then) { q = lines.slice(); after = then || null; st = 'msg'; advance(); }
  function advance() {
    if (q.length) { $('msg').innerHTML = q.shift(); render(); }
    else { var a = after; after = null; if (a) a(); else toMap(); }
  }
  function toMap() {
    st = 'map'; b = null;
    var msg = TOWNS[p.pos] ? TOWNS[p.pos].e + ' ' + TOWNS[p.pos].line + '（OKで街メニュー）' 
            : '▲▶で奥へ、◀▼で手前へ進もう。';
    if (p.pos === LAST) msg = '🏰 大魔王の城だ…（OKで突入）';
    $('msg').textContent = msg;
    save(); render();
  }
  function yesNo(text, y, n) { st = 'yn'; yn = { y: y, n: n }; $('msg').innerHTML = text; render(); }

  function newGame() {
    p = { lv: 1, exp: 0, hp: 30, items: 5, pos: 0, far: 0, money: 50, party: [], roster: [], allyHp: {} };
    say(['ガリは、大魔王サンドゥーラを口説きに旅立った！',
         '持ち物：ガンギマリンα×5 所持金🪙50',
         'おうち（🏠）や街（🏘️）では、休んだり仲間を合体できるよ。',
         '人間系の敵を倒すと、仲間になってくれるかも…？'], toMap);
  }

  function move(d) {
    if (d === 0 && TOWNS[p.pos]) { openTown(); return; }
    if (d === 0 && p.pos === LAST) { triggerBoss(); return; }
    
    var np = Math.max(0, Math.min(LAST, p.pos + d));
    if (np === p.pos) return;
    p.pos = np;
    if (p.pos > p.far) p.far = p.pos;
    render();

    if (p.pos > 0 && !TOWNS[p.pos] && p.pos !== LAST && rnd(100) < 25) {
      var z = zone(p.pos);
      // 1%の確率ではぐれメタル
      var m = (rnd(100) < 1) ? METAL : pick(MON.filter(function (x) { return x.z === z || x.z === z-1; }));
      startBattle(m, false);
    } else {
      toMap();
    }
  }

  function triggerBoss() {
    yesNo('大魔王サンドゥーラの城だ…… 口説き（討伐）に挑む？', function () { startBattle(BOSS, true); }, function () { p.pos--; toMap(); });
  }

  function startBattle(m, boss) {
    // 敵のステータスを少しブレさせる
    var ehp = boss ? m.hp : Math.floor(m.hp * (0.9 + rnd(20)/100));
    b = { m: { n: m.n, e: m.e, hp: ehp, max: ehp, atk: m.atk, exp: m.exp, line: m.line, recruit: m.recruit, metal: m.metal }, boss: boss };
    say([m.e + ' ' + m.n + 'が現れた！', m.line], battleMenu);
  }
  function battleMenu() { st = 'battle'; cur = 0; $('msg').textContent = 'どうする？'; render(); }

  function allyDamage(rIdx) {
    var a = getAllyData(rIdx);
    var c = CHAR_DEFS[a.id];
    var dmg = allyAtk(rIdx) + rnd(10);
    var flavor = c.name + 'の一撃！';

    // 会心判定（メタル対策）
    var isCrit = false;
    if (a.id === 'miruku' && rnd(100) < 30) isCrit = true;
    else if (rnd(100) < 5) isCrit = true;

    if (isCrit) {
      dmg = Math.floor(dmg * 2.5);
      flavor = c.name + 'の会心の一撃！！';
    }

    if (b.m.metal && !isCrit) dmg = 1; // メタル系には会心以外1ダメージ

    return { dmg: Math.max(1, dmg), line: flavor + ' ' + b.m.n + 'に' + Math.max(1, dmg) + 'ダメージ！' };
  }

  function enemyAttack(lines) {
    var targets = ['gari'].concat(aliveAllies());
    var target = targets[rnd(targets.length)];
    var d = Math.max(1, b.m.atk - Math.floor(p.lv * 1.5) + rnd(10));
    
    if (target === 'gari') {
      p.hp = Math.max(0, p.hp - d);
      lines.push(b.m.n + 'の攻撃！ ガリは' + d + 'のダメージを受けた！');
    } else {
      var a = getAllyData(target);
      p.allyHp[target] = Math.max(0, (p.allyHp[target] || 0) - d);
      lines.push(b.m.n + 'の攻撃！ ' + CHAR_DEFS[a.id].name + 'は' + d + 'のダメージを受けた！');
      if (p.allyHp[target] === 0) lines.push(CHAR_DEFS[a.id].name + 'は倒れてしまった…');
    }
  }
  
  function endTurn(lines) {
    if (p.hp <= 0) {
      lines.push('ガリは力尽きた…', '目が覚めると、実家の布団で寝ていた。（もう一度、旅立とう）');
      say(lines, function () {
        p.hp = maxHp(); p.pos = 0;
        p.party.forEach(function (idx) { p.allyHp[idx] = allyMaxHp(idx); });
        toMap();
      });
    } else {
      say(lines, battleMenu);
    }
  }

  function doAttack() {
    var lines = [];
    if (b.m.metal && rnd(100) < 60) {
      lines.push(b.m.n + 'はササッと逃げ出した！！');
      say(lines, toMap);
      return;
    }

    var isCrit = (rnd(100) < 5);
    var d = atk() + rnd(10);
    if (isCrit) d *= 2;
    if (b.m.metal && !isCrit) d = 1;
    
    b.m.hp = Math.max(0, b.m.hp - d);
    lines.push('ガリ「' + pick(ATK_LINES) + '」！ ' + b.m.n + 'に' + d + 'のダメージ！' + (isCrit ? '（会心！）' : ''));
    if (b.m.hp <= 0) return win(lines);

    for (var i = 0; i < p.party.length; i++) {
      var rIdx = p.party[i];
      if (b.m.hp <= 0) break;
      if ((p.allyHp[rIdx] || 0) <= 0) continue;
      var hit = allyDamage(rIdx);
      b.m.hp = Math.max(0, b.m.hp - hit.dmg);
      lines.push(hit.line);
      if (b.m.hp <= 0) return win(lines);
    }

    enemyAttack(lines); endTurn(lines);
  }

  function useItem() {
    if (p.items <= 0) { say(['ガンギマリンαが ない！'], battleMenu); return; }
    var opts = [{ id: 'gari', label: 'ガリ', hp: p.hp, max: maxHp() }];
    p.party.forEach(function (rIdx) { 
      var a = getAllyData(rIdx);
      opts.push({ id: rIdx, label: CHAR_DEFS[a.id].name, hp: (p.allyHp[rIdx] || 0), max: allyMaxHp(rIdx) }); 
    });
    var items = opts.map(function (o) {
      return { label: o.label + '（HP' + o.hp + '/' + o.max + '）', fn: function () { itemHealTarget(o.id); } };
    });
    items.push({ label: 'やめる', fn: battleMenu });
    $('msg').textContent = '🧪 誰に使う？';
    openMenu(items, battleMenu);
  }
  
  function itemHealTarget(target) {
    p.items--;
    var lines, heal = 100; // 回復量アップ
    if (target === 'gari') {
      var h = Math.min(heal, maxHp() - p.hp); p.hp += h;
      lines = ['ガリはガンギマリンαを飲んだ！ HPが' + h + '回復した！'];
    } else {
      var max = allyMaxHp(target);
      var h2 = Math.min(heal, max - (p.allyHp[target] || 0));
      p.allyHp[target] += h2;
      lines = [CHAR_DEFS[getAllyData(target).id].name + 'はガンギマリンαを飲んだ！ HPが' + h2 + '回復した！'];
    }
    enemyAttack(lines); endTurn(lines);
  }

  function flee() {
    if (b.boss) { say(['大魔王からは逃げられない！（口説きたいので）'], battleMenu); return; }
    if (rnd(100) < 70) { say(['ガリは逃げ出した！（格好悪い）'], toMap); return; }
    var lines = ['逃げられなかった！']; enemyAttack(lines); endTurn(lines);
  }

  function win(lines) {
    if (b.boss) {
      try { localStorage.removeItem(SAVE); } catch (e) {}
      lines.push('大魔王サンドゥーラ「……友だちからなら、いいわよ」', 'ガリは大魔王サンドゥーラを口説き落とした！！', '孤独な旅は、ついに報われた。');
      say(lines, function () { st = 'clear'; b = null; $('msg').textContent = '〜 滅・FIN 〜 決定ボタンで最初から'; render(); });
      return;
    }
    
    p.exp += b.m.exp;
    var gold = Math.max(1, Math.floor(b.m.exp * 0.4));
    p.money += gold;
    lines.push(b.m.n + 'を倒した！ 経験値' + b.m.exp + 'と🪙' + gold + 'を得た！');
    
    while (p.lv < LV_MAX && p.exp >= need()) {
      p.exp -= need(); p.lv++; p.hp = maxHp();
      p.party.forEach(function (rIdx) { p.allyHp[rIdx] = allyMaxHp(rIdx); });
      lines.push('レベル' + p.lv + 'になった！ ' + pick(LV_LINES));
    }
    
    var recruitId = b.m.recruit;
    if (recruitId && rnd(100) < 30) { // 30%で仲間になる
      say(lines, function() {
        var c = CHAR_DEFS[recruitId];
        yesNo(c.name + 'が仲間になりたそうにこちらを見ている。仲間にする？', 
          function() {
            var newIdx = p.roster.length;
            p.roster.push({ id: recruitId, plus: 0 });
            p.allyHp[newIdx] = allyMaxHp(newIdx);
            if (p.party.length < 3) p.party.push(newIdx); // 空きがあれば自動編成
            say([c.name + 'が仲間のストックに加わった！'], toMap);
          }, 
          toMap);
      });
      return;
    }
    say(lines, toMap);
  }

  // === 街の機能 ===
  function openTown() {
    var t = TOWNS[p.pos];
    $('msg').textContent = t.e + ' ' + t.name + '：何をする？';
    var acts = [
      { label: '🛏️ 宿屋（全回復）🪙' + (p.lv * 5), fn: restAtInn },
      { label: '🛍️ 道具屋（ガンギマリンα）🪙25', fn: buyItem },
      { label: '👥 仲間編成', fn: openParty },
      { label: '👯 怪しい裏路地（仲間合体）', fn: openFusion },
      { label: '🚪 旅にもどる', fn: toMap }
    ];
    openMenu(acts, toMap);
  }

  function restAtInn() {
    var cost = p.lv * 5;
    if (p.money < cost) { say(['お金が足りないよ…（🪙' + p.money + '）'], openTown); return; }
    p.money -= cost; p.hp = maxHp();
    p.party.forEach(function (idx) { p.allyHp[idx] = allyMaxHp(idx); });
    say(['宿屋でぐっすり休んだ。全員のHPが全回復した！'], openTown);
  }

  function buyItem() {
    if (p.money < 25) { say(['お金が足りないよ…（🪙' + p.money + '）'], openTown); return; }
    if (p.items >= 15) { say(['これ以上は持てないみたい。（🧪15個上限）'], openTown); return; }
    p.money -= 25; p.items++;
    say(['ガンギマリンαを買った！（🧪×' + p.items + '）'], openTown);
  }

  function openParty() {
    if (!p.roster.length) { say(['まだストックに誰もいないみたい。'], openTown); return; }
    var items = p.roster.map(function (a, idx) {
      var c = CHAR_DEFS[a.id];
      var active = p.party.indexOf(idx) >= 0;
      return { label: (active ? '✅ ' : '  ') + c.emoji + c.name + (a.plus > 0 ? '+'+a.plus : '') + '（' + c.role + '）', 
               fn: function () { toggleParty(idx); } };
    });
    items.push({ label: 'やめる', fn: openTown });
    $('msg').textContent = '👥 編成：編成する人を選んでね（ガリ＋最大3人）';
    openMenu(items, openTown);
  }
  function toggleParty(idx) {
    var pos = p.party.indexOf(idx);
    if (pos >= 0) p.party.splice(pos, 1);
    else if (p.party.length < 3) p.party.push(idx);
    openParty();
  }

  // === 仲間合体システム ===
  function openFusion() {
    fusionOpts = [];
    if (p.roster.length < 2) { say(['合体するには、ストックに仲間が2人以上必要だ。'], openTown); return; }
    selectFusion1();
  }
  function selectFusion1() {
    var items = p.roster.map(function (a, idx) {
      return { label: CHAR_DEFS[a.id].name + (a.plus>0?'+'+a.plus:''), fn: function () { fusionOpts[0] = idx; selectFusion2(); } };
    });
    items.push({ label: 'やめる', fn: openTown });
    $('msg').textContent = '👯 合体：ベースになる1人目を選んでね。（※合体すると編成から外れます）';
    openMenu(items, openTown);
  }
  function selectFusion2() {
    var items = [];
    p.roster.forEach(function (a, idx) {
      if (idx !== fusionOpts[0]) {
        items.push({ label: CHAR_DEFS[a.id].name + (a.plus>0?'+'+a.plus:''), fn: function () { fusionOpts[1] = idx; executeFusion(); } });
      }
    });
    items.push({ label: '選び直す', fn: selectFusion1 });
    $('msg').textContent = '👯 合体：素材になる2人目を選んでね。';
    openMenu(items, selectFusion1);
  }
  function executeFusion() {
    var idx1 = fusionOpts[0], idx2 = fusionOpts[1];
    var a1 = p.roster[idx1], a2 = p.roster[idx2];
    
    var recipeKey1 = a1.id + '+' + a2.id;
    var recipeKey2 = a2.id + '+' + a1.id;
    var newId = FUSION_RECIPES[recipeKey1] || FUSION_RECIPES[recipeKey2];
    
    var resultPlus = 0;
    if (newId) {
      // 進化合体
      resultPlus = Math.max(a1.plus, a2.plus); 
    } else {
      // ベースアップ合体（同キャラなら+2、別キャラなら+1）
      newId = a1.id;
      resultPlus = a1.plus + (a1.id === a2.id ? (a2.plus + 1) : 1);
    }
    
    var cName = CHAR_DEFS[newId].name + (resultPlus > 0 ? '+' + resultPlus : '');
    yesNo(CHAR_DEFS[a1.id].name + ' と ' + CHAR_DEFS[a2.id].name + ' を合体させて「' + cName + '」にする？', 
      function() {
        // 編成から一旦外す
        p.party = [];
        // 後ろのインデックスから削除
        var maxIdx = Math.max(idx1, idx2), minIdx = Math.min(idx1, idx2);
        p.roster.splice(maxIdx, 1);
        p.roster.splice(minIdx, 1);
        
        // 新しいキャラをストックに追加
        var newIdx = p.roster.length;
        p.roster.push({ id: newId, plus: resultPlus });
        p.allyHp[newIdx] = allyMaxHp(newIdx);
        
        say(['👯 怪しい光が包み込む……！', '合体成功！「' + cName + '」が誕生した！'], openTown);
      },
      selectFusion1);
  }

  // === キー入力制御 ===
  function press(k) {
    if (st === 'map') {
      if (k === 'ok') move(0);
      else if (k === 'up' || k === 'right') move(1);
      else if (k === 'down' || k === 'left') move(-1);
    } else if (st === 'msg') {
      if (k === 'ok') advance();
    } else if (st === 'battle') {
      if (k === 'up' || k === 'left') { cur = (cur + 2) % 3; render(); }
      else if (k === 'down' || k === 'right') { cur = (cur + 1) % 3; render(); }
      else if (k === 'ok') [doAttack, useItem, flee][cur]();
    } else if (st === 'menu') {
      if (!menuItems.length) return;
      if (k === 'up' || k === 'left') { cur = (cur + menuItems.length - 1) % menuItems.length; render(); }
      else if (k === 'down' || k === 'right') { cur = (cur + 1) % menuItems.length; render(); }
      else if (k === 'ok') { var it = menuItems[cur]; if (it) it.fn(); }
      else if (k === 'no') { (menuCancel || toMap)(); }
    } else if (st === 'yn') {
      if (k === 'ok') { var f = yn.y; yn = null; f(); }
      else if (k === 'no') { var g = yn.n; yn = null; g(); }
    } else if (st === 'clear') {
      if (k === 'ok') newGame();
    }
  }

  var KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok', ' ': 'ok', z: 'ok', Z: 'ok', Escape: 'no', Backspace: 'no', x: 'no', X: 'no' };
  document.addEventListener('keydown', function (e) {
    var k = KEYS[e.key];
    if (k) { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); press(k); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (btn) {
    btn.addEventListener('click', function () { press(btn.getAttribute('data-k')); });
  });

  var s = load();
  if (s) { yesNo('前回の続きから始める？', function () { p = s; toMap(); }, newGame); } 
  else { newGame(); }
})();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ざくざく装備ワールド</title>
<style>
  :root { --bg:#1f1f23; --card:#2b2b31; --card2:#36363d; --ink:#ece6e0; --soft:#a9a39e; --line:#46464e; --orange:#ffb27a; --on:#3d2e24; --mint:#8fd9b0; --red:#f87171; --sky:#cfe3f5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; font-size: 14px; line-height: 1.55; color: var(--ink); background: var(--bg); -webkit-tap-highlight-color: transparent;
         padding: calc(10px + env(safe-area-inset-top, 0px)) 10px calc(14px + env(safe-area-inset-bottom, 0px)); }
  #app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 17px; color: #ffbf93; }
  header div { display: flex; gap: 6px; }
  header button, header a { font: inherit; font-size: 12px; color: var(--ink); background: var(--card2); border: 2px solid var(--line); border-radius: 99px; padding: 2px 12px; text-decoration: none; cursor: pointer; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .card h2 { font-size: 15px; color: var(--orange); margin-bottom: 6px; }
  .bar { height: 9px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 3px 0 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--mint); }
  .bar.e i { background: var(--red); } .bar.x i { background: #7aa8ff; }
  .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  #log { white-space: pre-wrap; font-size: 12.5px; min-height: 8.5em; color: var(--soft); }
  .grid { display: grid; gap: 6px; } .g2 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); }
  button.b, select { font: inherit; font-weight: 700; min-height: 40px; padding: 4px 8px; border-radius: 12px; border: 2px solid #c4824f; background: var(--orange); color: var(--on); cursor: pointer; touch-action: manipulation; }
  button.b.sub { background: var(--card2); color: var(--ink); border-color: var(--line); font-weight: 500; font-size: 12.5px; }
  button.b.on { background: var(--mint); border-color: #5ba884; }
  button.b.mini { min-height: 30px; font-size: 12px; padding: 2px 8px; }
  select { background: #232327; color: var(--ink); border-color: var(--line); font-weight: 500; font-size: 13px; width: 100%; }
  .it { border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; margin-top: 6px; background: var(--card2); }
  .it b { display: block; font-size: 13px; word-break: break-all; }
  .it small { display: block; color: var(--soft); font-size: 11.5px; }
  .it .acts { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .up { color: var(--mint); } .down { color: var(--red); }
  .r0 { border-left: 5px solid #b8b8b8; } .r1 { border-left: 5px solid #6ee7a0; } .r2 { border-left: 5px solid #60a5fa; }
  .r3 { border-left: 5px solid #c084fc; } .r4 { border-left: 5px solid #fb923c; } .r5 { border-left: 5px solid #f43f5e; }
  .lead { font-size: 12.5px; color: var(--soft); }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🗡️ ざくざく装備ワールド</h1>
    <div><button id="reset" type="button">🔄 最初から</button><a href="./index.html">🏠</a></div>
  </header>

  <div class="card">
    <div class="row"><span id="lv"></span><span id="gold"></span></div>
    <div class="bar x"><i id="expbar"></i></div>
    <div class="row"><span id="stage"></span><span id="kills"></span></div>
    <div class="row"><span id="ename"></span><span id="ehp"></span></div>
    <div class="bar e"><i id="ebar"></i></div>
    <div class="row"><span>あなた</span><span id="php"></span></div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="row" id="pst" style="color:var(--sky)"></div>
    <div class="grid g3" style="margin-top:8px">
      <button class="b sub" id="farm" type="button"></button>
      <button class="b sub" id="spd" type="button"></button>
      <button class="b sub" id="auto" type="button"></button>
    </div>
  </div>

  <div id="log" class="card" role="log" aria-live="polite"></div>

  <div class="card"><h2>🛡️ いまの装備</h2><div id="eq"></div></div>

  <div class="card">
    <h2>🎒 バッグ <span id="bagn" style="font-size:12px;color:var(--soft)"></span></h2>
    <div class="grid g3">
      <select id="fslot" aria-label="部位"><option value="">ぜんぶの部位</option><option value="w">武器</option><option value="h">頭</option><option value="b">体</option><option value="f">足</option><option value="a">アクセサリー</option></select>
      <select id="fsort" aria-label="並び順"><option value="s">強さ順</option><option value="r">レア度順</option><option value="n">新しい順</option></select>
      <select id="fsell" aria-label="自動で売る"></select>
    </div>
    <div class="grid g2" style="margin-top:6px"><button class="b" id="best" type="button">⚡ ベスト装備にする</button><button class="b sub" id="sellall" type="button">💰 ロックなしの低レアを売る</button></div>
    <div id="bag"></div>
  </div>

  <div class="card"><h2>📖 記録</h2><div id="rec" class="lead"></div></div>
  <p class="lead" style="text-align:center">放置してても、ブラウザを開いていれば、自動で戦って、装備を拾うよ。閉じていても、次に開いたとき、おるすばん分が入るよ。</p>
</div>

<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var SAVE = 'zakuzaku_soubi_v1';

  // ===== データ（数値・名前は、ここで調整・追加できるよ）=====
  var RAR = ['コモン', 'アンコモン', 'レア', 'エピック', 'レジェンド', 'ミシック'];
  var RM = [1, 1.15, 1.35, 1.6, 2, 2.6];                 // レア度ごとの倍率
  var RW = [60, 25, 10, 3.5, 1.3, 0.2];                  // 落ちやすさ（％の目安）
  var MAT = ['ぼろ', '木', '石', '骨', '革', '銅', '鉄', '青銅', '鋼', '銀', '金', '白銀', '水晶', '翡翠', '紅玉', '蒼玉', '黒鉄', 'ミスリル', 'オリハルコン', '竜骨', '竜鱗', '星屑', '月光', '日輪', '雷鳴', '氷河', '炎獄', '深海', '天空', '虚空', '幻獣', '神木', '神鉄', '時渡り', '世界樹', '創世'];
  var ADJ = ['輝く', '燃える', '凍てつく', '古びた', '呪われた', '祝福の', '荒ぶる', '静かな', '歌う', '眠る', '飢えた', '気高い', '狂気の', '忘れられた', '伝説の', '禁じられた', '夜明けの', '黄昏の', '嵐の', '秘められた',
             'しょーもない', 'ありがたい', 'ぬるぬるの', 'きらきらの', 'ふわふわの', 'ごつい', 'とがった', 'まるい', 'おかしな', '最強の', '泣き虫の', '怒りの', '笑う', 'こっそり', '堂々たる', 'ぴかぴかの', 'どっしりした', '軽やかな', '真夜中の', '朝焼けの'];
  var K = [   // 装備の種類。slot＝部位／b＝ベース名／m＝本体の能力の割合（atk・def・hp・spd）
    { s: 'w', n: '剣',   b: ['ブロードソード', 'サーベル', 'ロングソード'], m: { atk: 1 } },
    { s: 'w', n: '槍',   b: ['スピア', 'ハルバード', 'ランス'], m: { atk: 1.05 } },
    { s: 'w', n: '斧',   b: ['バトルアックス', 'ハチェット', '大斧'], m: { atk: 1.25 } },
    { s: 'w', n: '弓',   b: ['ショートボウ', 'ロングボウ', 'クロスボウ'], m: { atk: 0.95, spd: 0.3 } },
    { s: 'w', n: '杖',   b: ['ワンド', 'スタッフ', 'ロッド'], m: { atk: 1.1 } },
    { s: 'w', n: '短剣', b: ['ダガー', 'ナイフ', 'クナイ'], m: { atk: 0.8, spd: 1 } },
    { s: 'w', n: '鞭',   b: ['ウィップ', 'ロープ', 'ムチ'], m: { atk: 0.9, spd: 0.8 } },
    { s: 'w', n: '槌',   b: ['ハンマー', 'メイス', 'モール'], m: { atk: 1.15, hp: 1 } },
    { s: 'w', n: '刀',   b: ['カタナ', 'ナタ', '太刀'], m: { atk: 1.1 } },
    { s: 'w', n: '鎌',   b: ['サイズ', 'カマ', 'デスサイズ'], m: { atk: 1.1, spd: 0.3 } },
    { s: 'h', n: '兜',   b: ['かぶと', 'ヘルム', 'ずきん'], m: { def: 0.6, hp: 2 } },
    { s: 'b', n: '鎧',   b: ['よろい', 'ローブ', 'ベスト'], m: { def: 1, hp: 4 } },
    { s: 'f', n: '靴',   b: ['ブーツ', 'グリーブ', 'わらじ'], m: { def: 0.5, spd: 0.6, hp: 1 } },
    { s: 'a', n: '指輪', b: ['リング', 'ゆびわ', '印章'], m: { atk: 0.5 } },
    { s: 'a', n: '首飾り', b: ['ネックレス', 'ペンダント', '数珠'], m: { hp: 3 } },
    { s: 'a', n: '腕輪', b: ['ブレスレット', 'バングル', '手甲'], m: { def: 0.5, hp: 1 } },
    { s: 'a', n: '耳飾り', b: ['イヤリング', 'ピアス', '耳飾り'], m: { spd: 0.6, atk: 0.3 } },
    { s: 'a', n: 'お守り', b: ['タリスマン', 'お守り', '札'], m: { hp: 2, def: 0.3 } },
    { s: 'a', n: 'マント', b: ['マント', 'ケープ', '羽織'], m: { def: 0.4, spd: 0.4, hp: 1 } }
  ];
  var AF = [   // 追加効果［キー, 名前, 基本の大きさ, 強さの重み, 単位の説明］
    ['hpP', '生命', 6, 1.0, 'HP'], ['atkP', '破壊', 6, 1.4, 'こうげき'], ['defP', '守護', 6, 1.0, 'ぼうぎょ'], ['spd', '疾風', 6, 1.0, 'すばやさ'],
    ['crit', '会心', 4, 1.2, '会心率'], ['critd', '猛撃', 10, 0.6, '会心ダメージ'], ['ls', '吸血', 2, 2.0, '吸収'], ['regen', '再生', 2, 0.8, 'HP回復/秒'],
    ['thorn', '反撃', 8, 0.5, '反撃'], ['dodge', '回避', 3, 1.2, '回避率'], ['gold', '黄金', 12, 0.3, 'ゴールド'], ['exp', '賢者', 12, 0.3, '経験値'],
    ['drop', '幸運', 8, 0.7, 'ドロップ'], ['dbl', '二連', 4, 1.2, '2回攻撃'], ['pierce', '貫通', 6, 0.8, '防御無視'], ['block', '堅牢', 3, 1.2, 'ダメージ軽減'],
    ['burst', '爆裂', 3, 1.2, '大ダメージ率'], ['exec', '処刑', 12, 0.5, '瀕死の敵に追加'], ['boss', '竜殺し', 12, 0.5, 'ボスに追加'], ['shield', '結界', 6, 0.8, '開始時バリア']
  ];
  var SLOTS = [['w', '武器'], ['h', '頭'], ['b', '体'], ['f', '足'], ['a1', 'アクセ1'], ['a2', 'アクセ2']];
  var BAG_MAX = 300, TICK = 500, KILLS_PER_STAGE = 5, OFFLINE_MAX = 8 * 3600;

  // ===== 乱数・装備の生成（シードから、ずっと同じ装備が作れる）=====
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rnd = function (n) { return Math.floor(Math.random() * n); };

  function gen(it) {
    if (it._g) return it._g;
    var r = mulberry(it.s), k = K[it.k], t = Math.max(0, Math.min(MAT.length - 1, Math.floor(it.l / 4) + Math.floor(r() * 3) - 1));
    var base = k.b[Math.floor(r() * 3)], adj = it.r > 0 ? ADJ[Math.floor(r() * ADJ.length)] : '';
    var ids = [], i;
    while (ids.length < it.r) { i = Math.floor(r() * AF.length); if (ids.indexOf(i) < 0) ids.push(i); }
    var V = (3 + it.l * 1.5) * RM[it.r] * (1 + 0.08 * it.p), st = { atk: 0, def: 0, hp: 0, spd: 0 }, m = k.m;
    st.atk = Math.round(V * (m.atk || 0)); st.def = Math.round(V * 0.7 * (m.def || 0)); st.hp = Math.round(V * 4 * (m.hp || 0)); st.spd = Math.round(V * 0.12 * (m.spd || 0));
    var af = ids.map(function (j) { var a = AF[j]; return { k: a[0], n: a[1], u: a[4], w: a[3], v: Math.round(a[2] * (0.7 + 0.6 * r()) * (1 + it.l / 50) * (1 + 0.1 * it.r) * 10) / 10 }; });
    var score = st.atk * 2 + st.def * 2 + st.hp / 4 + st.spd * 2 + af.reduce(function (s, a) { return s + a.v * a.w * 3; }, 0);
    var tag = af.slice(0, 2).map(function (a) { return a.n; }).join('・');
    it._g = { name: adj + MAT[t] + 'の' + base + (it.p ? ' +' + it.p : '') + (tag ? '【' + tag + '】' : ''), slot: k.s, st: st, af: af, score: Math.round(score), mat: t, bi: it.k * 3 + k.b.indexOf(base) };
    return it._g;
  }

  // ===== 状態 =====
  var S, P, E, ac = 0, uid = 1, dirty = true, logs = [];
  function newState() { return { lv: 1, exp: 0, gold: 0, stage: 1, prog: 0, farm: false, spd: 1, auto: true, sell: 1, bag: [], eq: { w: null, h: null, b: null, f: null, a1: null, a2: null },
    rec: { drops: 0, kills: 0, max: 1, best: 0, seenB: {}, seenM: {} }, at: Date.now() }; }
  function say(t) { logs.push(t); if (logs.length > 40) logs.shift(); }
  function fmt(n) { n = Math.round(n); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(n); }
  function mkItem(s, k, l, r) { return { s: s, k: k, l: l, r: r, p: 0, x: 0, id: uid++ }; }

  // ===== プレイヤーの強さ =====
  function calc() {
    var b = { hp: 100 + 25 * S.lv, atk: 8 + 2.5 * S.lv, def: 2 + 1.2 * S.lv, spd: 0 }, a = {};
    AF.forEach(function (x) { a[x[0]] = 0; });
    Object.keys(S.eq).forEach(function (sl) {
      var it = S.eq[sl]; if (!it) return; var g = gen(it);
      b.hp += g.st.hp; b.atk += g.st.atk; b.def += g.st.def; b.spd += g.st.spd;
      g.af.forEach(function (x) { a[x.k] += x.v; });
    });
    P = { hp: Math.round(b.hp * (1 + a.hpP / 100)), atk: b.atk * (1 + a.atkP / 100), def: b.def * (1 + a.defP / 100), spd: b.spd + a.spd, a: a };
    P.crit = Math.min(90, 5 + a.crit); P.critd = 150 + a.critd; P.dodge = Math.min(60, a.dodge); P.block = Math.min(60, a.block);
    P.pierce = Math.min(80, a.pierce); P.dbl = Math.min(80, a.dbl); P.burst = Math.min(50, a.burst);
    if (S.php === undefined || S.php > P.hp) S.php = P.hp;
  }

  // ===== 敵・戦闘 =====
  function spawn() {
    var n = S.stage, boss = n % 10 === 0;
    E = { boss: boss, max: Math.round((20 + 9 * Math.pow(n, 1.45)) * (boss ? 5 : 1)), atk: (4 + 1.5 * Math.pow(n, 1.2)) * (boss ? 1.6 : 1), def: 1 + 1.5 * n };
    E.hp = E.max; E.name = (boss ? '👹 ボス' : '👾 てき') + ' ステージ' + n;
    S.shield = P.hp * P.a.shield / 100;
  }
  function strike() {
    var d = P.atk * (0.9 + Math.random() * 0.2), a = P.a;
    if (Math.random() * 100 < P.crit) d *= P.critd / 100;
    if (Math.random() * 100 < P.burst) d *= 3;
    if (E.hp < E.max * 0.3) d *= 1 + a.exec / 100;
    if (E.boss) d *= 1 + a.boss / 100;
    d = Math.max(1, d * 100 / (100 + E.def * (1 - P.pierce / 100)));
    E.hp -= d;
    if (a.ls) S.php = Math.min(P.hp, S.php + d * a.ls / 100);
    if (a.thorn) E.hp -= d * a.thorn / 400;
  }
  function tick() {
    if (!E) spawn();
    ac += 1 + P.spd / 100;
    while (ac >= 1 && E.hp > 0) { ac--; strike(); }
    if (E.hp > 0 && Math.random() * 100 < P.dbl) strike();
    if (E.hp <= 0) return kill(false);
    if (Math.random() * 100 >= P.dodge) {
      var d = E.atk * 100 / (100 + P.def) * (1 - P.block / 100);
      if (S.shield > 0) { var s = Math.min(S.shield, d); S.shield -= s; d -= s; }
      S.php -= Math.max(0, d);
    }
    S.php = Math.min(P.hp, S.php + P.a.regen / 2);
    if (S.php <= 0) { say('💀 やられた……ステージ' + Math.max(1, S.stage - 1) + 'まで戻って、体勢を立て直す'); S.stage = Math.max(1, S.stage - 1); S.prog = 0; S.php = P.hp; E = null; }
  }
  function kill(offline) {
    var n = S.stage, boss = n % 10 === 0, a = P.a;
    S.rec.kills++;
    S.gold += Math.round((4 + 3 * n) * (boss ? 5 : 1) * (1 + a.gold / 100));
    S.exp += Math.round((3 + 2.2 * n) * (boss ? 4 : 1) * (1 + a.exp / 100));
    var need;
    while (S.exp >= (need = Math.round(20 * Math.pow(S.lv, 1.4)))) { S.exp -= need; S.lv++; say('🎉 レベル' + S.lv + 'に上がった！'); calc(); S.php = P.hp; }
    if (boss || Math.random() < 0.3 * (1 + a.drop / 100)) drop(n, boss, a.drop);
    E = null;
    if (!offline) {
      S.prog++;
      if (S.prog >= (boss ? 1 : KILLS_PER_STAGE) && !S.farm) { S.stage++; S.prog = 0; if (S.stage > S.rec.max) S.rec.max = S.stage; }
      else if (S.prog >= KILLS_PER_STAGE) S.prog = 0;
    }
  }

  // ===== ドロップ・装備の管理 =====
  function rollRar(boss, luck) {
    var w = RW.map(function (x, i) { return i >= 2 ? x * (1 + luck / 100) * (boss ? 3 : 1) : x; }), t = w.reduce(function (s, x) { return s + x; }, 0), r = Math.random() * t, i = 0;
    while (i < 5 && r >= w[i]) { r -= w[i]; i++; }
    return i;
  }
  function slotOf(it) { return K[it.k].s; }
  function eqSlotsFor(sl) { return sl === 'a' ? ['a1', 'a2'] : [sl]; }
  function worst(sl) {   // その部位で、いちばん弱い（または空いている）装備の枠
    var ss = eqSlotsFor(sl), w = ss[0];
    ss.forEach(function (s) { if (!S.eq[s]) w = s; else if (S.eq[w] && gen(S.eq[s]).score < gen(S.eq[w]).score) w = s; });
    return S.eq[w] && gen(S.eq[w]).score < 0 ? w : w;
  }
  function sellValue(it) { return Math.round((5 + it.l * 2) * (it.r + 1) * (it.r + 1)); }
  function drop(n, boss, luck) {
    var r = rollRar(boss, luck), it = mkItem(Math.floor(Math.random() * 2147483647), rnd(K.length), Math.max(1, n + rnd(4) - 1), r), g = gen(it);
    S.rec.drops++; if (r > S.rec.best) S.rec.best = r;
    S.rec.seenB[g.bi] = 1; S.rec.seenM[g.mat] = 1;
    if (r >= 3) say('✨ ' + RAR[r] + '！ ' + g.name);
    var sl = slotOf(it), w = worst(sl), cur = S.eq[w];
    if (S.auto && (!cur || g.score > gen(cur).score)) {
      if (cur) S.bag.push(cur);
      S.eq[w] = it; calc(); dirty = true; if (r < 3) say('🛡️ 装備した：' + g.name); trim(); return;
    }
    if (r <= S.sell) { S.gold += sellValue(it); return; }
    S.bag.push(it); trim(); dirty = true;
  }
  function trim() {
    while (S.bag.length > BAG_MAX) {
      var low = null; S.bag.forEach(function (x) { if (!x.x && (!low || gen(x).score < gen(low).score)) low = x; });
      if (!low) return; S.bag.splice(S.bag.indexOf(low), 1); S.gold += sellValue(low);
    }
  }
  function best() {   // 部位ごとに、いちばん強い装備を着ける
    var pool = S.bag.concat(Object.keys(S.eq).map(function (k) { return S.eq[k]; }).filter(Boolean));
    var by = function (sl) { return pool.filter(function (x) { return slotOf(x) === sl; }).sort(function (a, b) { return gen(b).score - gen(a).score; }); };
    var eq = { w: null, h: null, b: null, f: null, a1: null, a2: null }, used = [];
    ['w', 'h', 'b', 'f'].forEach(function (sl) { var x = by(sl)[0]; if (x) { eq[sl] = x; used.push(x); } });
    var ac2 = by('a'); eq.a1 = ac2[0] || null; eq.a2 = ac2[1] || null; if (eq.a1) used.push(eq.a1); if (eq.a2) used.push(eq.a2);
    S.eq = eq; S.bag = pool.filter(function (x) { return used.indexOf(x) < 0; }); calc(); dirty = true;
  }
  function find(id) { for (var i = 0; i < S.bag.length; i++) if (S.bag[i].id === id) return S.bag[i]; return null; }
  function equip(it) {
    var sl = slotOf(it), w = worst(sl), cur = S.eq[w];
    S.bag.splice(S.bag.indexOf(it), 1); if (cur) S.bag.push(cur); S.eq[w] = it; calc(); dirty = true;
  }
  function enhCost(it) { return Math.round(30 * Math.pow(1.7, it.p) * (it.l / 10 + 1) * (it.r + 1)); }
  function enhance(it) {
    if (it.p >= 10 || S.gold < enhCost(it)) return;
    S.gold -= enhCost(it); it.p++; it._g = null; calc(); dirty = true;
  }

  // ===== 保存・おるすばん =====
  function pack(it) { return [it.s, it.k, it.l, it.r, it.p, it.x]; }
  function unpack(a) { return { s: a[0], k: a[1], l: a[2], r: a[3], p: a[4] || 0, x: a[5] || 0, id: uid++ }; }
  function save() {
    try {
      var o = JSON.parse(JSON.stringify(S, function (k, v) { return (k === 'bag' || k === 'eq' || k === 'php' || k === 'shield') ? undefined : v; }));
      o.bag = S.bag.map(pack); o.eq = {}; Object.keys(S.eq).forEach(function (k) { o.eq[k] = S.eq[k] ? pack(S.eq[k]) : null; }); o.php = S.php; o.at = Date.now();
      localStorage.setItem(SAVE, JSON.stringify(o));
    } catch (e) {}
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(SAVE)); if (!o || !o.bag) return newState();
      var s = Object.assign(newState(), o); s.bag = o.bag.map(unpack);
      s.eq = { w: null, h: null, b: null, f: null, a1: null, a2: null }; Object.keys(o.eq || {}).forEach(function (k) { if (o.eq[k]) s.eq[k] = unpack(o.eq[k]); });
      return s;
    } catch (e) { return newState(); }
  }
  function offline() {
    var dt = Math.min((Date.now() - S.at) / 1000, OFFLINE_MAX); if (dt < 60) return;
    var n = Math.min(4000, Math.floor(dt / 4)), g0 = S.gold, l0 = S.lv, d0 = S.rec.drops;
    for (var i = 0; i < n; i++) kill(true);
    say('🌙 おるすばん ' + Math.round(dt / 60) + '分：' + n + '匹倒して、装備を' + (S.rec.drops - d0) + '個拾った！（💰+' + fmt(S.gold - g0) + (S.lv > l0 ? '・Lv+' + (S.lv - l0) : '') + '）');
  }

  // ===== 画面 =====
  function statLine(g) {
    var p = []; if (g.st.atk) p.push('こうげき+' + g.st.atk); if (g.st.def) p.push('ぼうぎょ+' + g.st.def); if (g.st.hp) p.push('HP+' + g.st.hp); if (g.st.spd) p.push('すばやさ+' + g.st.spd);
    return p.join(' ') + (g.af.length ? '<br>' + g.af.map(function (a) { return a.n + ' ' + a.u + '+' + a.v + '%'; }).join(' / ') : '');
  }
  function itemHtml(it, eqSlot) {
    var g = gen(it), cmp = '';
    if (!eqSlot) { var cur = S.eq[worst(slotOf(it))]; var d = g.score - (cur ? gen(cur).score : 0); cmp = d >= 0 ? '<span class="up">▲+' + d + '</span>' : '<span class="down">▼' + d + '</span>'; }
    var a = eqSlot ? 'data-s="' + eqSlot + '"' : 'data-i="' + it.id + '"';
    return '<div class="it r' + it.r + '"><b>[' + RAR[it.r] + '] ' + g.name + (it.x ? ' 🔒' : '') + '</b><small>強さ ' + g.score + ' ' + cmp + '｜Lv' + it.l + '｜' + statLine(g) + '</small><div class="acts">' +
      (eqSlot ? '' : '<button class="b mini" ' + a + ' data-a="eq" type="button">装備</button><button class="b mini sub" ' + a + ' data-a="sell" type="button">売る 💰' + fmt(sellValue(it)) + '</button>') +
      '<button class="b mini sub" ' + a + ' data-a="enh" type="button"' + (it.p >= 10 || S.gold < enhCost(it) ? ' disabled' : '') + '>強化 💰' + fmt(enhCost(it)) + '</button>' +
      (eqSlot ? '' : '<button class="b mini sub" ' + a + ' data-a="lock" type="button">' + (it.x ? '🔓' : '🔒') + '</button>') + '</div></div>';
  }
  function renderStatic() {
    var eq = $('eq'), h = '';
    SLOTS.forEach(function (sl) { var it = S.eq[sl[0]]; h += '<div style="margin-top:4px"><small class="lead">' + sl[1] + '</small>' + (it ? itemHtml(it, sl[0]) : '<div class="it r0"><b>（なし）</b></div>') + '</div>'; });
    eq.innerHTML = h;
    var f = $('fslot').value, so = $('fsort').value, list = S.bag.filter(function (x) { return !f || slotOf(x) === f; });
    list.sort(function (a, b) { return so === 'r' ? (b.r - a.r) || (gen(b).score - gen(a).score) : so === 'n' ? b.id - a.id : gen(b).score - gen(a).score; });
    $('bag').innerHTML = list.slice(0, 40).map(function (x) { return itemHtml(x); }).join('') + (list.length > 40 ? '<p class="lead" style="margin-top:6px">ほか ' + (list.length - 40) + '個（並び順や、部位の絞り込みで見られるよ）</p>' : '');
    $('bagn').textContent = '（' + S.bag.length + ' / ' + BAG_MAX + '）';
    var r = S.rec;
    $('rec').innerHTML = '拾った装備：' + fmt(r.drops) + '個／倒した数：' + fmt(r.kills) + '匹／最高ステージ：' + r.max + '／最高レア：' + RAR[r.best] +
      '<br>図鑑：ベース ' + Object.keys(r.seenB).length + '/' + K.length * 3 + '・素材 ' + Object.keys(r.seenM).length + '/' + MAT.length +
      '<br>装備のパターン数：約 ' + fmt(MAT.length * ADJ.length * K.length * 3 * Math.pow(AF.length, 2)) + ' 通り以上';
    $('farm').textContent = S.farm ? '🔁 周回中（タップで進む）' : '⏩ 進行中（タップで周回）';
    $('farm').className = 'b sub' + (S.farm ? ' on' : '');
    $('spd').textContent = '速さ ×' + S.spd;
    $('auto').textContent = S.auto ? '⚡ 自動装備ON' : '自動装備OFF';
    $('auto').className = 'b sub' + (S.auto ? ' on' : '');
    dirty = false;
  }
  function renderLive() {
    var need = Math.round(20 * Math.pow(S.lv, 1.4));
    $('lv').textContent = 'Lv' + S.lv + '（EXP ' + fmt(S.exp) + '/' + fmt(need) + '）'; $('gold').textContent = '💰 ' + fmt(S.gold);
    $('expbar').style.width = Math.min(100, S.exp / need * 100) + '%';
    $('stage').textContent = '📍 ステージ ' + S.stage + (S.stage % 10 === 0 ? '（ボス）' : ''); $('kills').textContent = '撃破 ' + S.prog + '/' + (S.stage % 10 === 0 ? 1 : KILLS_PER_STAGE);
    if (E) { $('ename').textContent = E.name; $('ehp').textContent = fmt(Math.max(0, E.hp)) + '/' + fmt(E.max); $('ebar').style.width = Math.max(0, E.hp / E.max * 100) + '%'; }
    $('php').textContent = fmt(Math.max(0, S.php)) + '/' + fmt(P.hp); $('pbar').style.width = Math.max(0, S.php / P.hp * 100) + '%';
    $('pst').textContent = 'ATK ' + fmt(P.atk) + '　DEF ' + fmt(P.def) + '　SPD +' + fmt(P.spd) + '　会心 ' + P.crit.toFixed(0) + '%';
    $('log').textContent = logs.slice(-8).join('\\n') || 'ここに、できごとが出るよ。';
  }

  // ===== 操作 =====
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-a]') : null; if (!el) return;
    var a = el.getAttribute('data-a'), it = el.getAttribute('data-i') ? find(+el.getAttribute('data-i')) : S.eq[el.getAttribute('data-s')];
    if (!it) return;
    if (a === 'eq') equip(it); else if (a === 'sell') { S.gold += sellValue(it); S.bag.splice(S.bag.indexOf(it), 1); dirty = true; }
    else if (a === 'enh') enhance(it); else if (a === 'lock') { it.x = it.x ? 0 : 1; dirty = true; }
    save();
  });
  $('farm').onclick = function () { S.farm = !S.farm; dirty = true; };
  $('spd').onclick = function () { S.spd = S.spd >= 4 ? 1 : S.spd * 2; dirty = true; };
  $('auto').onclick = function () { S.auto = !S.auto; dirty = true; };
  $('best').onclick = function () { best(); say('⚡ ベスト装備にした！'); save(); };
  $('sellall').onclick = function () {
    var g = 0, n = 0; S.bag = S.bag.filter(function (x) { if (!x.x && x.r <= S.sell) { g += sellValue(x); n++; return false; } return true; });
    S.gold += g; say('💰 ' + n + '個を売って、' + fmt(g) + 'ゴールドになった'); dirty = true; save();
  };
  $('fslot').onchange = $('fsort').onchange = function () { dirty = true; };
  $('fsell').innerHTML = RAR.map(function (r, i) { return '<option value="' + i + '">' + (i === 0 ? 'コモンだけ自動売却' : r + '以下を自動売却') + '</option>'; }).join('');
  $('fsell').onchange = function () { S.sell = +$('fsell').value; };
  $('reset').onclick = function () { if (confirm('最初からやり直すよ。集めた装備も消えるけど、いいかな？')) { S = newState(); logs = []; E = null; calc(); dirty = true; save(); } };

  // ===== 起動 =====
  S = load(); calc(); $('fsell').value = S.sell; offline(); calc();
  setInterval(function () { for (var i = 0; i < S.spd; i++) tick(); if (dirty) renderStatic(); renderLive(); }, TICK);
  setInterval(save, 5000); window.addEventListener('beforeunload', save);
  renderStatic(); renderLive();
})();
</script>
</body>
</html>

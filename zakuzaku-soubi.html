<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>雑にダンジョンに行くやつ</title>
<style>
  :root { --bg:#1f1f23; --card:#2b2b31; --card2:#36363d; --ink:#ece6e0; --soft:#a9a39e; --line:#46464e; --orange:#ffb27a; --on:#3d2e24; --mint:#8fd9b0; --red:#f87171; --sky:#cfe3f5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--bg); -webkit-tap-highlight-color: transparent;
         padding: calc(10px + env(safe-area-inset-top, 0px)) 10px calc(16px + env(safe-area-inset-bottom, 0px)); }
  #app { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 17px; color: #ffbf93; }
  header div { display: flex; gap: 6px; }
  header button, header a { font: inherit; font-size: 12px; color: var(--ink); background: var(--card2); border: 2px solid var(--line); border-radius: 99px; padding: 2px 12px; text-decoration: none; cursor: pointer; touch-action: manipulation; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .card h2 { font-size: 15px; color: var(--orange); margin-bottom: 6px; }
  .bar { height: 8px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 3px 0 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--mint); transition: width .12s; }
  .bar.x i { background: #7aa8ff; }
  .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  #log { white-space: pre-wrap; font-size: 12.5px; min-height: 6.2em; color: var(--soft); }
  .grid { display: grid; gap: 6px; } .g2 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); }
  button.b, select { font: inherit; font-weight: 700; min-height: 38px; padding: 4px 8px; border-radius: 12px; border: 2px solid #c4824f; background: var(--orange); color: var(--on); cursor: pointer; touch-action: manipulation; user-select: none; }
  button.b:disabled { opacity: 0.4; cursor: default; }
  button.b.sub { background: var(--card2); color: var(--ink); border-color: var(--line); font-weight: 500; font-size: 12.5px; }
  button.b.on { background: var(--mint); border-color: #5ba884; color: #193326; font-weight: 700; }
  button.b.mini { min-height: 30px; font-size: 12px; padding: 2px 8px; }
  select { background: #232327; color: var(--ink); border-color: var(--line); font-weight: 500; font-size: 13px; width: 100%; }

  /* 小さなダンジョンマップ表示 */
  .explore-wrap { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 6px; flex-wrap: wrap; }
  #map { display: grid; grid-template-columns: repeat(11, 24px); grid-template-rows: repeat(7, 24px); gap: 1px; background: #141418; border: 2px solid var(--line); border-radius: 10px; padding: 3px; width: fit-content; margin: 0 auto; cursor: pointer; touch-action: manipulation; }
  .cell { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 3px; user-select: none; }
  .c-dark { background: #141418; }
  .c-wall { background: #3b3b45; }
  .c-wall.dim { background: #26262d; }
  .c-floor { background: #25252c; }
  .c-floor.dim { background: #1c1c22; opacity: 0.65; }
  .c-me { background: #4a3828; box-shadow: inset 0 0 0 1.5px var(--orange); }

  /* 操作パッド */
  .pad-area { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 155px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 40px); gap: 4px; justify-content: center; }
  .dpad button { min-height: 40px; padding: 0; font-size: 16px; border-radius: 10px; }
  .dpad .wait { font-size: 11px; background: var(--card2); color: var(--ink); border-color: var(--line); }

  .it { border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; margin-top: 6px; background: var(--card2); }
  .it b { display: block; font-size: 13px; word-break: break-all; }
  .it small { display: block; color: var(--soft); font-size: 11.5px; }
  .it .acts { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .up { color: var(--mint); } .down { color: var(--red); }
  .r0 { border-left: 5px solid #b8b8b8; } .r1 { border-left: 5px solid #6ee7a0; } .r2 { border-left: 5px solid #60a5fa; }
  .r3 { border-left: 5px solid #c084fc; } .r4 { border-left: 5px solid #fb923c; } .r5 { border-left: 5px solid #f43f5e; }
  .lead { font-size: 12.5px; color: var(--soft); }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🧭 雑にダンジョンに行くやつ</h1>
    <div><button id="reset" type="button">🔄 最初から</button><a href="./index.html">🏠</a></div>
  </header>

  <div class="card">
    <div class="row"><span id="lv"></span><span id="gold"></span></div>
    <div class="bar x"><i id="expbar"></i></div>
    <div class="row"><span id="floor"></span><span id="remain"></span></div>
    <div class="row"><span>あなた <small id="shd" style="color:#7aa8ff"></small></span><span id="php"></span></div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="row" id="pst" style="color:var(--sky)"></div>

    <div class="explore-wrap">
      <div id="map" title="行きたい方向をタップして移動"></div>
      <div class="pad-area">
        <div class="dpad">
          <div></div><button class="b sub" data-dir="0,-1" type="button">▲</button><div></div>
          <button class="b sub" data-dir="-1,0" type="button">◀</button><button class="b wait" id="wait" type="button">待機</button><button class="b sub" data-dir="1,0" type="button">▶</button>
          <div></div><button class="b sub" data-dir="0,1" type="button">▼</button><div></div>
        </div>
        <button class="b on" id="stairs" type="button" style="display:none">🪜 次の階へ降りる</button>
        <div class="grid g2">
          <button class="b sub mini" id="auto" type="button"></button>
          <button class="b sub mini" id="town" type="button">⛺ 帰還回復</button>
        </div>
      </div>
    </div>
  </div>

  <div id="log" class="card" role="log" aria-live="polite"></div>

  <div class="card"><h2>🛡️ いまの装備</h2><div id="eq"></div></div>

  <div class="card">
    <h2>🎒 バッグ <span id="bagn" style="font-size:12px;color:var(--soft)"></span></h2>
    <div class="grid g3">
      <select id="fslot" aria-label="部位"><option value="">ぜんぶの部位</option><option value="w">武器</option><option value="h">頭</option><option value="b">体</option><option value="f">足</option><option value="a">アクセサリー</option></select>
      <select id="fsort" aria-label="並び順"><option value="s">強さ順</option><option value="r">レア度順</option><option value="n">新しい順</option></select>
      <select id="fsell" aria-label="自動で売る"></select>
    </div>
    <div class="grid g2" style="margin-top:6px"><button class="b" id="best" type="button">⚡ ベスト装備にする</button><button class="b sub" id="sellall" type="button">💰 ロックなしの低レアを売る</button></div>
    <div id="bag"></div>
  </div>

  <div class="card"><h2>📖 記録</h2><div id="rec" class="lead"></div></div>
  <p class="lead" style="text-align:center">矢印キー / WASD / 十字ボタン / マップタップで移動。敵にぶつかると攻撃、階段（🪜）の上で次の階層へ進めるよ。</p>
</div>

<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var SAVE = 'zakuzaku_dungeon_v1';

  // ===== データ =====
  var RAR = ['コモン', 'アンコモン', 'レア', 'エピック', 'レジェンド', 'ミシック'];
  var RM = [1, 1.15, 1.35, 1.6, 2, 2.6];
  var RW = [58, 25, 11, 4, 1.6, 0.4];
  var MAT = ['ぼろ', '木', '石', '骨', '革', '銅', '鉄', '青銅', '鋼', '銀', '金', '白銀', '水晶', '翡翠', '紅玉', '蒼玉', '黒鉄', 'ミスリル', 'オリハルコン', '竜骨', '竜鱗', '星屑', '月光', '日輪', '雷鳴', '氷河', '炎獄', '深海', '天空', '虚空', '幻獣', '神木', '神鉄', '時渡り', '世界樹', '創世'];
  var ADJ = ['輝く', '燃える', '凍てつく', '古びた', '呪われた', '祝福の', '荒ぶる', '静かな', '歌う', '眠る', '飢えた', '気高い', '狂気の', '忘れられた', '伝説の', '禁じられた', '夜明けの', '黄昏の', '嵐の', '秘められた',
             'しょーもない', 'ありがたい', 'ぬるぬるの', 'きらきらの', 'ふわふわの', 'ごつい', 'とがった', 'まるい', 'おかしな', '最強の', '泣き虫の', '怒りの', '笑う', 'こっそり', '堂々たる', 'ぴかぴかの', 'どっしりした', '軽やかな', '真夜中の', '朝焼けの'];
  var K = [
    { s: 'w', n: '剣',   b: ['ブロードソード', 'サーベル', 'ロングソード'], m: { atk: 1 } },
    { s: 'w', n: '槍',   b: ['スピア', 'ハルバード', 'ランス'], m: { atk: 1.05 } },
    { s: 'w', n: '斧',   b: ['バトルアックス', 'ハチェット', '大斧'], m: { atk: 1.25 } },
    { s: 'w', n: '弓',   b: ['ショートボウ', 'ロングボウ', 'クロスボウ'], m: { atk: 0.95, spd: 0.3 } },
    { s: 'w', n: '杖',   b: ['ワンド', 'スタッフ', 'ロッド'], m: { atk: 1.1 } },
    { s: 'w', n: '短剣', b: ['ダガー', 'ナイフ', 'クナイ'], m: { atk: 0.8, spd: 1 } },
    { s: 'w', n: '鞭',   b: ['ウィップ', 'ロープ', 'ムチ'], m: { atk: 0.9, spd: 0.8 } },
    { s: 'w', n: '槌',   b: ['ハンマー', 'メイス', 'モール'], m: { atk: 1.15, hp: 1 } },
    { s: 'w', n: '刀',   b: ['カタナ', 'ナタ', '太刀'], m: { atk: 1.1 } },
    { s: 'w', n: '鎌',   b: ['サイズ', 'カマ', 'デスサイズ'], m: { atk: 1.1, spd: 0.3 } },
    { s: 'h', n: '兜',   b: ['かぶと', 'ヘルム', 'ずきん'], m: { def: 0.6, hp: 2 } },
    { s: 'b', n: '鎧',   b: ['よろい', 'ローブ', 'ベスト'], m: { def: 1, hp: 4 } },
    { s: 'f', n: '靴',   b: ['ブーツ', 'グリーブ', 'わらじ'], m: { def: 0.5, spd: 0.6, hp: 1 } },
    { s: 'a', n: '指輪', b: ['リング', 'ゆびわ', '印章'], m: { atk: 0.5 } },
    { s: 'a', n: '首飾り', b: ['ネックレス', 'ペンダント', '数珠'], m: { hp: 3 } },
    { s: 'a', n: '腕輪', b: ['ブレスレット', 'バングル', '手甲'], m: { def: 0.5, hp: 1 } },
    { s: 'a', n: '耳飾り', b: ['イヤリング', 'ピアス', '耳飾り'], m: { spd: 0.6, atk: 0.3 } },
    { s: 'a', n: 'お守り', b: ['タリスマン', 'お守り', '札'], m: { hp: 2, def: 0.3 } },
    { s: 'a', n: 'マント', b: ['マント', 'ケープ', '羽織'], m: { def: 0.4, spd: 0.4, hp: 1 } }
  ];
  var AF = [
    ['hpP', '生命', 6, 1.0, 'HP'], ['atkP', '破壊', 6, 1.4, 'こうげき'], ['defP', '守護', 6, 1.0, 'ぼうぎょ'], ['spd', '疾風', 6, 1.0, 'すばやさ'],
    ['crit', '会心', 4, 1.2, '会心率'], ['critd', '猛撃', 10, 0.6, '会心ダメージ'], ['ls', '吸血', 3, 2.0, '吸収'], ['regen', '再生', 2, 0.8, '歩数HP回復'],
    ['thorn', '反撃', 8, 0.5, '反撃'], ['dodge', '回避', 3, 1.2, '回避率'], ['gold', '黄金', 12, 0.3, 'ゴールド'], ['exp', '賢者', 12, 0.3, '経験値'],
    ['drop', '幸運', 8, 0.7, 'レア率'], ['dbl', '二連', 4, 1.2, '2回攻撃'], ['pierce', '貫通', 6, 0.8, '防御無視'], ['block', '堅牢', 3, 1.2, 'ダメージ軽減'],
    ['burst', '爆裂', 3, 1.2, '大ダメージ率'], ['exec', '処刑', 12, 0.5, '瀕死の敵に追加'], ['boss', '竜殺し', 12, 0.5, 'ボスに追加'], ['shield', '結界', 8, 0.8, '階層バリア']
  ];
  var SLOTS = [['w', '武器'], ['h', '頭'], ['b', '体'], ['f', '足'], ['a1', 'アクセ1'], ['a2', 'アクセ2']];
  var BAG_MAX = 300, MAP_W = 19, MAP_H = 15, VIEW_W = 11, VIEW_H = 7;

  // ===== 乱数・装備の生成 =====
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rnd = function (n) { return Math.floor(Math.random() * n); };

  function gen(it) {
    if (it._g) return it._g;
    var r = mulberry(it.s), k = K[it.k], t = Math.max(0, Math.min(MAT.length - 1, Math.floor(it.l / 3) + Math.floor(r() * 3) - 1));
    var base = k.b[Math.floor(r() * 3)], adj = it.r > 0 ? ADJ[Math.floor(r() * ADJ.length)] : '';
    var ids = [], i;
    while (ids.length < it.r) { i = Math.floor(r() * AF.length); if (ids.indexOf(i) < 0) ids.push(i); }
    var V = (3 + it.l * 1.6) * RM[it.r] * (1 + 0.08 * it.p), st = { atk: 0, def: 0, hp: 0, spd: 0 }, m = k.m;
    st.atk = Math.round(V * (m.atk || 0)); st.def = Math.round(V * 0.7 * (m.def || 0)); st.hp = Math.round(V * 4 * (m.hp || 0)); st.spd = Math.round(V * 0.12 * (m.spd || 0));
    var af = ids.map(function (j) { var a = AF[j]; return { k: a[0], n: a[1], u: a[4], w: a[3], v: Math.round(a[2] * (0.7 + 0.6 * r()) * (1 + it.l / 45) * (1 + 0.1 * it.r) * 10) / 10 }; });
    var score = st.atk * 2 + st.def * 2 + st.hp / 4 + st.spd * 2 + af.reduce(function (s, a) { return s + a.v * a.w * 3; }, 0);
    var tag = af.slice(0, 2).map(function (a) { return a.n; }).join('・');
    it._g = { name: adj + MAT[t] + 'の' + base + (it.p ? ' +' + it.p : '') + (tag ? '【' + tag + '】' : ''), slot: k.s, st: st, af: af, score: Math.round(score), mat: t, bi: it.k * 3 + k.b.indexOf(base) };
    return it._g;
  }

  // ===== 状態・ダンジョンデータ =====
  var S, P, D, uid = 1, dirty = true, logs = [];
  function newState() {
    return { lv: 1, exp: 0, gold: 0, floor: 1, auto: true, sell: 0, bag: [], eq: { w: null, h: null, b: null, f: null, a1: null, a2: null },
      rec: { drops: 0, kills: 0, max: 1, best: 0, steps: 0, seenB: {}, seenM: {} } };
  }
  function say(t) { logs.push(t); if (logs.length > 40) logs.shift(); }
  function fmt(n) { n = Math.round(n); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(n); }
  function mkItem(s, k, l, r) { return { s: s, k: k, l: l, r: r, p: 0, x: 0, id: uid++ }; }

  // ===== プレイヤー能力計算 =====
  function calc() {
    var b = { hp: 100 + 25 * S.lv, atk: 10 + 2.6 * S.lv, def: 2 + 1.2 * S.lv, spd: 0 }, a = {};
    AF.forEach(function (x) { a[x[0]] = 0; });
    Object.keys(S.eq).forEach(function (sl) {
      var it = S.eq[sl]; if (!it) return; var g = gen(it);
      b.hp += g.st.hp; b.atk += g.st.atk; b.def += g.st.def; b.spd += g.st.spd;
      g.af.forEach(function (x) { a[x.k] += x.v; });
    });
    P = { hp: Math.round(b.hp * (1 + a.hpP / 100)), atk: b.atk * (1 + a.atkP / 100), def: b.def * (1 + a.defP / 100), spd: b.spd + a.spd, a: a };
    P.crit = Math.min(90, 5 + a.crit); P.critd = 150 + a.critd; P.dodge = Math.min(60, a.dodge); P.block = Math.min(60, a.block);
    P.pierce = Math.min(80, a.pierce); P.dbl = Math.min(80, a.dbl); P.burst = Math.min(50, a.burst);
    if (S.php === undefined || S.php > P.hp) S.php = P.hp;
  }

  // ===== ダンジョン自動生成 =====
  function buildFloor(fl) {
    var grid = [], seen = [], rooms = [], x, y, i;
    for (y = 0; y < MAP_H; y++) { grid[y] = []; seen[y] = []; for (x = 0; x < MAP_W; x++) { grid[y][x] = 1; seen[y][x] = 0; } }

    for (i = 0; i < 24 && rooms.length < 5; i++) {
      var rw = 3 + rnd(3), rh = 3 + rnd(2), rx = 1 + rnd(MAP_W - rw - 2), ry = 1 + rnd(MAP_H - rh - 2);
      var ok = true;
      rooms.forEach(function (r) { if (rx <= r.x + r.w && rx + rw >= r.x && ry <= r.y + r.h && ry + rh >= r.y) ok = false; });
      if (!ok) continue;
      rooms.push({ x: rx, y: ry, w: rw, h: rh, cx: Math.floor(rx + rw / 2), cy: Math.floor(ry + rh / 2) });
      for (y = ry; y < ry + rh; y++) for (x = rx; x < rx + rw; x++) grid[y][x] = 0;
    }
    if (rooms.length < 2) return buildFloor(fl);

    for (i = 1; i < rooms.length; i++) {
      var a = rooms[i - 1], b = rooms[i], cx = a.cx, cy = a.cy;
      while (cx !== b.cx) { grid[cy][cx] = 0; cx += cx < b.cx ? 1 : -1; }
      while (cy !== b.cy) { grid[cy][cx] = 0; cy += cy < b.cy ? 1 : -1; }
      grid[cy][cx] = 0;
    }

    var start = rooms[0], end = rooms[rooms.length - 1];
    var mobs = [], objs = [];
    var isBossFloor = fl % 5 === 0;

    // 階段配置
    objs.push({ x: end.cx, y: end.cy, t: 'stairs' });

    // ボス階は階段付近にボス配置
    if (isBossFloor) {
      var bx = end.cx > end.x ? end.cx - 1 : end.cx + 1;
      mobs.push(mkMob(bx, end.cy, fl, true));
    }

    // 雑魚・宝箱・泉を空き床に配置
    var free = [];
    for (y = 1; y < MAP_H - 1; y++) for (x = 1; x < MAP_W - 1; x++) {
      if (grid[y][x] === 0 && !(x === start.cx && y === start.cy) && !(x === end.cx && y === end.cy) && !mobs.some(function (m) { return m.x === x && m.y === y; })) {
        free.push({ x: x, y: y });
      }
    }
    free.sort(function () { return Math.random() - 0.5; });

    var mobCount = Math.min(free.length, 4 + Math.floor(fl / 6));
    for (i = 0; i < mobCount; i++) { var p = free.pop(); mobs.push(mkMob(p.x, p.y, fl, false)); }

    var chestCount = Math.min(free.length, 1 + rnd(3));
    for (i = 0; i < chestCount; i++) { var c = free.pop(); objs.push({ x: c.x, y: c.y, t: 'chest' }); }

    if (free.length && Math.random() < 0.55) { var f = free.pop(); objs.push({ x: f.x, y: f.y, t: 'fountain' }); }

    D = { grid: grid, seen: seen, px: start.cx, py: start.cy, mobs: mobs, objs: objs };
    S.shield = Math.round(P.hp * P.a.shield / 100);
    reveal();
  }

  function mkMob(x, y, fl, boss) {
    var max = Math.round((22 + 9 * Math.pow(fl, 1.4)) * (boss ? 3.5 : 1));
    return { x: x, y: y, boss: boss, hp: max, max: max, atk: (4 + 1.5 * Math.pow(fl, 1.2)) * (boss ? 1.5 : 1), def: 1 + 1.4 * fl, name: boss ? '👹 階層ボス' : '👾 魔物' };
  }

  function reveal() {
    for (var dy = -3; dy <= 3; dy++) for (var dx = -3; dx <= 3; dx++) {
      if (dx * dx + dy * dy <= 11) {
        var nx = D.px + dx, ny = D.py + dy;
        if (nx >= 0 && nx < MAP_W && ny >= 0 && ny < MAP_H) D.seen[ny][nx] = 1;
      }
    }
  }

  // ===== ターン行動・戦闘 =====
  function mobAt(x, y) { for (var i = 0; i < D.mobs.length; i++) if (D.mobs[i].x === x && D.mobs[i].y === y) return D.mobs[i]; return null; }
  function objAt(x, y) { for (var i = 0; i < D.objs.length; i++) if (D.objs[i].x === x && D.objs[i].y === y) return D.objs[i]; return null; }

  function strike(m) {
    var hits = 1 + (Math.random() * 100 < P.dbl ? 1 : 0) + (Math.random() * 100 < P.spd / 2 ? 1 : 0);
    var total = 0, critHit = false;
    for (var h = 0; h < hits && m.hp > 0; h++) {
      var d = P.atk * (0.9 + Math.random() * 0.2), a = P.a;
      if (Math.random() * 100 < P.crit) { d *= P.critd / 100; critHit = true; }
      if (Math.random() * 100 < P.burst) d *= 3;
      if (m.hp < m.max * 0.3) d *= 1 + a.exec / 100;
      if (m.boss) d *= 1 + a.boss / 100;
      d = Math.max(1, Math.round(d * 100 / (100 + m.def * (1 - P.pierce / 100))));
      m.hp -= d; total += d;
      if (a.ls) S.php = Math.min(P.hp, S.php + Math.ceil(d * a.ls / 100));
    }
    say('⚔️ ' + m.name + 'に ' + fmt(total) + ' ダメージ' + (critHit ? '（会心！）' : '') + (hits > 1 ? ' ×' + hits + '連撃' : ''));
    if (m.hp <= 0) {
      D.mobs.splice(D.mobs.indexOf(m), 1);
      killMob(m.boss);
    }
  }

  function killMob(boss) {
    var fl = S.floor, a = P.a;
    S.rec.kills++;
    var g = Math.round((6 + 3.5 * fl) * (boss ? 5 : 1) * (1 + a.gold / 100));
    var e = Math.round((4 + 2.5 * fl) * (boss ? 4 : 1) * (1 + a.exp / 100));
    S.gold += g; S.exp += e;
    say('💥 倒した！（💰+' + fmt(g) + ' / EXP+' + fmt(e) + '）');
    var need;
    while (S.exp >= (need = Math.round(20 * Math.pow(S.lv, 1.4)))) {
      S.exp -= need; S.lv++; say('🎉 レベル' + S.lv + 'に上がった！HP全快！'); calc(); S.php = P.hp;
    }
    if (boss || Math.random() < 0.45 * (1 + a.drop / 100)) dropItem(fl, boss);
    dirty = true;
  }

  function step(dx, dy) {
    if (dx === 0 && dy === 0) {
      // 待機（少し自然回復）
      var heal = Math.max(1, Math.round(P.hp * 0.03 + P.a.regen));
      S.php = Math.min(P.hp, S.php + heal);
      say('⏳ 様子を見た（HP +' + heal + '）');
      enemyTurn();
      renderLive(); save();
      return;
    }
    var nx = D.px + dx, ny = D.py + dy;
    if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H || D.grid[ny][nx] === 1) return;

    var m = mobAt(nx, ny);
    if (m) {
      strike(m);
    } else {
      D.px = nx; D.py = ny;
      S.rec.steps++;
      if (P.a.regen > 0) S.php = Math.min(P.hp, S.php + Math.ceil(P.a.regen));
      reveal();
      var o = objAt(nx, ny);
      if (o && o.t === 'chest') {
        D.objs.splice(D.objs.indexOf(o), 1);
        say('📦 宝箱を開けた！');
        dropItem(S.floor, Math.random() < 0.25);
        S.gold += Math.round((10 + S.floor * 5) * (1 + P.a.gold / 100));
        dirty = true;
      } else if (o && o.t === 'fountain') {
        D.objs.splice(D.objs.indexOf(o), 1);
        var rec = Math.round(P.hp * 0.5);
        S.php = Math.min(P.hp, S.php + rec);
        say('⛲ 癒やしの泉を飲んだ！HPが ' + fmt(rec) + ' 回復した');
      } else if (o && o.t === 'stairs') {
        say('🪜 下り階段を見つけた！');
      }
    }
    enemyTurn();
    renderLive(); save();
  }

  function enemyTurn() {
    for (var i = 0; i < D.mobs.length; i++) {
      var m = D.mobs[i], dist = Math.abs(m.x - D.px) + Math.abs(m.y - D.py);
      if (dist === 1) {
        if (Math.random() * 100 < P.dodge) {
          say('💨 ' + m.name + 'の攻撃を回避！');
        } else {
          var d = Math.max(1, Math.round(m.atk * 100 / (100 + P.def) * (1 - P.block / 100)));
          if (S.shield > 0) { var s = Math.min(S.shield, d); S.shield -= s; d -= s; }
          S.php -= d;
          say('💢 ' + m.name + 'から ' + fmt(d) + ' ダメージ！');
          if (P.a.thorn > 0 && d > 0) {
            var th = Math.max(1, Math.round(d * P.a.thorn / 100));
            m.hp -= th;
            if (m.hp <= 0) { D.mobs.splice(i, 1); i--; killMob(m.boss); continue; }
          }
          if (S.php <= 0) {
            S.floor = Math.max(1, S.floor - 1);
            S.php = P.hp;
            say('💀 力尽きた……地下' + S.floor + '階まで押し戻された');
            buildFloor(S.floor);
            dirty = true;
            return;
          }
        }
      } else if (dist <= 4) {
        var sx = m.x + Math.sign(D.px - m.x), sy = m.y + Math.sign(D.py - m.y);
        if (sx !== m.x && D.grid[m.y][sx] === 0 && !mobAt(sx, m.y) && !(sx === D.px && m.y === D.py)) m.x = sx;
        else if (sy !== m.y && D.grid[sy][m.x] === 0 && !mobAt(m.x, sy) && !(m.x === D.px && sy === D.py)) m.y = sy;
      }
    }
  }

  // ===== ドロップ・装備管理 =====
  function rollRar(boss, luck) {
    var w = RW.map(function (x, i) { return i >= 2 ? x * (1 + luck / 100) * (boss ? 3 : 1) : x; }), t = w.reduce(function (s, x) { return s + x; }, 0), r = Math.random() * t, i = 0;
    while (i < 5 && r >= w[i]) { r -= w[i]; i++; }
    return i;
  }
  function slotOf(it) { return K[it.k].s; }
  function eqSlotsFor(sl) { return sl === 'a' ? ['a1', 'a2'] : [sl]; }
  function worst(sl) {
    var ss = eqSlotsFor(sl), w = ss[0];
    ss.forEach(function (s) { if (!S.eq[s]) w = s; else if (S.eq[w] && gen(S.eq[s]).score < gen(S.eq[w]).score) w = s; });
    return w;
  }
  function sellValue(it) { return Math.round((5 + it.l * 2) * (it.r + 1) * (it.r + 1)); }
  function dropItem(fl, boss) {
    var r = rollRar(boss, P.a.drop), it = mkItem(Math.floor(Math.random() * 2147483647), rnd(K.length), Math.max(1, fl + rnd(3)), r), g = gen(it);
    S.rec.drops++; if (r > S.rec.best) S.rec.best = r;
    S.rec.seenB[g.bi] = 1; S.rec.seenM[g.mat] = 1;
    var sl = slotOf(it), w = worst(sl), cur = S.eq[w];
    if (S.auto && (!cur || g.score > gen(cur).score)) {
      if (cur) S.bag.push(cur);
      S.eq[w] = it; calc(); dirty = true;
      say('🛡️ 拾って即装備！ [' + RAR[r] + '] ' + g.name);
      trim(); return;
    }
    if (r <= S.sell) {
      var val = sellValue(it); S.gold += val;
      say('💰 [' + RAR[r] + '] ' + g.name + ' を自動売却（+' + fmt(val) + '）');
      return;
    }
    say('✨ [' + RAR[r] + '] ' + g.name + ' をバッグに入れた！');
    S.bag.push(it); trim(); dirty = true;
  }
  function trim() {
    while (S.bag.length > BAG_MAX) {
      var low = null; S.bag.forEach(function (x) { if (!x.x && (!low || gen(x).score < gen(low).score)) low = x; });
      if (!low) return; S.bag.splice(S.bag.indexOf(low), 1); S.gold += sellValue(low);
    }
  }
  function best() {
    var pool = S.bag.concat(Object.keys(S.eq).map(function (k) { return S.eq[k]; }).filter(Boolean));
    var by = function (sl) { return pool.filter(function (x) { return slotOf(x) === sl; }).sort(function (a, b) { return gen(b).score - gen(a).score; }); };
    var eq = { w: null, h: null, b: null, f: null, a1: null, a2: null }, used = [];
    ['w', 'h', 'b', 'f'].forEach(function (sl) { var x = by(sl)[0]; if (x) { eq[sl] = x; used.push(x); } });
    var ac2 = by('a'); eq.a1 = ac2[0] || null; eq.a2 = ac2[1] || null; if (eq.a1) used.push(eq.a1); if (eq.a2) used.push(eq.a2);
    S.eq = eq; S.bag = pool.filter(function (x) { return used.indexOf(x) < 0; }); calc(); dirty = true;
  }
  function find(id) { for (var i = 0; i < S.bag.length; i++) if (S.bag[i].id === id) return S.bag[i]; return null; }
  function equip(it) {
    var sl = slotOf(it), w = worst(sl), cur = S.eq[w];
    S.bag.splice(S.bag.indexOf(it), 1); if (cur) S.bag.push(cur); S.eq[w] = it; calc(); dirty = true;
  }
  function enhCost(it) { return Math.round(30 * Math.pow(1.7, it.p) * (it.l / 10 + 1) * (it.r + 1)); }
  function enhance(it) {
    if (it.p >= 10 || S.gold < enhCost(it)) return;
    S.gold -= enhCost(it); it.p++; it._g = null; calc(); dirty = true;
  }

  // ===== セーブ・ロード =====
  function pack(it) { return [it.s, it.k, it.l, it.r, it.p, it.x]; }
  function unpack(a) { return { s: a[0], k: a[1], l: a[2], r: a[3], p: a[4] || 0, x: a[5] || 0, id: uid++ }; }
  function save() {
    try {
      var o = JSON.parse(JSON.stringify(S, function (k, v) { return (k === 'bag' || k === 'eq') ? undefined : v; }));
      o.bag = S.bag.map(pack); o.eq = {}; Object.keys(S.eq).forEach(function (k) { o.eq[k] = S.eq[k] ? pack(S.eq[k]) : null; });
      localStorage.setItem(SAVE, JSON.stringify(o));
    } catch (e) {}
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(SAVE)); if (!o || !o.bag) return newState();
      var s = Object.assign(newState(), o); s.bag = o.bag.map(unpack);
      s.eq = { w: null, h: null, b: null, f: null, a1: null, a2: null }; Object.keys(o.eq || {}).forEach(function (k) { if (o.eq[k]) s.eq[k] = unpack(o.eq[k]); });
      return s;
    } catch (e) { return newState(); }
  }

  // ===== 描画 =====
  function statLine(g) {
    var p = []; if (g.st.atk) p.push('こうげき+' + g.st.atk); if (g.st.def) p.push('ぼうぎょ+' + g.st.def); if (g.st.hp) p.push('HP+' + g.st.hp); if (g.st.spd) p.push('すばやさ+' + g.st.spd);
    return p.join(' ') + (g.af.length ? '<br>' + g.af.map(function (a) { return a.n + ' ' + a.u + '+' + a.v + '%'; }).join(' / ') : '');
  }
  function itemHtml(it, eqSlot) {
    var g = gen(it), cmp = '';
    if (!eqSlot) { var cur = S.eq[worst(slotOf(it))]; var d = g.score - (cur ? gen(cur).score : 0); cmp = d >= 0 ? '<span class="up">▲+' + d + '</span>' : '<span class="down">▼' + d + '</span>'; }
    var a = eqSlot ? 'data-s="' + eqSlot + '"' : 'data-i="' + it.id + '"';
    return '<div class="it r' + it.r + '"><b>[' + RAR[it.r] + '] ' + g.name + (it.x ? ' 🔒' : '') + '</b><small>強さ ' + g.score + ' ' + cmp + '｜Lv' + it.l + '｜' + statLine(g) + '</small><div class="acts">' +
      (eqSlot ? '' : '<button class="b mini" ' + a + ' data-a="eq" type="button">装備</button><button class="b mini sub" ' + a + ' data-a="sell" type="button">売る 💰' + fmt(sellValue(it)) + '</button>') +
      '<button class="b mini sub" ' + a + ' data-a="enh" type="button"' + (it.p >= 10 || S.gold < enhCost(it) ? ' disabled' : '') + '>強化 💰' + fmt(enhCost(it)) + '</button>' +
      (eqSlot ? '' : '<button class="b mini sub" ' + a + ' data-a="lock" type="button">' + (it.x ? '🔓' : '🔒') + '</button>') + '</div></div>';
  }
  function renderStatic() {
    var h = '';
    SLOTS.forEach(function (sl) { var it = S.eq[sl[0]]; h += '<div style="margin-top:4px"><small class="lead">' + sl[1] + '</small>' + (it ? itemHtml(it, sl[0]) : '<div class="it r0"><b>（なし）</b></div>') + '</div>'; });
    $('eq').innerHTML = h;
    var f = $('fslot').value, so = $('fsort').value, list = S.bag.filter(function (x) { return !f || slotOf(x) === f; });
    list.sort(function (a, b) { return so === 'r' ? (b.r - a.r) || (gen(b).score - gen(a).score) : so === 'n' ? b.id - a.id : gen(b).score - gen(a).score; });
    $('bag').innerHTML = list.slice(0, 40).map(function (x) { return itemHtml(x); }).join('') + (list.length > 40 ? '<p class="lead" style="margin-top:6px">ほか ' + (list.length - 40) + '個</p>' : '');
    $('bagn').textContent = '（' + S.bag.length + ' / ' + BAG_MAX + '）';
    var r = S.rec;
    $('rec').innerHTML = '最高到達：地下' + r.max + '階／倒した魔物：' + fmt(r.kills) + '体／歩数：' + fmt(r.steps) + '歩<br>' +
      '拾った装備：' + fmt(r.drops) + '個／最高レア：' + RAR[r.best] + '／図鑑：ベース ' + Object.keys(r.seenB).length + '/' + K.length * 3 + '・素材 ' + Object.keys(r.seenM).length + '/' + MAT.length;
    $('auto').textContent = S.auto ? '⚡ 自動装備ON' : '自動装備OFF';
    $('auto').className = 'b sub mini' + (S.auto ? ' on' : '');
    dirty = false;
  }
  function renderMap() {
    var hx = Math.floor(VIEW_W / 2), hy = Math.floor(VIEW_H / 2), html = '';
    for (var vy = 0; vy < VIEW_H; vy++) {
      for (var vx = 0; vx < VIEW_W; vx++) {
        var mx = D.px - hx + vx, my = D.py - hy + vy;
        if (mx < 0 || mx >= MAP_W || my < 0 || my >= MAP_H || !D.seen[my][mx]) {
          html += '<div class="cell c-dark"></div>';
          continue;
        }
        var inSight = (mx - D.px) * (mx - D.px) + (my - D.py) * (my - D.py) <= 11;
        if (mx === D.px && my === D.py) {
          html += '<div class="cell c-me">🧙</div>';
        } else if (D.grid[my][mx] === 1) {
          html += '<div class="cell c-wall' + (inSight ? '' : ' dim') + '"></div>';
        } else {
          var icon = '', m = inSight ? mobAt(mx, my) : null, o = objAt(mx, my);
          if (m) icon = m.boss ? '👹' : '👾';
          else if (o) icon = o.t === 'stairs' ? '🪜' : o.t === 'chest' ? '📦' : '⛲';
          html += '<div class="cell c-floor' + (inSight ? '' : ' dim') + '">' + icon + '</div>';
        }
      }
    }
    $('map').innerHTML = html;
  }
  function renderLive() {
    if (dirty) renderStatic();
    var need = Math.round(20 * Math.pow(S.lv, 1.4));
    $('lv').textContent = 'Lv' + S.lv + '（EXP ' + fmt(S.exp) + '/' + fmt(need) + '）';
    $('gold').textContent = '💰 ' + fmt(S.gold);
    $('expbar').style.width = Math.min(100, S.exp / need * 100) + '%';
    $('floor').textContent = '🧭 地下 ' + S.floor + ' 階' + (S.floor % 5 === 0 ? '（ボス階）' : '');
    $('remain').textContent = '魔物 残り ' + D.mobs.length + ' 体';
    $('shd').textContent = S.shield > 0 ? '🛡️' + fmt(S.shield) : '';
    $('php').textContent = fmt(Math.max(0, S.php)) + '/' + fmt(P.hp);
    $('pbar').style.width = Math.max(0, S.php / P.hp * 100) + '%';
    $('pst').textContent = 'ATK ' + fmt(P.atk) + ' DEF ' + fmt(P.def) + ' SPD +' + fmt(P.spd) + ' 会心 ' + P.crit.toFixed(0) + '%';
    var onStairs = objAt(D.px, D.py);
    $('stairs').style.display = (onStairs && onStairs.t === 'stairs') ? 'block' : 'none';
    $('log').textContent = logs.slice(-6).join('\n') || 'ダンジョンを歩いて探索しよう！';
    renderMap();
  }

  // ===== 操作イベント =====
  document.addEventListener('click', function (e) {
    var dirBtn = e.target.closest ? e.target.closest('[data-dir]') : null;
    if (dirBtn) {
      var d = dirBtn.getAttribute('data-dir').split(',');
      step(+d[0], +d[1]);
      return;
    }
    var el = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!el) return;
    var a = el.getAttribute('data-a'), it = el.getAttribute('data-i') ? find(+el.getAttribute('data-i')) : S.eq[el.getAttribute('data-s')];
    if (!it) return;
    if (a === 'eq') equip(it);
    else if (a === 'sell') { S.gold += sellValue(it); S.bag.splice(S.bag.indexOf(it), 1); dirty = true; }
    else if (a === 'enh') enhance(it);
    else if (a === 'lock') { it.x = it.x ? 0 : 1; dirty = true; }
    renderLive(); save();
  });

  $('map').onclick = function (e) {
    var rect = $('map').getBoundingClientRect();
    var dx = (e.clientX - rect.left) - rect.width / 2;
    var dy = (e.clientY - rect.top) - rect.height / 2;
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) step(0, 0);
    else if (Math.abs(dx) > Math.abs(dy)) step(dx > 0 ? 1 : -1, 0);
    else step(0, dy > 0 ? 1 : -1);
  };

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); step(0, -1); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); step(0, 1); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); step(-1, 0); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); step(1, 0); }
    else if (k === ' ' || k === '.') { e.preventDefault(); step(0, 0); }
    else if (k === 'Enter' && $('stairs').style.display !== 'none') { e.preventDefault(); $('stairs').click(); }
  });

  $('wait').onclick = function () { step(0, 0); };
  $('stairs').onclick = function () {
    S.floor++;
    if (S.floor > S.rec.max) S.rec.max = S.floor;
    say('🪜 地下' + S.floor + '階へ降りた！');
    buildFloor(S.floor); dirty = true; renderLive(); save();
  };
  $('town').onclick = function () {
    S.php = P.hp;
    say('⛺ 入口へ戻って体制を立て直した（HP全快・地下' + S.floor + '階を再生成）');
    buildFloor(S.floor); dirty = true; renderLive(); save();
  };
  $('auto').onclick = function () { S.auto = !S.auto; dirty = true; renderLive(); save(); };
  $('best').onclick = function () { best(); say('⚡ ベスト装備にした！'); renderLive(); save(); };
  $('sellall').onclick = function () {
    var g = 0, n = 0; S.bag = S.bag.filter(function (x) { if (!x.x && x.r <= S.sell) { g += sellValue(x); n++; return false; } return true; });
    S.gold += g; say('💰 ' + n + '個を売って、' + fmt(g) + 'ゴールドになった'); dirty = true; renderLive(); save();
  };
  $('fslot').onchange = $('fsort').onchange = function () { dirty = true; renderLive(); };
  $('fsell').innerHTML = RAR.map(function (r, i) { return '<option value="' + i + '">' + (i === 0 ? 'コモンだけ自動売却' : r + '以下を自動売却') + '</option>'; }).join('');
  $('fsell').onchange = function () { S.sell = +$('fsell').value; save(); };
  $('reset').onclick = function () {
    if (confirm('最初からやり直すよ。集めた装備も消えるけど、いいかな？')) {
      S = newState(); logs = []; calc(); buildFloor(1); dirty = true; renderLive(); save();
    }
  };

  // ===== 起動 =====
  S = load(); calc(); $('fsell').value = S.sell; buildFloor(S.floor);
  renderLive();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>もずーじゃぱん (MOZU JAPAN)</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --accent-color: #cccccc;
      --hover-color: #2a2a2a;
      --mozubeya-accent: #ff9800;
      --sns-accent: #2196f3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 市松模様パターン背景 */
    .ichimatsu-pattern {
      background-color: #1a1a1a;
      background-image: 
        linear-gradient(45deg, #111 25%, transparent 25%), 
        linear-gradient(-45deg, #111 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #111 75%), 
        linear-gradient(-45deg, transparent 75%, #111 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
    }

    a {
      color: #90caf9;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
      color: #e3f2fd;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px;
    }

    /* ヘッダーエリア */
    header {
      border: 1px solid var(--border-color);
      margin-bottom: 10px;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 3px solid #555;
    }

    .logo-area {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
    }

    .logo span {
      color: #aaaaaa;
      font-size: 16px;
    }

    .sub-text {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 検索バーエリア */
    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background: #0d0d0d;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      font-size: 13px;
    }

    .search-btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .search-btn:hover {
      background: #444;
    }

    /* メイン 3カラムレイアウト */
    .main-grid {
      display: grid;
      grid-template-columns: 210px 1fr 220px;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      margin-bottom: 10px;
    }

    .panel-header {
      padding: 6px 10px;
      font-weight: bold;
      font-size: 12px;
      border-bottom: 1px solid var(--border-color);
      color: #ffffff;
      display: flex;
      justify-content: space-between;
    }

    .panel-body {
      padding: 8px 10px;
    }

    /* 左側カテゴリメニュー */
    .category-list {
      list-style: none;
    }

    .category-item {
      border-bottom: 1px dashed #2a2a2a;
    }

    .category-item a {
      display: block;
      padding: 6px 8px;
      color: var(--text-main);
      font-size: 12px;
    }

    .category-item a:hover {
      background-color: var(--hover-color);
      text-decoration: none;
    }

    /* 本命コンテンツハイライト */
    .category-item.highlight-link a {
      color: var(--mozubeya-accent);
      font-weight: bold;
    }
    .category-item.highlight-link a:hover {
      background-color: #2a1f0d;
    }

    .category-item.sns-link a {
      color: #64b5f6;
    }

    /* 中央トピックス */
    .tab-nav {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: #141414;
    }

    .tab-item {
      padding: 6px 12px;
      cursor: pointer;
      border-right: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
    }

    .tab-item.active {
      background: var(--card-bg);
      color: #fff;
      font-weight: bold;
      border-bottom: 1px solid var(--card-bg);
    }

    .news-list {
      list-style: none;
      padding: 4px 0;
    }

    .news-item {
      padding: 6px 8px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .news-tag {
      background: #333;
      color: #aaa;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 2px;
      margin-right: 6px;
    }

    .news-item span.time {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* 右側ショートカット */
    .shortcut-btn {
      display: block;
      width: 100%;
      padding: 7px;
      margin-bottom: 6px;
      background: #282828;
      color: #fff;
      border: 1px solid #444;
      text-align: center;
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
    }
    .shortcut-btn:hover {
      background: #383838;
      text-decoration: none;
      color: #fff;
    }
    .shortcut-btn.primary {
      background: #3a2b10;
      border-color: var(--mozubeya-accent);
      color: var(--mozubeya-accent);
      font-weight: bold;
    }
    .shortcut-btn.primary:hover {
      background: #4d3a16;
    }

    footer {
      border-top: 1px solid var(--border-color);
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <header class="ichimatsu-pattern">
    <div class="logo-area">
      <div class="logo">MOZU! <span>JAPAN</span></div>
      <div class="sub-text">もずーじゃぱん ポータル</div>
    </div>
    <div class="sub-text">2026年10月31日 | ポータル開設中</div>
  </header>

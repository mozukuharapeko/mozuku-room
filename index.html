    <style>
        body {

            max-width: 500px;
            margin: 0 auto;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            border-left: 5px solid #3498db;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .menu-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }

        .card-purple {
            background: linear-gradient(135deg, #5b52e0, #413bc7);
            color: #ffffff;
            border-left: none;
        }

        .card-orange {
            border-left-color: #e67e22;
        }

        .card-blue {
            border-left-color: #3498db;
        }

        .card-green {
            border-left-color: #2ecc71;
        }

        .icon-text {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .arrow {
            color: #bdc3c7;
            font-size: 1.1rem;
        }

        .card-purple .arrow {
            color: #ffffff;
        }

        .badge-soon {
            background-color: #f39c12;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: normal;
        }

        /* スクリプトグループ */

            border-radius: 12px;
            padding: 15px;
            border-left: 5px solid #2ecc71;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            margin-top: 5px;
        }

        .script-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .script-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .script-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            text-decoration: none;
            color: #34495e;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .script-item:hover {
            background: #edf2f7;
        }

        .script-item .arrow {
            color: #a0aec0;
            font-size: 0.9rem;

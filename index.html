    <style>
        body {
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), 
                url('./bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 30px 15px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 👑 タイトルヘッダー */
        .site-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .site-title {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 105, 180, 0.6);
            letter-spacing: 2px;
            margin: 0;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            border-left: 5px solid #3498db;
            transition: all 0.25s ease;
        }

        .menu-card:hover {
            transform: translateY(-3px) scale(1.01);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
        }

        .card-purple {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.9), rgba(118, 75, 162, 0.9));
            color: #ffffff;
            border-left: none;
        }

        .card-purple:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 1), rgba(118, 75, 162, 1));
        }

        .card-orange {
            border-left-color: #e67e22;
        }

        .card-blue {
            border-left-color: #3498db;
        }

        .icon-text {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .arrow {
            color: #7f8c8d;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .menu-card:hover .arrow {
            transform: translateX(4px);
            color: #2c3e50;
        }

        .card-purple .arrow {
            color: #ffffff;
        }

        .badge-soon {
            background-color: #f39c12;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: normal;
        }

        /* スクリプトグループ */
        .script-group {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 18px;
            border-left: 5px solid #2ecc71;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            margin-top: 5px;
        }

        .script-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .script-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .script-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(248, 249, 250, 0.8);
            padding: 12px 15px;
            border-radius: 10px;
            text-decoration: none;
            color: #34495e;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .script-item:hover {
            background: #ffffff;
            transform: translateX(3px);
        }

        .script-item .arrow {
            color: #a0aec0;
            font-size: 0.9rem;
        }
    </style>
</head>

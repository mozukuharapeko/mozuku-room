    <style>
        body {
            /* グラデーション ＋ ポップなドット模様 */
            background-color: #eef2f5;
            background-image: 
                radial-gradient(#d0d7de 1.5px, transparent 1.5px),
                linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            background-size: 20px 20px, 100% 100%;
            background-attachment: fixed;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 30px 15px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            border-left: 5px solid #3498db;
            transition: all 0.25s ease;
        }

        .menu-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        .card-purple {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #ffffff;
            border-left: none;
        }

        .card-orange {
            border-left-color: #e67e22;
        }

        .card-blue {
            border-left-color: #3498db;
        }

        .icon-text {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .arrow {
            color: #bdc3c7;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .menu-card:hover .arrow {
            transform: translateX(4px);
        }

        .card-purple .arrow {
            color: #ffffff;
        }

        .badge-soon {
            background-color: #f39c12;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: normal;
        }

        /* スクリプトグループ */
        .script-group {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border-radius: 14px;
            padding: 18px;
            border-left: 5px solid #2ecc71;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            margin-top: 5px;
        }

        .script-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .script-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .script-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 10px;
            text-decoration: none;
            color: #34495e;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .script-item:hover {
            background: #eef2f7;
            transform: translateX(3px);
        }

        .script-item .arrow {
            color: #a0aec0;
            font-size: 0.9rem;
        }
    </style>
</head>

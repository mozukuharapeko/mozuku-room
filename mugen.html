<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 無限読本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1f1f23;
      --card: #2b2b31;
      --card2: #36363d;
      --ink: #ece6e0;
      --ink-soft: #a9a39e;
      --line: #46464e;
      --orange: #ffb27a;
      --orange-soft: #ffd7b8;
      --on-pastel: #3d2e24;
      --mint: #cfeadb;
      --sky: #cfe3f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      font-size: 15px;
      line-height: 1.8;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      padding: 14px;
    }
    a { color: #ffb98a; text-decoration: none; }
    a:hover { text-decoration: underline wavy; text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

    .wrap { max-width: 760px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
      margin-bottom: 14px; padding: 12px 18px;
      background: var(--card); border: 2px solid var(--line); border-radius: 22px;
    }
    h1 { font-size: 24px; font-weight: 900; color: #ffbf93; letter-spacing: .04em; }
    .card {
      background: var(--card); border: 2px solid var(--line); border-radius: 22px;
      padding: 18px 20px; margin-bottom: 14px;
    }
    .lead { color: var(--ink); margin-bottom: 12px; }
    label { display: block; margin-top: 12px; font-size: 13px; color: var(--ink-soft); }
    input[type="text"], select {
      width: 100%; margin-top: 4px; padding: 9px 12px;
      font: inherit; color: var(--ink); background: #232327;
      border: 2px solid var(--line); border-radius: 14px;
    }
    .note { margin-top: 14px; font-size: 12px; color: var(--ink-soft); line-height: 1.7; }

    button {
      font: inherit; font-weight: 700; cursor: pointer;
      padding: 9px 22px; border-radius: 99px; border: none;
      background: var(--orange); color: var(--on-pastel); box-shadow: 0 3px 0 #c4824f;
    }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #c4824f; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.sub { background: transparent; color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
    button.link { background: none; box-shadow: none; color: #ffb98a; padding: 6px 8px; text-decoration: underline; font-weight: 500; }
    #btn-start { margin-top: 16px; }

    .story-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    #s-title { font-size: 20px; font-weight: 900; color: var(--orange-soft); }
    #s-progress { font-size: 12px; color: var(--ink-soft); background: var(--card2); border-radius: 99px; padding: 2px 12px; }

    .scene p { margin-bottom: 10px; }
    .past { opacity: .78; padding-bottom: 6px; margin-bottom: 8px; border-bottom: 2px dotted var(--line); }
    .answer { color: var(--mint); font-size: 14px; margin-bottom: 8px; }
    .ask { margin-top: 12px; padding: 10px 14px; background: var(--card2); border-left: 5px solid var(--orange); border-radius: 12px; font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
    .actions input[type="text"] { flex: 1 1 220px; margin-top: 0; }
    #s-status { min-height: 1.8em; margin-top: 10px; font-size: 13px; color: var(--sky); }
    .loading::after { content: "…"; animation: blink 1.2s steps(3, end) infinite; }
    @keyframes blink { 0% { opacity: .2; } 50% { opacity: 1; } 100% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { .loading::after { animation: none; } }

    #s-end, #s-error { margin-top: 14px; padding-top: 12px; border-top: 2px dashed var(--line); }
    .fin { font-weight: 900; font-size: 18px; color: var(--orange-soft); margin-bottom: 8px; }
    #s-error-msg { color: #f3b1b1; margin-bottom: 8px; }
    footer { text-align: center; font-size: 12px; color: var(--ink-soft); margin: 14px 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📖 無限読本</h1>
      <a href="./index.html">🏠 もずべやに戻る</a>
    </header>

    <!-- はじめの画面 -->
    <section id="setup" class="card">
      <p class="lead">名前・ジャンル・キーワードを入れると、AIが物語のはじまりを書くよ。場面の終わりで、「はい／いいえ」で答えたり、言葉を書いたりして、続きを決めていこう。全部で5場面だよ。</p>

      <label for="f-name">主人公の名前（空でもOK。本名は入れないでね）</label>
      <input id="f-name" type="text" maxlength="20" autocomplete="off">

      <label for="f-genre">ジャンル</label>
      <select id="f-genre">
        <option>恋愛物</option>
        <option>ファンタジー物</option>
        <option>メルヘン物</option>
        <option>アクション物</option>
        <option>お笑い物</option>
      </select>

      <label for="f-keyword">キーワード（空でもOK）</label>
      <input id="f-keyword" type="text" maxlength="30" autocomplete="off">

      <p class="note">
        入れた名前・キーワード・答えは、AIの会社に送られるよ。住所や電話番号など、個人の情報は入れないでね。
        既存の作品名やキャラクター名も、避けてね。物語はAIが作ったフィクションで、実際の出来事や人とは関係ないよ。
      </p>
      <button id="btn-start" type="button">はじめる</button>
    </section>

    <!-- 物語の画面 -->
    <section id="story" class="card" hidden>
      <div class="story-head">
        <h2 id="s-title"></h2>
        <span id="s-progress"></span>
      </div>

      <div id="s-log"></div>
      <div id="s-current" class="scene" aria-live="polite"></div>
      <p id="s-ask" class="ask" hidden></p>

      <div id="s-yesno" class="actions" hidden>
        <button id="btn-yes" type="button">はい</button>
        <button id="btn-no" type="button">いいえ</button>
        <button id="btn-other" type="button" class="link">ほかの答えを書く</button>
      </div>

      <div id="s-text" class="actions" hidden>
        <input id="a-text" type="text" maxlength="60" placeholder="ここに書いてね（60文字まで）" autocomplete="off" aria-label="あなたの答え">
        <button id="btn-send" type="button">すすむ</button>
        <button id="btn-omakase" type="button" class="sub">おまかせ</button>
      </div>

      <p id="s-status" role="status"></p>

      <div id="s-end" hidden>
        <p class="fin">おしまい</p>
        <div class="actions">
          <button id="btn-copy" type="button">物語をコピー</button>
          <button id="btn-again" type="button" class="sub">もう一度あそぶ</button>
        </div>
      </div>

      <div id="s-error" hidden>
        <p id="s-error-msg"></p>
        <div class="actions">
          <button id="btn-retry" type="button">もう一度試す</button>
          <button id="btn-back" type="button" class="sub">はじめに戻る</button>
        </div>
      </div>

      <div class="actions" id="s-reset" hidden>
        <button id="btn-reset" type="button" class="link">はじめに戻る</button>
      </div>
    </section>

    <footer>&copy; 2026 もずべや</footer>
  </div>

  <script>
    (function () {
      'use strict';

      var MAX_SCENES = 5;
      var MAX_ANSWER = 60;
      var API_URL = '/api/generate';

      var state = null;   // { name, genre, keyword, title, scenes:[{scene,ask,kind,answer}], current:{scene,ask,kind}|null, error, writeMode }
      var busy = false;

      function $(id) { return document.getElementById(id); }
      function reduceMotion() {
        return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      // ---- 表示のための小さな道具 ----
      function addParagraphs(parent, text, cls) {
        String(text || '').split(/\n+/).forEach(function (line) {
          var t = line.trim();
          if (!t) return;
          var p = document.createElement('p');
          if (cls) p.className = cls;
          p.textContent = t;
          parent.appendChild(p);
        });
      }

      function render() {
        if (!state) return;
        $('s-title').textContent = state.title || '';
        var n = Math.min(MAX_SCENES, state.scenes.length + 1);
        $('s-progress').textContent = '場面 ' + n + ' / ' + MAX_SCENES;

        // これまでの場面
        var log = $('s-log');
        log.textContent = '';
        state.scenes.forEach(function (s) {
          var box = document.createElement('div');
          box.className = 'past scene';
          addParagraphs(box, s.scene);
          var a = document.createElement('p');
          a.className = 'answer';
          a.textContent = '▶ ' + (s.ask ? s.ask + ' → ' : '') + s.answer;
          box.appendChild(a);
          log.appendChild(box);
        });

        // いまの場面
        var cur = $('s-current');
        cur.textContent = '';
        if (state.current) addParagraphs(cur, state.current.scene);

        updateControls();
      }

      function updateControls() {
        if (!state) return;
        var cur = state.current;
        var ready = !!cur && !busy && !state.error;
        var ended = !!cur && cur.kind === 'end';

        var askEl = $('s-ask');
        askEl.textContent = (cur && !ended) ? cur.ask : '';
        askEl.hidden = !(cur && !ended && cur.ask);

        $('s-yesno').hidden = !(ready && cur.kind === 'yesno' && !state.writeMode);
        $('s-text').hidden = !(ready && !ended && (cur.kind === 'text' || (cur.kind === 'yesno' && state.writeMode)));
        $('s-end').hidden = !(ready && ended);
        $('s-error').hidden = !state.error;
        $('s-error-msg').textContent = state.error || '';
        $('s-reset').hidden = !(ready && !ended);

        var status = $('s-status');
        if (busy) {
          status.textContent = 'つづきを書いているよ（10〜20秒くらいかかるよ）';
          status.className = 'loading';
        } else {
          status.className = '';
        }
      }

      function focusAndScroll() {
        var target = $('s-current');
        if (target.scrollIntoView) {
          target.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
        }
        var next = !$('s-yesno').hidden ? $('btn-yes')
          : !$('s-text').hidden ? $('a-text')
          : !$('s-end').hidden ? $('btn-copy') : null;
        if (next && next.focus) next.focus({ preventScroll: true });
      }

      // ---- サーバーとのやりとり ----
      async function callApi(body) {
        var res;
        try {
          res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        } catch (e) {
          throw new Error('つながらなかったよ。ネットワークを確認して、もう一度試してね');
        }
        var data = null;
        try { data = await res.json(); } catch (e) { data = null; }
        if (!res.ok) {
          if (res.status === 404) {
            throw new Error('このページでは動かないみたい。vercel.app のURLで開いてね');
          }
          throw new Error(((data && data.error) || 'うまくいかなかったよ') + '［' + ((data && data.code) || ('http_' + res.status)) + '］');
        }
        if (!data || typeof data.scene !== 'string' || !data.scene) {
          throw new Error('返事がうまく読めなかったよ。もう一度試してね');
        }
        return data;
      }

      async function requestScene() {
        state.error = '';
        busy = true;
        updateControls();
        var turn = state.scenes.length + 1;
        var body = {
          name: state.name,
          genre: state.genre,
          keyword: state.keyword,
          turn: turn,
          history: state.scenes.map(function (s) {
            return { scene: s.scene, ask: s.ask, answer: s.answer };
          })
        };
        var ok = false;
        try {
          var data = await callApi(body);
          if (turn === 1) state.title = data.title || '無題';
          state.current = {
            scene: data.scene,
            ask: data.ask || '',
            kind: data.last ? 'end' : (data.kind === 'yesno' ? 'yesno' : 'text')
          };
          state.writeMode = false;
          ok = true;
        } catch (e) {
          state.error = e.message;
        }
        busy = false;
        render();
        if (ok) focusAndScroll();
      }

      // ---- 操作 ----
      function startStory() {
        if (busy) return;
        state = {
          name: $('f-name').value.trim(),
          genre: $('f-genre').value,
          keyword: $('f-keyword').value.trim(),
          title: '',
          scenes: [],
          current: null,
          error: '',
          writeMode: false
        };
        $('setup').hidden = true;
        $('story').hidden = false;
        $('a-text').value = '';
        $('s-status').textContent = '';
        render();
        requestScene();
      }

      function submitAnswer(text) {
        if (busy || !state || !state.current || state.current.kind === 'end') return;
        var a = Array.from(String(text || '').trim()).slice(0, MAX_ANSWER).join('');
        if (!a) {
          $('s-status').className = '';
          $('s-status').textContent = '何か書いてね（「おまかせ」も選べるよ）';
          return;
        }
        state.scenes.push({
          scene: state.current.scene,
          ask: state.current.ask,
          kind: state.current.kind,
          answer: a
        });
        state.current = null;
        $('a-text').value = '';
        render();
        requestScene();
      }

      function backToSetup(force) {
        if (busy) return;
        if (!force && state && state.scenes.length > 0 && !confirm('物語をやめて、はじめに戻るよ。いいかな？')) return;
        state = null;
        $('story').hidden = true;
        $('setup').hidden = false;
        $('s-log').textContent = '';
        $('s-current').textContent = '';
        window.scrollTo(0, 0);
      }

      function storyText() {
        var out = ['【題】' + (state.title || '無題'), ''];
        state.scenes.forEach(function (s) {
          out.push(s.scene, '', '▶ ' + (s.ask ? s.ask + ' → ' : '') + s.answer, '');
        });
        if (state.current) out.push(state.current.scene);
        return out.join('\n').trim();
      }

      function copyStory() {
        var text = storyText();
        var status = $('s-status');
        status.className = '';
        function fail() { status.textContent = 'コピーできなかったよ。文字を選んで、コピーしてね'; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            status.textContent = 'コピーしたよ';
          }, fail);
        } else {
          fail();
        }
      }

      // ---- ボタンをつなぐ ----
      $('btn-start').addEventListener('click', startStory);
      $('btn-yes').addEventListener('click', function () { submitAnswer('はい'); });
      $('btn-no').addEventListener('click', function () { submitAnswer('いいえ'); });
      $('btn-other').addEventListener('click', function () {
        if (!state) return;
        state.writeMode = true;
        updateControls();
        $('a-text').focus();
      });
      $('btn-send').addEventListener('click', function () { submitAnswer($('a-text').value); });
      $('btn-omakase').addEventListener('click', function () { submitAnswer('おまかせ'); });
      $('a-text').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          submitAnswer($('a-text').value);
        }
      });
      $('btn-copy').addEventListener('click', copyStory);
      $('btn-again').addEventListener('click', function () { backToSetup(true); });
      $('btn-retry').addEventListener('click', function () { if (!busy && state) requestScene(); });
      $('btn-back').addEventListener('click', function () { backToSetup(true); });
      $('btn-reset').addEventListener('click', function () { backToSetup(false); });
    })();
  </script>
</body>
</html>

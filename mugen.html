<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📖 無限読本</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
    :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    html, body { height: 100%; }
    #story-body { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

<header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center shadow-md">
    <h1 class="text-xl font-bold tracking-wider flex items-center gap-2">
        <span>📖</span> 無限読本 <span class="text-xs bg-pink-600 px-2 py-0.5 rounded-full">AI短編小説ジェネレーター</span>
    </h1>
    <a href="./index.html" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-2 px-3 rounded-xl transition">🏠 もずべやに戻る</a>
</header>

<main class="flex-grow container mx-auto px-4 py-6 max-w-2xl w-full space-y-5">

    <div class="bg-slate-800/80 backdrop-blur border border-slate-700 p-5 rounded-2xl shadow-xl space-y-4">
        <div>
            <label for="in-name" class="block text-sm font-bold text-slate-300 mb-1">主人公の名前（空でもOK）</label>
            <input id="in-name" type="text" maxlength="20" placeholder="例：ミカゲ"
                   class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100">
            <p class="text-[11px] text-amber-300/90 mt-1">⚠️ 本名は入れないでね。ここに入れた名前はAI（Gemini）に送られるよ。</p>
        </div>

        <div>
            <label for="in-genre" class="block text-sm font-bold text-slate-300 mb-1">ジャンル</label>
            <select id="in-genre" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100">
                <option value="恋愛物">恋愛物</option>
                <option value="ファンタジー物">ファンタジー物</option>
                <option value="メルヘン物">メルヘン物</option>
                <option value="アクション物">アクション物</option>
                <option value="お笑い物">お笑い物</option>
            </select>
        </div>

        <div>
            <label for="in-keyword" class="block text-sm font-bold text-slate-300 mb-1">キーワード（空でもOK）</label>
            <input id="in-keyword" type="text" maxlength="30" placeholder="例：古時計、雨、約束"
                   class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100">
        </div>

        <button id="btn-make" onclick="makeStory()"
                class="w-full bg-pink-600 hover:bg-pink-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-2.5 rounded-xl transition">
            ✨ 物語を作る
        </button>
        <p id="status" class="text-xs text-center min-h-[1.2em]"></p>
    </div>

    <div id="story-box" class="hidden bg-slate-800/80 backdrop-blur border border-slate-700 p-6 rounded-2xl shadow-xl space-y-3">
        <h2 id="story-title" class="text-lg font-black text-pink-300"></h2>
        <p id="story-body" class="text-sm leading-relaxed text-slate-100"></p>
    </div>

</main>

<footer class="text-center py-6 text-xs text-slate-500">&copy; 2026 もずべや - AI海蘊 監修</footer>

<script>
const API_URL = './api/generate';
let busy = false;

function setStatus(text, isError) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'text-xs text-center min-h-[1.2em] ' + (isError ? 'text-rose-400 font-bold' : 'text-slate-400');
}

function showStory(fullText) {
    const box = document.getElementById('story-box');
    const titleEl = document.getElementById('story-title');
    const bodyEl = document.getElementById('story-body');

    let title = '';
    let body = fullText;
    const m = fullText.match(/^【題】([^\n]*)\n?([\s\S]*)$/);
    if (m) {
        title = m[1].trim();
        body = m[2].trim();
    }

    titleEl.textContent = title;
    bodyEl.textContent = body;
    box.classList.remove('hidden');
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function makeStory() {
    if (busy) return;
    busy = true;
    const btn = document.getElementById('btn-make');
    btn.disabled = true;
    setStatus('物語を作っているよ…（少し時間がかかることがあるよ）', false);
    document.getElementById('story-box').classList.add('hidden');

    const name = document.getElementById('in-name').value;
    const genre = document.getElementById('in-genre').value;
    const keyword = document.getElementById('in-keyword').value;

    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, genre, keyword })
        });

        let data = null;
        try { data = await res.json(); } catch (e) {}

        if (!res.ok || !data || data.error) {
            const reason = (data && data.error) ? data.error : ('エラー ' + res.status);
            setStatus('接続に失敗したみたい……（' + reason + '）', true);
            return;
        }

        if (!data.text) {
            setStatus('物語がうまく作れなかったみたい。もう一度試してね', true);
            return;
        }

        setStatus('', false);
        showStory(data.text);
    } catch (e) {
        console.error(e);
        setStatus('接続に失敗したみたい……（通信エラー）', true);
    } finally {
        busy = false;
        btn.disabled = false;
    }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弁明＆悪手回避クエスト 〜ディスコ修羅場編〜</title>
<style>
  :root { --bg:#19181d; --panel:#26252c; --panel2:#32313b; --ink:#f2ece6; --soft:#a8a29e; --line:#454350; --accent:#ff9f68; --on:#2c1d14; --ok:#6ee7b7; --warn:#f87171; --pepsi:#60a5fa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { touch-action: manipulation; }
  body { font-family: "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; font-size: 15px; line-height: 1.6; background: var(--bg); color: var(--ink); padding: 14px 14px calc(18px + env(safe-area-inset-bottom, 0px)); user-select: none; }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  h1 { font-size: 15px; color: var(--accent); }
  .badge { font-size: 11px; color: var(--soft); background: var(--panel2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 12px; }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; font-size: 12px; }
  .meter { background: #141318; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
  .meter-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar.trust i { display: block; height: 100%; background: var(--ok); transition: width 0.25s; }
  .bar.chaos i { display: block; height: 100%; background: var(--warn); transition: width 0.25s; }
  .stage { background: #141318; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; text-align: center; min-height: 104px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .cast { font-size: 32px; letter-spacing: 6px; }
  .scene-title { font-size: 13px; font-weight: 700; color: var(--pepsi); }
  .scene-sub { font-size: 11px; color: var(--soft); }
  #msg { min-height: 5.2em; background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px; }
  .choices { display: flex; flex-direction: column; gap: 7px; }
  button.choice { text-align: left; width: 100%; padding: 10px 12px; font: inherit; font-size: 13px; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; transition: transform 0.06s, border-color 0.15s; }
  button.choice:hover { border-color: var(--accent); }
  button.choice:active { transform: scale(0.99); background: #3f3d4a; }
  button.primary { background: var(--accent); color: var(--on); border-color: #d97b43; font-weight: 700; text-align: center; }
  .note { margin-top: 10px; font-size: 11px; color: var(--soft); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗣️ 弁明＆悪手回避クエスト</h1>
    <span class="badge" id="turnBadge">1 / 6</span>
  </header>

  <div class="panel">
    <div class="meters">
      <div class="meter">
        <div class="meter-top"><span>🟢 納得度</span><span id="trustVal">70</span></div>
        <div class="bar trust"><i id="trustBar" style="width:70%"></i></div>
      </div>
      <div class="meter">
        <div class="meter-top"><span>🔥 カオス度</span><span id="chaosVal">15</span></div>
        <div class="bar chaos"><i id="chaosBar" style="width:15%"></i></div>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="cast" id="cast">🐍🧙‍♀️🙏</div>
      <div class="scene-title" id="sceneTitle">18:21 ディスコ移動直後</div>
      <div class="scene-sub" id="sceneSub">酔っ払いまとめログの検証中…</div>
    </div>

    <div id="msg" role="status" aria-live="polite"></div>
    <div class="choices" id="choices"></div>
  </div>

  <p class="note">悪手を選ぶと矛盾や巻き込みを突っ込まれてカオス度が上昇します。100%になると大炎上！</p>
</div>

<script>
(function () {
  'use strict';

  var state = {
    step: 0,
    trust: 70,
    chaos: 15,
    ended: false
  };

  // 実話ログをベースにした6ステップのシナリオ
  var SCENES = [
    {
      time: '18:21 どじょ部屋〜ディスコ',
      sub: '秘密メッセージが気づかれなかった件と噂の整理',
      cast: '🐍🧙‍♀️🙏',
      lines: [
        'やにたん「昨日どじょ部屋で秘密送ったのに最初気づかれんかったわw 噂が色々吹聴されとるぞ！」',
        '吹聴リスト：サンドラ好意説・オナ電ネタ・ラサール学歴マウント。どう整理する？'
      ],
      options: [
        {
          label: '事実を冷静に整理する（サンドラは粘着・オナ電はネタ・中受は流れ）',
          trust: +10, chaos: -5,
          reply: '海蘊＆やにたん「なるほど、伝言ゲームと誇張が混ざっとるんやな。一旦そこは把握した。」'
        },
        {
          label: '「全部ゆうなの虚言癖のせいです！」と全振りする',
          trust: -10, chaos: +20,
          reply: '海蘊「まあその場にいたわけじゃないけど、全部人のせいにすると話が荒れるぞw」'
        },
        {
          label: '「オナ電ネタも俺の悪ノリだし、俺が悪者で丸く収めよう！」と提案する',
          trust: -5, chaos: +15,
          reply: 'やにたん「なんで自分で株下げようとしとんねんw まず事実関係やろ。」'
        }
      ]
    },
    {
      time: '19:20 経緯のすり合わせ',
      sub: '特定リスク・情と責任・それぞれの落ち度まとめ',
      cast: '🙏🧙‍♀️🐍',
      lines: [
        '海蘊「ひじきの八方美人、ゆうなの誇張、なのの思い込み、私の盲信…勘違いから始まった話やね。」',
        'やにたん「リアル特定されそうで動けんのもダルいよな。で、結局どうしたいんや？」'
      ],
      options: [
        {
          label: '「情と責任でついていったし、戻れる土壌を整えたい」と本音を伝える',
          trust: +5, chaos: +5,
          reply: 'やにたん「なるほど、なのたんが戻ってきやすいようにしたいんか。」'
        },
        {
          label: '「完全に特定されてるわけじゃないし、精神不安定でも安全だから大丈夫！」と押し切る',
          trust: -15, chaos: +20,
          reply: '海蘊「『完全じゃないけど誰にも言わないと言われた』『精神不安定』って、矛盾してない？」'
        },
        {
          label: '「俺は被害者だし、なのもひじきもどっちも悪いってことにしておこう」',
          trust: -10, chaos: +15,
          reply: 'やにたん「いや、なのもひじきもカスって認識はあるけど、話が噛み合っとらんぞ。」'
        }
      ]
    },
    {
      time: '21:27 禁断の悪手プラン',
      sub: '「やにたんにスケベ目的で聞いたことにすれば丸く収まる」発言',
      cast: '🧙‍♀️🐍🙏',
      lines: [
        'あなた「早い話、俺がヤニうさにすけべ目的でディスコード聞きましたって言ったら丸く収まる気もしてきたな」',
        'やにたん「嘘を重ねようとすんなw それを私とかガリが黙って『そうそう』ってなると思う？」'
      ],
      options: [
        {
          label: '「確かに悪手すぎるわ…無関係なやにたんを嘘のダシにするのはやめる」',
          trust: +15, chaos: -10,
          reply: 'やにたん「なんねーよ！余計話ややこしくするから絶対やめろw」'
        },
        {
          label: '「だってガリは『なーんだ』ってなると思うし、俺がスケベ扱いされるだけじゃん」',
          trust: -20, chaos: +25,
          reply: '海蘊「みんなが誤解だって説得してたのをひっくり返す嘘は、普通に巻き込んでるし悪手すぎでしょw」'
        },
        {
          label: '「よく知りもしない話でややこしくしたのはお互いさまじゃね？」と反論する',
          trust: -25, chaos: +30,
          reply: 'やにたん「あんたが落ち着きなさい！感情論抜きにしてくれ！」'
        }
      ]
    },
    {
      time: '22:01 ガリの言葉とケジメ',
      sub: '「お前が悪者になれ」の解釈のズレ',
      cast: '🙏🧙‍♀️🐍',
      lines: [
        'あなた「なんかさ、ガリに『お前が悪者になれ』って言われたんだよ」',
        '海蘊「今この場にいないガリのせいにするのはさすがにずるくない？ ｺﾞｺﾞｺﾞｺﾞｺ」'
      ],
      options: [
        {
          label: '「ガリのせいにするつもりはなかった。軽率な立ち回りのケジメをつける」',
          trust: +15, chaos: -5,
          reply: '海蘊「そういう意味ならまだ分かるけど、嘘のすけべ話を作るのは絶対違うからね。」'
        },
        {
          label: '「ガリの意見聞いてそうだなって思ったんだよ。この場合ケジメって何？」',
          trust: -10, chaos: +15,
          reply: 'やにたん「うむうむ。認識のズレがあったな。ケジメは『なのたんを切る！』だな。」'
        },
        {
          label: '「じゃあ俺は何を説明すればええんや…何言っても保身にならんか」',
          trust: -15, chaos: +20,
          reply: '海蘊「ガリの言葉まで自分の保身の言い訳に使うのはマジでやめたほうがいい。」'
        }
      ]
    },
    {
      time: '22:08 ズレの確認とお開き',
      sub: '「勝手な嘘のストーリーでこっちを巻き込まない」',
      cast: '🧙‍♀️🙏🐍',
      lines: [
        'やにたん「でもなのたん切るには特定が怖い、情がある…で詰んでんのよな」',
        '海蘊「とにかく『勝手な嘘のストーリーでこっちを巻き込まない』これだけ守ってくれればそれでいいから今日はお開きにしよう！」'
      ],
      options: [
        {
          label: '「おけ、了解。今日はここまでにしておこう、お疲れ様！」',
          trust: +15, chaos: -10,
          reply: 'やにたん「もずくたんお疲れ様だ。すまないの。」'
        },
        {
          label: '「ちょっと待って、そもそもなのが部屋抜けた理由は把握してる？」と食い下がる',
          trust: -10, chaos: +15,
          reply: 'やにたん「やにうさ居るからじゃないの？ まあ今日はもうお開きにしようぜ。」'
        },
        {
          label: '「まあそうなんだけど…納得したわけじゃないけどおけ」',
          trust: -15, chaos: +15,
          reply: '海蘊「はいはい、とりあえず今日は解散！帰ってペプシ飲むぞ！」'
        }
      ]
    },
    {
      time: '22:30 深夜のフォローとペプシ',
      sub: '最終着地フェーズ',
      cast: '🥤🧙‍♀️🙏',
      lines: [
        '海蘊「帰ってペプシ飲むぞ！」',
        'やにたん「裏でちょっと話してた。やにうさに下心目的で〜云々は悪手の話をしたわ。いっぱいペプシ飲んでな。」'
      ],
      options: [
        {
          label: '「よく状況も把握せず見当違いなこと提案して申し訳なかった。フォローありがとう！」',
          trust: +20, chaos: -15,
          reply: '海蘊「全然大丈夫だよ、分かってくれたならそれでいい！ゆっくり休んでね〜」'
        },
        {
          label: '「やっぱ俺が悪者になった方が良かったんじゃ…（未練タラタラ）」',
          trust: -20, chaos: +25,
          reply: 'やにたん「まだ言うかw もうペプシ飲んで寝ろ！」'
        },
        {
          label: '「ペプシうまいよね！（急に話題を変える）」',
          trust: +5, chaos: +5,
          reply: '海蘊「いきなりペプシの話かよw まあいいや、おつかれさま！」'
        }
      ]
    }
  ];

  function $(id) { return document.getElementById(id); }

  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  function updateMeters() {
    state.trust = clamp(state.trust, 0, 100);
    state.chaos = clamp(state.chaos, 0, 100);
    $('trustVal').textContent = state.trust;
    $('chaosVal').textContent = state.chaos;
    $('trustBar').style.width = state.trust + '%';
    $('chaosBar').style.width = state.chaos + '%';
  }

  function renderEnding(isGood) {
    state.ended = true;
    $('turnBadge').textContent = 'END';
    $('choices').innerHTML = '';

    if (isGood) {
      $('cast').textContent = '🥤✨😌';
      $('sceneTitle').textContent = 'エンディング：ペプシを飲んで就寝';
      $('sceneSub').textContent = '悪手を回避し、巻き込み事故を最小限に抑えた！';
      $('msg').innerHTML =
        '<strong>【CLEAR：平穏な夜】</strong><br>' +
        '勝手な嘘のストーリーで周りを巻き込むのを踏みとどまり、海蘊とやにたんとの認識もなんとかすり合わせ完了！<br>' +
        '最終 納得度: ' + state.trust + ' ／ カオス度: ' + state.chaos;
    } else {
      $('cast').textContent = '🔥💥😵';
      $('sceneTitle').textContent = 'バッドエンド：ディスコ大炎上';
      $('sceneSub').textContent = '矛盾と悪手が重なり、話がさらにややこしくなった…';
      $('msg').innerHTML =
        '<strong>【BAD END：収拾不能】</strong><br>' +
        '「お便所いきたい あーん」「ｺﾞｺﾞｺﾞｺﾞｺ」の空気の中、矛盾と悪手プランが爆発！<br>' +
        '最終 納得度: ' + state.trust + ' ／ カオス度: ' + state.chaos;
    }

    var retry = document.createElement('button');
    retry.className = 'choice primary';
    retry.textContent = 'もう一度やり直す';
    retry.onclick = startGame;
    $('choices').appendChild(retry);
  }

  function renderStep() {
    if (state.chaos >= 100 || state.trust <= 0) {
      renderEnding(false);
      return;
    }
    if (state.step >= SCENES.length) {
      renderEnding(state.chaos < 65 && state.trust >= 35);
      return;
    }

    var sc = SCENES[state.step];
    $('turnBadge').textContent = (state.step + 1) + ' / ' + SCENES.length;
    $('cast').textContent = sc.cast;
    $('sceneTitle').textContent = sc.time;
    $('sceneSub').textContent = sc.sub;
    $('msg').innerHTML = sc.lines.join('<br>');

    var box = $('choices');
    box.innerHTML = '';
    sc.options.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = opt.label;
      btn.onclick = function () {
        state.trust += opt.trust;
        state.chaos += opt.chaos;
        updateMeters();

        if (state.chaos >= 100 || state.trust <= 0) {
          renderEnding(false);
          return;
        }

        $('msg').innerHTML =
          opt.reply +
          '<br><span style="font-size:11px;color:var(--soft);">（納得度 ' +
          (opt.trust >= 0 ? '+' : '') + opt.trust +
          ' / カオス度 ' + (opt.chaos >= 0 ? '+' : '') + opt.chaos + '）</span>';

        box.innerHTML = '';
        var nextBtn = document.createElement('button');
        nextBtn.className = 'choice primary';
        nextBtn.textContent = state.step + 1 < SCENES.length ? '次の展開へ ▶' : '最終結果を見る ▶';
        nextBtn.onclick = function () {
          state.step++;
          renderStep();
        };
        box.appendChild(nextBtn);
      };
      box.appendChild(btn);
    });
  }

  function startGame() {
    state = { step: 0, trust: 70, chaos: 15, ended: false };
    updateMeters();
    renderStep();
  }

  startGame();
})();
</script>
</body>
</html>
